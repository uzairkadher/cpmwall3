<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="robots" content="noindex, nofollow">
<title>Login - EMPIRE STUDIO</title>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@700&family=Inter:wght@400;600&display=swap" rel="stylesheet">
<style>
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
body {
  margin: 0;
  padding: 14px;
  min-height: 100vh;
  background: radial-gradient(900px at 50% -20%, rgba(255,184,0,.3), transparent), radial-gradient(700px at 100% 100%, rgba(255,217,90,.15), transparent), #07070A;
  color: #fff;
  font-family: Inter, sans-serif;
  display: flex;
  justify-content: center;
  align-items: center;
}
.card-luxury {
  position: relative;
  width: 100%;
  max-width: 380px;
  background: linear-gradient(180deg, rgba(255,255,255,.09), rgba(255,255,255,.03));
  border: 1px solid rgba(255,217,90,.35);
  border-radius: 28px;
  padding: 28px 24px 22px;
  box-shadow: 0 0 0 1px rgba(255,217,90,.08), 0 0 80px rgba(255,184,0,.25), inset 0 1px 0 rgba(255,255,255,.2);
  backdrop-filter: blur(20px);
  text-align: center;
}
.logo-wrap { display: grid; place-items: center; margin-bottom: 14px; }
.logo-luxury {
  width: 84px;
  height: 84px;
  border-radius: 50%;
  background: radial-gradient(180deg, #FFD95A, #FF9A00);
  display: grid;
  place-items: center;
  font-family: Syne, sans-serif;
  font-weight: 800;
  font-size: 28px;
  color: black;
  box-shadow: 0 0 40px rgba(255,184,0,.8), inset 0 2px 0 rgba(255,255,255,.6);
}
.card-luxury h1 { font-family: Syne, sans-serif; color: white; font-size: 22px; letter-spacing: 1px; margin: 0; }
.sub-luxury { margin-top: 6px; color: #d6c79f; font-size: 12px; }
.tabs { display: flex; gap: 8px; margin-top: 20px; background: rgba(0,0,0,0.4); padding: 4px; border-radius: 14px; border: 1px solid rgba(255,217,90,0.2); }
.tab { flex: 1; background: transparent; border: none; color: #a1a1aa; padding: 10px; font-weight: 700; font-size: 12px; border-radius: 10px; cursor: pointer; transition: 0.2s; }
.tab.active { background: linear-gradient(180deg, #FFE68A, #FFB800); color: #000; }
.input-wrap { position: relative; margin-top: 16px; text-align: left; }
.input-wrap label { font-size: 11px; color: #d6c79f; margin-left: 4px; font-weight: 600; }
.input-wrap input {
  width: 100%;
  background: rgba(0,0,0,.5);
  border: 1px solid rgba(255,217,90,.35);
  border-radius: 14px;
  padding: 12px 14px;
  color: white;
  outline: none;
  font-size: 13px;
  margin-top: 4px;
  transition: .2s;
}
.input-wrap input:focus { border-color: #FFD95A; box-shadow: 0 0 0 3px rgba(255,217,90,.15); }
.login-btn-luxury {
  margin-top: 20px;
  width: 100%;
  background: linear-gradient(180deg, #FFE68A, #FFB800);
  border: none;
  padding: 14px;
  border-radius: 14px;
  font-weight: 800;
  font-size: 16px;
  cursor: pointer;
  box-shadow: 0 10px 30px rgba(255,184,0,.4);
  color: #000;
  transition: 0.15s;
}
.login-btn-luxury:active { transform: scale(.98); }
.switch-mode { margin-top: 16px; font-size: 12px; color: #a1a1aa; cursor: pointer; }
.switch-mode span { color: #FFD95A; font-weight: 700; text-decoration: underline; }
#authError { color: #ef4444; font-size: 11px; margin-top: 8px; font-weight: 600; min-height: 14px; }
.foot { margin-top: 16px; color: #b49c6a; font-size: 10px; }
</style>
</head>
<body>

<div class="card-luxury">
  <div class="logo-wrap"><div class="logo-luxury">ES</div></div>
  <h1>EMPIRE STUDIO</h1>
  <div class="sub-luxury">Car Parking Multiplayer Community Wall</div>

  <div class="tabs">
    <button type="button" id="tabLogin" class="tab active" onclick="switchMode('login')">Login</button>
    <button type="button" id="tabRegister" class="tab" onclick="switchMode('register')">Create Account</button>
  </div>

  <div class="input-wrap">
    <label>USERNAME</label>
    <input type="text" id="userInput" placeholder="e.g. driver_77 (a-z, 0-9, _, .)" autocomplete="username">
  </div>

  <div class="input-wrap">
    <label>PASSWORD</label>
    <input type="password" id="passInput" placeholder="At least 6 characters" autocomplete="current-password">
  </div>

  <div class="input-wrap" id="confirmWrap" style="display:none;">
    <label>CONFIRM PASSWORD</label>
    <input type="password" id="confirmInput" placeholder="Re-enter password" autocomplete="new-password">
  </div>

  <div id="authError"></div>

  <button type="button" class="login-btn-luxury" id="submitBtn" onclick="handleSubmit()">Login</button>

  <div class="switch-mode" id="switchText" onclick="toggleMode()">
    Don't have account? <span>Create Account</span>
  </div>

  <div class="foot">Secure JWT Authentication • v2.1.0</div>
</div>

<script>
let mode = 'login';

function switchMode(m) {
  mode = m;
  const isReg = (mode === 'register');
  document.getElementById('tabLogin').className = isReg ? 'tab' : 'tab active';
  document.getElementById('tabRegister').className = isReg ? 'tab active' : 'tab';
  document.getElementById('confirmWrap').style.display = isReg ? 'block' : 'none';
  document.getElementById('submitBtn').textContent = isReg ? 'Create Account' : 'Login';
  document.getElementById('switchText').innerHTML = isReg ? 'I already have account? <span>Login</span>' : "Don't have account? <span>Create Account</span>";
  document.getElementById('authError').textContent = '';
}

function toggleMode() {
  switchMode(mode === 'login' ? 'register' : 'login');
}

async function handleSubmit() {
  const username = (document.getElementById('userInput').value || '').trim().toLowerCase();
  const password = document.getElementById('passInput').value || '';
  const confirmPassword = document.getElementById('confirmInput').value || '';
  const errEl = document.getElementById('authError');

  errEl.textContent = '';
  if (!username || !password) {
    errEl.textContent = 'Please fill in all fields.';
    return;
  }

  if (mode === 'register') {
    if (!/^[a-z0-9_.]{3,20}$/.test(username)) {
      errEl.textContent = 'Username must be 3-20 chars (a-z, 0-9, _, .)';
      return;
    }
    if (password.length < 6) {
      errEl.textContent = 'Password must be at least 6 characters.';
      return;
    }
    if (password !== confirmPassword) {
      errEl.textContent = 'Passwords do not match.';
      return;
    }
  }

  const btn = document.getElementById('submitBtn');
  btn.disabled = true;
  btn.textContent = 'Processing...';

  try {
    const endpoint = `/api/auth?action=${mode}`;
    const res = await fetch(endpoint, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ username, password, confirmPassword })
    });
    const data = await res.json();

    if (res.ok && data.token) {
      localStorage.setItem('wall_token', data.token);
      localStorage.setItem('wall_user', data.username);
      window.location.href = '/';
    } else {
      errEl.textContent = data.error || 'Authentication failed.';
      btn.disabled = false;
      btn.textContent = mode === 'register' ? 'Create Account' : 'Login';
    }
  } catch (err) {
    errEl.textContent = 'Network error: ' + err.message;
    btn.disabled = false;
    btn.textContent = mode === 'register' ? 'Create Account' : 'Login';
  }
}
</script>
</body>
</html>
