<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>CPM Admin Panel</title>
<style>
body { background: #0a0a0a; color: #fff; font-family: system-ui, sans-serif; padding: 14px; margin: 0; }
.card { background: #111; border: 1px solid #222; border-radius: 12px; padding: 14px; margin-bottom: 12px; }
input, textarea { width: 100%; box-sizing: border-box; padding: 10px; background: #1a1a1a; border: 1px solid #333; color: #fff; border-radius: 8px; margin: 6px 0; }
button { background: #3b82f6; color: #fff; border: 0; padding: 8px 14px; border-radius: 8px; margin: 3px; font-weight: 700; cursor: pointer; }
button.danger { background: #dc2626; }
button.green { background: #16a34a; }
button.orange { background: #ea580c; }
.post { border-bottom: 1px solid #222; padding: 10px 0; }
.post:last-child { border-bottom: 0; }
code { background: #1e293b; padding: 2px 6px; border-radius: 4px; color: #38bdf8; font-family: monospace; }
.badge { background: #333; padding: 2px 6px; border-radius: 4px; font-size: 11px; margin-left: 4px; }
</style>
</head>
<body>
<h3>CPM Admin Panel</h3>
<div class="card">
  <input id="adminKey" type="password" placeholder="Enter ADMIN_KEY">
  <button onclick="loadAll()">Load Data</button>
  <span id="status" style="margin-left: 8px; font-size: 13px; color: #94a3b8;"></span>
</div>

<div class="card">
  <h4>📌 Pinned Announcement</h4>
  <input id="pinName" placeholder="Name (Admin)">
  <textarea id="pinText" placeholder="Announcement text"></textarea>
  <button onclick="pin(true)">Save Pin</button>
  <button class="danger" onclick="pin(false)">Clear Pin</button>
  <div id="currentPin" style="margin-top: 8px; font-size: 13px; color: #f472b6;"></div>
</div>

<div class="card">
  <h4>💬 Posts</h4>
  <div id="posts">Login to load posts</div>
</div>

<div class="card">
  <h4>📋 IP Logs (Live User IPs)</h4>
  <div id="logs">Login to load logs</div>
</div>

<div class="card">
  <h4>⭐ Permanently Verified IPs</h4>
  <div id="verifiedIps">Login to load verified IPs</div>
</div>

<div class="card">
  <h4>🚫 Banned IPs</h4>
  <div id="banned">Login to load bans</div>
</div>

<script>
let ADMIN_KEY = '', cachedLogs = [], verifiedIpsList = [];

function headers() {
  return { 'Content-Type': 'application/json', 'x-admin-key': ADMIN_KEY };
}

function esc(s) {
  return String(s || '').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
}

async function loadAll() {
  ADMIN_KEY = document.getElementById('adminKey').value.trim();
  if (!ADMIN_KEY) return alert('Enter key');
  document.getElementById('status').textContent = 'Loading...';

  try {
    const [pR, bR, lR, vR, pinR] = await Promise.all([
      fetch(`/api/admin?action=posts&key=${encodeURIComponent(ADMIN_KEY)}`, { headers: headers() }),
      fetch(`/api/admin?action=banned&key=${encodeURIComponent(ADMIN_KEY)}`, { headers: headers() }),
      fetch(`/api/admin?action=logs&key=${encodeURIComponent(ADMIN_KEY)}`, { headers: headers() }),
      fetch(`/api/admin?action=verified_ips&key=${encodeURIComponent(ADMIN_KEY)}`, { headers: headers() }),
      fetch(`/api/admin?action=pinned&key=${encodeURIComponent(ADMIN_KEY)}`, { headers: headers() })
    ]);

    const posts = await pR.json();
    const banned = await bR.json();
    const logs = await lR.json();
    const verifiedIps = await vR.json();
    const pinned = await pinR.json();

    if (posts.error) return alert(posts.error);

    cachedLogs = Array.isArray(logs) ? logs : [];
    verifiedIpsList = Array.isArray(verifiedIps) ? verifiedIps : [];

    const verifiedIpSet = new Set(verifiedIpsList.map(v => v.ip || v.id.replace(/_/g, '.')));

    document.getElementById('posts').innerHTML = posts.map(p => `
      <div class="post">
        <b>${esc(p.name)}</b>
        ${p.isBot ? '<span class="badge">BOT</span>' : ''}
        ${p.isVerified ? '<span class="badge" style="background:#1d9bf0;">✓ VERIFIED</span>' : ''}
        <br>${esc(p.message)}
        <br><small style="color:#64748b;">ID: ${p.id}</small><br>
        <button class="danger" onclick="delPost('${p.id}')">Delete</button>
        <button onclick="banFromPost('${p.id}')">Ban IP</button>
        <button class="green" onclick="verifyIpFromPost('${p.id}')">Verify IP (Always)</button>
        <button onclick="verifyPost('${p.id}', ${!p.isVerified})">${p.isVerified ? 'Unverify Post' : 'Verify Post'}</button>
      </div>
    `).join('') || 'No posts';

    document.getElementById('logs').innerHTML = cachedLogs.map(l => {
      const isVerified = verifiedIpSet.has(l.ip);
      return `
        <div class="post">
          <b>${esc(l.name)}</b><br>
          IP: <code>${esc(l.ip)}</code> ${isVerified ? '<span class="badge" style="background:#16a34a;">VERIFIED IP</span>' : ''}<br>
          Message: ${esc(l.message)}<br>
          <small style="color:#64748b;">postId: ${l.postId || l.id}</small><br>
          ${l.ip !== 'BOT' ? `
            <button class="danger" onclick="banIp('${esc(l.ip)}')">Ban ${esc(l.ip)}</button>${isVerified ? `
              <button class="orange" onclick="unverifyIp('${esc(l.ip)}')">Unverify IP</button>
            ` : `
              <button class="green" onclick="verifyIp('${esc(l.ip)}')">Verify IP (Always)</button>
            `}
          ` : ''}
        </div>
      `;
    }).join('') || 'No logs yet';

    document.getElementById('verifiedIps').innerHTML = verifiedIpsList.map(v => `
      <div class="post">
        <code>${esc(v.ip || v.id)}</code>
        <button class="orange" onclick="unverifyIp('${esc(v.ip || v.id)}')">Remove Verification</button>
      </div>
    `).join('') || 'No verified IPs yet';

    document.getElementById('banned').innerHTML = banned.map(b => `
      <div class="post">
        <code>${esc(b.ip || b.id)}</code>
        <button onclick="unban('${esc(b.ip || b.id)}')">Unban</button>
      </div>
    `).join('') || 'None';

    document.getElementById('currentPin').textContent = pinned && pinned.active ? `📌 ${pinned.name}: ${pinned.text}` : 'No active pin';
    document.getElementById('status').textContent = `Posts: ${posts.length} | Logs: ${cachedLogs.length} | Verified IPs: ${verifiedIpsList.length}`;
  } catch (err) {
    document.getElementById('status').textContent = 'Error loading data';
    alert(err.message);
  }
}

async function delPost(id) {
  if (!confirm('Delete post ' + id + '?')) return;
  const r = await fetch(`/api/admin?id=${id}`, { method: 'DELETE', headers: headers() });
  const d = await r.json();
  if (d.success) loadAll(); else alert(d.error);
}

async function banFromPost(postId) {
  const log = cachedLogs.find(l => l.postId === postId || l.id === postId);
  if (!log) return alert('Log not found for ' + postId);
  if (log.ip === 'BOT') return alert('Cannot ban BOT');
  if (!confirm('Ban IP ' + log.ip + '?')) return;
  const r = await fetch('/api/admin', { method: 'POST', headers: headers(), body: JSON.stringify({ action: 'ban', ip: log.ip }) });
  const d = await r.json();
  if (d.success) loadAll(); else alert(d.error);
}

async function verifyIpFromPost(postId) {
  const log = cachedLogs.find(l => l.postId === postId || l.id === postId);
  if (!log) return alert('Log not found for ' + postId);
  if (log.ip === 'BOT') return alert('Cannot verify BOT IP');
  verifyIp(log.ip, postId);
}

async function verifyIp(ip, postId) {
  if (!confirm('Permanently verify IP ' + ip + '? All future messages will have the verified checkmark.')) return;
  const r = await fetch('/api/admin', { method: 'POST', headers: headers(), body: JSON.stringify({ action: 'verify_ip', ip }) });
  const d = await r.json();
  if (d.success) {
    if (postId) {
      await fetch('/api/admin', { method: 'POST', headers: headers(), body: JSON.stringify({ action: 'verify', postId, isVerified: true }) });
    }
    loadAll();
  } else {
    alert(d.error);
  }
}

async function unverifyIp(ip) {
  if (!confirm('Remove permanent verification for IP ' + ip + '?')) return;
  const r = await fetch('/api/admin', { method: 'POST', headers: headers(), body: JSON.stringify({ action: 'unverify_ip', ip }) });
  const d = await r.json();
  if (d.success) loadAll(); else alert(d.error);
}

async function banIp(ip) {
  if (!confirm('Ban ' + ip + '?')) return;
  const r = await fetch('/api/admin', { method: 'POST', headers: headers(), body: JSON.stringify({ action: 'ban', ip }) });
  const d = await r.json();
  if (d.success) loadAll(); else alert(d.error);
}

async function unban(ip) {
  if (!confirm('Unban ' + ip + '?')) return;
  const r = await fetch('/api/admin', { method: 'POST', headers: headers(), body: JSON.stringify({ action: 'unban', ip }) });
  const d = await r.json();
  if (d.success) loadAll(); else alert(d.error);
}

async function verifyPost(postId, isVerified) {
  const r = await fetch('/api/admin', { method: 'POST', headers: headers(), body: JSON.stringify({ action: 'verify', postId, isVerified }) });
  const d = await r.json();
  if (d.success) loadAll(); else alert(d.error);
}

async function pin(active) {
  const text = document.getElementById('pinText').value;
  const name = document.getElementById('pinName').value || 'Admin';
  if (active && !text) return alert('Enter announcement text');
  const r = await fetch('/api/admin', { method: 'POST', headers: headers(), body: JSON.stringify({ action: 'pin', text, name, active }) });
  const d = await r.json();
  if (d.success) loadAll(); else alert(d.error);
}
</script>
</body>
</html>
