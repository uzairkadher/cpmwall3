<!DOCTYPE html>
<html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Admin - CPM Wall</title>
<style>body{background:#0f172a;color:#fff;font-family:sans-serif;padding:20px}.post{background:#1e293b;padding:10px;margin:10px 0;border-radius:6px} button{background:#ef4444;color:#fff;border:none;padding:5px 10px;border-radius:4px;cursor:pointer}</style>
</head><body>
<h2>Admin Panel</h2><input id="pass" type="password" placeholder="Admin Password" style="padding:8px;width:200px"><button onclick="load()">Load Posts</button><div id="list"></div>
<script>
async function load(){
  const res=await fetch('/api/feed'); const posts=await res.json();
  document.getElementById('list').innerHTML=posts.map(p=>`<div class="post"><b>${p.name}</b>: ${p.message} <button onclick="del('${p.id}')">Delete</button></div>`).join('');
}
async function del(id){
  const pass=document.getElementById('pass').value;
  const res=await fetch(`/api/admin?id=${id}&pass=${pass}`,{method:'DELETE'});
  const j=await res.json(); if(j.ok){alert('Deleted'); load()} else alert(j.error);
}
load();
</script>
</body></html>
