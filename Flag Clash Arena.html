  }

   if(this.timer<=0)this.beginWarning(1);

const KING_SLAYER_WINDOW=2.2; // max seconds between last flag collision and King hole capture for reliable attribution
const KING={

  this.sparks=[];for(let i=0;i<60;i++)this.sparks.push({o:0,x:0,y:0,vx:0,vy:0,l:0,c:'#ffd23f',sz:3.5});
 },

  if(this.roundSelectionRecorded&&!this.roundOutcomeRecorded&&APPS.has(this.kingC)){
   kingStats.totalSelected=Math.max(0,kingStats.totalSelected-1);
   if(kingStats.selected[this.kingC]>1)kingStats.selected[this.kingC]--;
   else delete kingStats.selected[this.kingC];
   saveKingStats();
  }
  this.kingC=-1;
  this.kingAlive=false;
  this.phaseActive=false;
  this.slayerC=-1;
  this.pendingSlayerC=-1;
  this.kingWonRound=false;
  this.roundSelectionRecorded=false;
  this.roundOutcomeRecorded=false;
  this.introAnnounced=false;

  const active=F.filter(f=>f&&f.on&&APPS.has(f.c));
  if(!active.length)return -1;
  const pickIdx=Math.floor(rnd()*active.length);
  return active[pickIdx].c;
 },

  this.phaseActive=true;

  this.pendingSlayerC=-1;

  this.roundOutcomeRecorded=false;
  this.introAnnounced=false;
  this.introT=0;

   say('King of the Arena begins! '+kName+' is crowned King of the Arena! All countries compete to eliminate the King!',2);
  }else{

  }

   if(p.o)continue;if(k++>=(count||30))break;
   const q=rnd()*PI2,sp=45+rnd()*165;
   p.o=1;p.x=px;p.y=py;p.vx=Math.cos(q)*sp;p.vy=Math.sin(q)*sp;p.l=1;

 },

  if(!ED.king||!this.kingAlive||f.c!==this.kingC)return;
  if(!isTimeout&&APPS.has(f.lastHitBy)&&f.lastHitBy!==this.kingC&&(t-(f.lastHitAt||-99))<=KING_SLAYER_WINDOW){
   this.pendingSlayerC=f.lastHitBy;

   this.pendingSlayerC=-1;

 onKingEliminated(remCount){
  if(!ED.king||!this.kingAlive)return;
  this.kingAlive=false;
  this.phaseActive=false;
  const kC=this.kingC,kName=C[kC]?C[kC].n:'The King';
  const slayer=APPS.has(this.pendingSlayerC)&&this.pendingSlayerC!==kC?this.pendingSlayerC:-1;
  this.slayerC=slayer;
  if(!this.roundOutcomeRecorded){
   this.roundOutcomeRecorded=true;
   kingStats.totalKingElims++;
   kingStats.kingElims[kC]=(kingStats.kingElims[kC]||0)+1;
   kingStats.curKingStreak=0;
   kingStats.curKingStreakC=-1;
   delete kingStats.curCountryStreak[kC];
   if(slayer>=0){
    kingStats.totalSlayerWins++;
    kingStats.slayerWins[slayer]=(kingStats.slayerWins[slayer]||0)+1;
   }
   saveKingStats();
  }
  this.defeatAnim={t:0,d:3.4,kingC:kC,slayerC:slayer};
  this.spawnRoyalBurst(CX,CY,'#ffd23f',44,115);
  this.spawnRoyalBurst(CX,CY,'#ff4d6d',22,85);
  flash=Math.max(flash,.55);
  kingDefeatS();
  if(toast&&toast.c===kC){toast.king=1;toast.slayer=slayer}
