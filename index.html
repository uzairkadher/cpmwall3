  function pushMoment(type,detail){
    if(!v6Cfg.replayMoments.enabled||IS_PREVIEW)return;
    if(rt.currentTimeline.length>=24)return;
    rt.currentTimeline.push({
      sec:+Math.max(0,(Date.now()-rStart)/1000).toFixed(1),
      type,
      detail:String(detail||'').slice(0,80)
    });
  }

  function computeJourneyTier(j){
    if(!j)return 'Contender';
    if((j.wins||0)>=25||(j.championships||0)>=2)return 'Legend';
    if((j.wins||0)>=10||(j.championships||0)>=1)return 'Elite';
    if((j.wins||0)>=3||(j.battles||0)>=15)return 'Veteran';
    return 'Contender';
  }

  function detectActiveRivalryInField(){
    if(!v6Cfg.rivalry.enabled||!F)return null;
    const rh=adm.getSnapshot?null:null;
    const rawR=readJ('fca_rivalry_history',null);
    if(!rawR||!rawR.pairs)return null;
    const inField=new Set(F.map(f=>f.c));
    let best=null;
    for(const key of Object.keys(rawR.pairs)){
      const p=rawR.pairs[key];
      if(!p||p.matches<(v6Cfg.rivalry.minMatches||2))continue;
      if(inField.has(p.a)&&inField.has(p.b)){
        if(!best||p.matches>best.matches)best=p;
      }
    }
    if(!best||!APPS.has(best.a)||!APPS.has(best.b))return null;
    return {a:best.a,b:best.b,nameA:C[best.a].n,nameB:C[best.b].n,winsA:best.winsA||0,winsB:best.winsB||0,matches:best.matches,lastWinner:best.lastWinner};
  }

  function selectEntranceTier(riv){
    if(!v6Cfg.entranceEvolution.enabled)return 'Standard';
    if(adm.finaleState&&adm.finaleState.active)return 'Special Event';
    const cl=readJ('fca_champion_legacy',null);
    if(cl&&APPS.has(cl.longestReignC)&&F&&F.some(f=>f.c===cl.longestReignC)&&cl.longestReign>=3)return 'Record Holder';
    if(cl&&APPS.has(cl.currentChampion)&&F&&F.some(f=>f.c===cl.currentChampion)&&cl.reignDefenses>=2)return 'Champion';
    if(riv)return 'Rivalry';
    if(S&&S.cs&&S.cs.n>=3)return 'Win Streak';
    if(life.r>0&&life.r%25===0)return 'Milestone';
    return 'Standard';
  }

  function runEventDirector(riv){
    if(!v6Cfg.eventDirector.enabled||ED.n==='Classic'||IS_PREVIEW)return null;
    if(round-rt.lastDirectorRound<(v6Cfg.eventDirector.cooldownRounds||3))return null;
    const cl=readJ('fca_champion_legacy',null);
    const cands=[];
    if(adm.finaleState&&adm.finaleState.active)cands.push({type:'Special Finale',label:'CHAMPIONSHIP FINALE EVENT',col:'#ffd23f'});
    if(cl&&cl.reignDefenses>=3&&APPS.has(cl.currentChampion))cands.push({type:'Streak Challenge',label:'STREAK CHALLENGE · STOP '+C[cl.currentChampion].n.toUpperCase(),col:'#f97316'});
    if(cl&&cl.reignDefenses>0&&cl.reignDefenses===cl.longestReign&&cl.longestReign>=2)cands.push({type:'Record-Breaking Challenge',label:'RECORD REIGN ON THE LINE',col:'#e879f9'});
    if(riv)cands.push({type:'Rivalry Battle',label:'RIVALRY: '+riv.nameA.toUpperCase()+' VS '+riv.nameB.toUpperCase(),col:'#fb7185'});
    if(life.r>0&&life.r%50===0)cands.push({type:'Milestone Celebration',label:'ROUND '+life.r+' MILESTONE',col:'#22d3ee'});
    const filtered=cands.filter(x=>x.type!==rt.lastDirectorType);
    const pick=filtered[0]||null;
    if(pick){
      rt.lastDirectorRound=round;
      rt.lastDirectorType=pick.type;
    }
    return pick;
  }

  // Wrap onRoundStart for v6.0 initialization (clean reset every battle)
  const prevOnRoundStart=adm.onRoundStart.bind(adm);
  adm.onRoundStart=(queued)=>{
    rt.suddenActive=false;
    rt.suddenTriggeredAt=0;
    rt.suddenBannerT=0;
    rt.upsetBanner=null;
    rt.comebackBanner=null;
    rt.recordBanner=null;
    rt.dangerEscapes={};
    rt.currentTimeline=[];
    rt.hadRareThisRound=false;

    prevOnRoundStart(queued);

    rt.activeRivalry=detectActiveRivalryInField();
    rt.entranceTier=selectEntranceTier(rt.activeRivalry);
    rt.activeDirectorEvent=runEventDirector(rt.activeRivalry);
    rt.activeProfile=v6Cfg.personalityProfile==='auto'
      ?(rt.activeRivalry?'rivalry_focus':(ED.n==='Championship'||ED.leg==='omega'?'championship_focus':(ED.leg==='silent_prestige'?'minimal':'energetic')))
      :v6Cfg.personalityProfile;
    if(adm.activeRareMoment)rt.hadRareThisRound=true;

    pushMoment('Battle Start',ED.n+' Edition · '+rt.entranceTier+' Entrance'+(rt.activeDirectorEvent?' · '+rt.activeDirectorEvent.type:''));
    if(rt.activeRivalry&&(round-(rivalExt.lastCalloutRound||-99)>=(v6Cfg.rivalry.cooldownRounds||3))){
      rivalExt.lastCalloutRound=round;
      saveRivalExt();
      pushMoment('Rivalry Detected',rt.activeRivalry.nameA+' ('+rt.activeRivalry.winsA+') vs '+rt.activeRivalry.nameB+' ('+rt.activeRivalry.winsB+')');
    }
  };

  // Wrap tickEntertainment for Sudden Death Overtime + In-Battle Comeback Escape Tracking
  const prevTickEnt=adm.tickEntertainment.bind(adm);
  let lastAliveTrack=99;
  adm.tickEntertainment=(dt)=>{
    prevTickEnt(dt);
    if(rt.suddenBannerT>0)rt.suddenBannerT=Math.max(0,rt.suddenBannerT-dt);
    if(rt.upsetBanner){rt.upsetBanner.t+=dt;if(rt.upsetBanner.t>=rt.upsetBanner.ttl)rt.upsetBanner=null;}
    if(rt.comebackBanner){rt.comebackBanner.t+=dt;if(rt.comebackBanner.t>=rt.comebackBanner.ttl)rt.comebackBanner=null;}
    if(rt.recordBanner){rt.recordBanner.t+=dt;if(rt.recordBanner.t>=rt.recordBanner.ttl)rt.recordBanner=null;}

    if(phase!==0||!F)return;
    if(adm.activeRareMoment)rt.hadRareThisRound=true;

    // Track real alive milestones & near-hole danger escapes for Comeback Recognition
    let aliveCount=0;
    for(let i=0;i<F.length;i++){
      const f=F[i];
      if(!f.on)continue;
      aliveCount++;
      // Measurable danger state: flag within outer 12% rim zone near hole or in storm danger
      const dist=Math.hypot(f.x,f.y);
      const nearDanger=dist>0.84||!!f.inDanger;
      let st=rt.dangerEscapes[f.c];
      if(!st){st={inDanger:false,count:0};rt.dangerEscapes[f.c]=st;}
      if(nearDanger&&!st.inDanger){st.inDanger=true;}
      else if(!nearDanger&&dist<0.68&&st.inDanger){st.inDanger=false;st.count++;}
    }
    if(aliveCount===5&&lastAliveTrack>5)pushMoment('Final Five','5 countries remaining in '+ED.n);
    if(aliveCount===2&&lastAliveTrack>2)pushMoment('Final Showdown','Final 2 countries face off');
    lastAliveTrack=aliveCount;

    // System 1: Cross-Edition Sudden Death Overtime Engine (non-Classic, non-Sudden-edition)
    if(v6Cfg.suddenDeath.enabled&&!rt.suddenActive&&ED.n!=='Classic'&&!ED.sudden&&aliveCount>=(v6Cfg.suddenDeath.minAlive||3)){
      const elapsed=(Date.now()-rStart)/1000;
      if(elapsed>=(v6Cfg.suddenDeath.triggerSec||75)){
        rt.suddenActive=true;
        rt.suddenTriggeredAt=elapsed;
        rt.suddenBannerT=5.0;
        pushMoment('Sudden Death Overtime','Triggered at '+Math.round(elapsed)+'s with '+aliveCount+' flags remaining');
        if(run()){const n=AC.currentTime;tone(220,n,.18,'sawtooth',.16);tone(440,n+.16,.24,'sawtooth',.18)}
        shout('Sudden Death Overtime! High tension finale!','SUDDEN DEATH OVERTIME!');
      }
    }
  };

  // Wrap recordMatchResult for Upset, Comeback, Revenge Rivalry, Country Journey, Achievements, Timeline Save
  const prevRecordMatch=adm.recordMatchResult.bind(adm);
  adm.recordMatchResult=(rec)=>{
    prevRecordMatch(rec);
    if(IS_PREVIEW||rec.matchType==='showcase')return;
    const winId=rec.winner;
    if(!APPS.has(winId))return;
    const runnerId=APPS.has(rec.runnerUp)?rec.runnerUp:-1;
    const winName=C[winId].n;

    // 1. Country Journey Update (real data only)
    if(F){
      for(let i=0;i<F.length;i++){
        const cid=F[i].c;
        if(!APPS.has(cid))continue;
        if(!journey[cid])journey[cid]={battles:0,wins:0,top5:0,championships:0,upsets:0,comebacks:0,tier:'Contender'};
        journey[cid].battles++;
      }
    }
    if(!journey[winId])journey[winId]={battles:1,wins:0,top5:0,championships:0,upsets:0,comebacks:0,tier:'Contender'};
    journey[winId].wins++;
    journey[winId].top5++;
    if(ED.n==='Championship'||ED.leg==='omega')journey[winId].championships++;
    journey[winId].tier=computeJourneyTier(journey[winId]);

    // 2. Transparent Upset Detector
    const cl=readJ('fca_champion_legacy',null);
    const maxWins=Math.max(0,...Object.values(life.w||{}));
    const winBefore=Math.max(0,(life.w[winId]||1)-1);
    const hasEnoughData=life.r>=(v6Cfg.upsetDetector.minRoundsData||6);
    const upsetByRatio=hasEnoughData&&maxWins>=4&&winBefore<=Math.max(1,Math.floor(maxWins*(v6Cfg.upsetDetector.winRatioMax||0.25)));
    const isGenuineUpset=v6Cfg.upsetDetector.enabled&&upsetByRatio;
    if(isGenuineUpset){
      journey[winId].upsets=(journey[winId].upsets||0)+1;
      rt.upsetBanner={title:'VERIFIED UPSET VICTORY!',sub:winName+' ('+winBefore+' prior wins vs '+maxWins+' leader)',t:0,ttl:6};
      pushMoment('Upset Victory',winName+' defeated stronger field ('+winBefore+' vs '+maxWins+' wins)');
      unlockAchievement('upset_hero',winId);
    }

    // 3. Genuine In-Battle Comeback Recognition
    const esc=(rt.dangerEscapes[winId]&&rt.dangerEscapes[winId].count)||0;
    if(v6Cfg.comeback.enabled&&esc>=(v6Cfg.comeback.minEscapes||2)){
      journey[winId].comebacks=(journey[winId].comebacks||0)+1;
      rt.comebackBanner={title:'COMEBACK SURVIVOR!',sub:winName+' escaped '+esc+' danger zones to win',t:0,ttl:6};
      pushMoment('Comeback Win',winName+' survived '+esc+' outer-rim danger escapes');
    }

    // 4. Rivalry & Revenge Victory Detection (real pair history)
    if(runnerId>=0){
      const rawR=readJ('fca_rivalry_history',null);
      const a=Math.min(winId,runnerId),b=Math.max(winId,runnerId);
      const pair=rawR&&rawR.pairs&&rawR.pairs[a+'_'+b];
      if(pair&&pair.matches>=2){
        unlockAchievement('rivalry_victor',winId);
        if(rt.activeRivalry&&((rt.activeRivalry.a===a&&rt.activeRivalry.b===b))&&rt.activeRivalry.lastWinner===runnerId){
          rivalExt.revengeWins=(rivalExt.revengeWins||0)+1;
          rivalExt.recentRevenge={winner:winName,defeated:C[runnerId].n,round,at:new Date().toISOString()};
          pushMoment('Revenge Victory',winName+' avenged prior loss against '+C[runnerId].n);
        }
        if(!rivalExt.topRivalry||pair.matches>rivalExt.topRivalry.matches){
          rivalExt.topRivalry={a,b,nameA:C[a].n,nameB:C[b].n,winsA:pair.winsA,winsB:pair.winsB,matches:pair.matches};
        }
        saveRivalExt();
      }
    }

    // 5. Sudden Death & Rare Event Achievements
    if(rt.suddenActive){
      unlockAchievement('sudden_survivor',winId);
      pushMoment('Sudden Death Winner',winName+' prevailed in overtime');
    }
    if(rt.hadRareThisRound){
      unlockAchievement('rare_witness',winId);
    }

    // 6. Champion Legacy New Longest Reign Record Celebration
    if(cl&&cl.currentChampion===winId&&cl.reignDefenses>=3&&cl.reignDefenses===cl.longestReign){
      rt.recordBanner={title:'NEW ALL-TIME REIGN RECORD!',sub:winName+' · '+cl.reignDefenses+' Consecutive Defenses',t:0,ttl:6};
      pushMoment('New Record',winName+' set longest reign ('+cl.reignDefenses+' defenses)');
    }

    // 7. Save Moment Timeline (structured event recap, honestly labeled)
    pushMoment('Victory',winName+' won Round '+round+' ('+ED.n+')');
    if(v6Cfg.replayMoments.enabled){
      timelines.unshift({
        id:'tl_'+Date.now(),
        round,
        edition:ED.n,
        winner:winName,
        runnerUp:runnerId>=0?C[runnerId].n:'',
        durationSec:Math.max(1,Math.round(rec.durationSec||((Date.now()-rStart)/1000))),
        suddenDeath:rt.suddenActive,
        upset:isGenuineUpset,
        comebackEscapes:esc,
        note:'Structured event timeline (metadata recap, not video recording)',
        moments:rt.currentTimeline.slice()
      });
      saveTimelines();
    }
    saveJourney();
    lastAliveTrack=99;
  };

  // Wrap drawOverlays for Sudden Death Warning, Upset/Comeback/Record Banners, & Compact Broadcast HUD
  const prevDrawOverlays=adm.drawOverlays.bind(adm);
  adm.drawOverlays=(g)=>{
    prevDrawOverlays(g);
    if(adm.emergencyStop)return;
    if(phase===0){
      if(rt.suddenActive&&v6Cfg.hud.showSuddenDeath){
        const pulse=0.55+0.35*Math.sin(performance.now()*0.008);
        g.save();
        g.strokeStyle='rgba(239,68,68,'+pulse.toFixed(2)+')';g.lineWidth=4;
        g.beginPath();g.arc(CX,CY,R+3,0,PI2);g.stroke();
        pill(104,92,176,18,5,'#450a0ae6','#ef4444');
        T('⚡ SUDDEN DEATH OVERTIME',192,104,7.8,'#fecaca','center',AN);
        g.restore();
      }
      if(rt.activeDirectorEvent&&v6Cfg.hud.showEventTag){
        g.save();
        pill(78,112,228,16,4,'#070b1ad8',rt.activeDirectorEvent.col+'aa');
        T('DIRECTOR · '+rt.activeDirectorEvent.label.slice(0,34),192,123,6.8,rt.activeDirectorEvent.col,'center','bold system-ui,sans-serif');
        g.restore();
      }else if(rt.activeRivalry&&v6Cfg.hud.showRivalry){
        g.save();
        pill(88,112,208,16,4,'#1a0812d8','#fb7185aa');
        T('RIVALRY: '+rt.activeRivalry.nameA.toUpperCase().slice(0,10)+' '+rt.activeRivalry.winsA+'-'+rt.activeRivalry.winsB+' '+rt.activeRivalry.nameB.toUpperCase().slice(0,10),192,123,6.8,'#fecdd3','center','bold system-ui,sans-serif');
        g.restore();
      }
    }
    if(phase===1){
      const b=rt.recordBanner||rt.upsetBanner||rt.comebackBanner;
      if(b){
        g.save();
        pill(48,44,288,28,6,'#0f172af0','#facc15');
        T('★ '+b.title,192,56,8.2,'#fde047','center',AN);
        T(b.sub.slice(0,48),192,67,6.8,'#f8fafc','center','bold system-ui,sans-serif');
        g.restore();
      }
    }
  };

  // Wrap getSnapshot to expose Rotation + v6.0 Intelligence state to Admin Panel
  const prevGetSnapshot=adm.getSnapshot.bind(adm);
  adm.getSnapshot=()=>{
    const snap=prevGetSnapshot();
    const disabledSet=new Set(rot.disabledEditions);
    if(Array.isArray(snap.editions)){
      snap.editions=snap.editions.map(e=>({...e,batch:EDS[e.idx]?.batch||(e.idx<13?'orig':'leg24'),disabled:disabledSet.has(e.idx)}));
    }
    snap.rotation=ROT_API.getSummary();
    snap.v6Config=v6Cfg;
    snap.v6Runtime={
      suddenActive:rt.suddenActive,
      activeRivalry:rt.activeRivalry,
      activeDirectorEvent:rt.activeDirectorEvent,
      entranceTier:rt.entranceTier,
      activeProfile:rt.activeProfile,
      profileLabel:(PROFILES[rt.activeProfile]||PROFILES.auto).label,
      revengeWins:rivalExt.revengeWins||0,
      recentRevenge:rivalExt.recentRevenge||null,
      topRivalry:rivalExt.topRivalry||null
    };
    snap.momentTimelines=timelines.slice(0,15);
    // Top 12 countries by real Journey wins/battles
    snap.countryJourney=Object.entries(journey)
      .filter(([k])=>APPS.has(+k))
      .map(([k,v])=>({id:+k,name:C[+k].n,...v,tier:computeJourneyTier(v)}))
      .sort((a,b)=>b.wins-a.wins||b.battles-a.battles)
      .slice(0,12);
    // Extend Hall of Legends with genuine v6.0 entries
    if(Array.isArray(snap.hallOfLegends)){
      if(rivalExt.topRivalry)snap.hallOfLegends.push({title:'Historic Rivalry',country:rivalExt.topRivalry.nameA+' vs '+rivalExt.topRivalry.nameB,metric:rivalExt.topRivalry.matches+' Matches ('+rivalExt.topRivalry.winsA+'-'+rivalExt.topRivalry.winsB+')'});
      const topUpset=snap.countryJourney.filter(x=>x.upsets>0).sort((a,b)=>b.upsets-a.upsets)[0];
      if(topUpset)snap.hallOfLegends.push({title:'Top Upset Victor',country:topUpset.name,metric:topUpset.upsets+' Verified Upsets'});
      const topJourney=snap.countryJourney[0];
      if(topJourney&&topJourney.wins>=1)snap.hallOfLegends.push({title:'Journey Leader ('+topJourney.tier+')',country:topJourney.name,metric:topJourney.wins+'W / '+topJourney.battles+'B'});
    }
    // End-of-session top 3 standings for Finale
    snap.sessionStandings=Object.entries(S.w||{})
      .filter(([k])=>APPS.has(+k))
      .sort((a,b)=>b[1]-a[1])
      .slice(0,3)
      .map(([k,v])=>({id:+k,name:C[+k].n,wins:v}));
    return snap;
  };

  // Wrap handleCommand for Rotation & v6.0 Admin commands (all via existing dual-transport ACK sync!)
  const prevHandleCommand=adm.handleCommand.bind(adm);
  adm.handleCommand=(cmd)=>{
    if(!cmd||typeof cmd!=='object')return{ok:false,error:'Invalid command'};
    const {action,payload={}}=cmd;
    if(action==='rotation.update'){
      const res=ROT_API.updateConfig(payload);
      adm.broadcastState();
      return{...res,stateSeq:adm.stateSeq};
    }
    if(action==='edition.toggle_enabled'){
      const res=ROT_API.toggleEditionEnabled(+payload.editionIdx,!!payload.enabled);
      adm.broadcastState();
      return{...res,stateSeq:adm.stateSeq};
    }
    if(action==='v6.update_config'){
      for(const k of ['suddenDeath','rivalry','eventDirector','upsetDetector','comeback','entranceEvolution','hud','replayMoments']){
        if(payload[k]&&typeof payload[k]==='object')v6Cfg[k]=Object.assign(v6Cfg[k],payload[k]);
      }
      if(typeof payload.personalityProfile==='string'&&PROFILES[payload.personalityProfile]){
        v6Cfg.personalityProfile=payload.personalityProfile;
      }
      saveV6Cfg();
      adm.broadcastState();
      return{ok:true,v6Config:v6Cfg,stateSeq:adm.stateSeq};
    }
    if(action==='v6.clear_timelines'){
      timelines.length=0;saveTimelines();
      adm.broadcastState();
      return{ok:true,stateSeq:adm.stateSeq};
    }
    if(action==='v6.trigger_sudden_death'){
      if(phase!==0||ED.n==='Classic')return{ok:false,error:'Sudden Death overtime can only trigger during an active non-Classic battle.'};
      if(rt.suddenActive)return{ok:true,alreadyActive:true,stateSeq:adm.stateSeq};
      rt.suddenActive=true;rt.suddenTriggeredAt=(Date.now()-rStart)/1000;rt.suddenBannerT=5.0;
      pushMoment('Sudden Death Overtime','Triggered manually by Admin');
      shout('Sudden Death Overtime! High tension finale!','SUDDEN DEATH OVERTIME!');
      adm.broadcastState();
      return{ok:true,suddenActive:true,stateSeq:adm.stateSeq};
    }
    return prevHandleCommand(cmd);
  };

  window.__FCA_V6__={
    getConfig:()=>v6Cfg,
    getRuntime:()=>rt,
    getTimelines:()=>timelines,
    getJourney:()=>journey,
    PROFILES
  };

  if(!IS_PREVIEW)adm.broadcastState();
})();


// ===== SINGLE SOURCE OF TRUTH: AUTHORITATIVE COMMAND QUEUE, CONFIG REV & LIVE PREVIEW MIRROR =====
(function(){
  const adm=window.__FCA_ADM__;
  if(!adm)return;
  const PENDING_KEY='fca_pending_cmds_v1';
  const APPLIED_KEY='fca_applied_reqs_v1';
  const REV_KEY='fca_auth_rev_v1';
  const SYNC_STATE_KEY='fca_sync_state';
  const SYNC_ACK_KEY='fca_sync_ack';
  const CFG_KEY='fca_admin_config';
  const ROT_KEY='fca_rotation_v5';
  const V6_CFG_KEY='fca_v6_config';

  const readJ=(k,fb)=>{try{const v=localStorage.getItem(k);return v?JSON.parse(v):fb}catch(_){return fb}};
  const writeJ=(k,v)=>{if(IS_PREVIEW)return;try{localStorage.setItem(k,JSON.stringify(v))}catch(_){}};

  adm.configRev=Math.max(Number(readJ(REV_KEY,0))||0,Number(adm.configRev)||0);

  // Include authoritative configRev in every snapshot
  const prevSnap=adm.getSnapshot.bind(adm);
  adm.getSnapshot=()=>{
    const s=prevSnap();
    s.configRev=adm.configRev||0;
    s.authRev=Number(readJ(REV_KEY,0))||0;
    return s;
  };

  if(!IS_PREVIEW){
    // AUDIENCE MODE: Drain persisted Admin commands on boot, tab focus, visibilitychange, and storage update
    const appliedSet=new Set(Array.isArray(readJ(APPLIED_KEY,[]))?readJ(APPLIED_KEY,[]):[]);
    const saveApplied=()=>{
      const arr=[...appliedSet].slice(-200);
      writeJ(APPLIED_KEY,arr);
    };

    function drainPendingCommands(){
      const list=readJ(PENDING_KEY,[]);
      if(!Array.isArray(list)||!list.length)return 0;
      let appliedCount=0;
      const ordered=list.slice().sort((a,b)=>(Number(a.ts)||0)-(Number(b.ts)||0));
      for(const cmd of ordered){
        if(!cmd||!cmd.reqId||!cmd.action)continue;
        if(appliedSet.has(cmd.reqId))continue;
        // Mark before applying to guarantee no duplicate execution
        appliedSet.add(cmd.reqId);
        // If Admin changed edition while Audience was offline/closed, apply immediately so stale fca_state never wins
        const isEdCmd=(cmd.action==='battle.set_edition'||cmd.action==='edition.switch_classic');
        const payload=Object.assign({},cmd.payload||{});
        if(isEdCmd&&(Date.now()-(Number(cmd.ts)||0))>1500){
          payload.immediate=true;
          payload.safeQueue=false;
        }
        const res=adm.handleCommand({reqId:cmd.reqId,action:cmd.action,payload});
        if(Number(cmd.rev)>adm.configRev)adm.configRev=Number(cmd.rev);
        try{localStorage.setItem(SYNC_ACK_KEY,JSON.stringify({reqId:cmd.reqId,rev:adm.configRev,ts:Date.now(),res}))}catch(_){}
        appliedCount++;
      }
      if(appliedCount>0){
        saveApplied();
        // Prune fully applied commands older than 30s to keep storage lean
        const cutoff=Date.now()-30000;
        const remaining=list.filter(c=>c&&c.reqId&&(!appliedSet.has(c.reqId)||(Number(c.ts)||0)>cutoff)).slice(-40);
        writeJ(PENDING_KEY,remaining);
        try{localStorage.setItem(SYNC_STATE_KEY,JSON.stringify(adm.getSnapshot()))}catch(_){}
        adm.broadcastState();
      }
      return appliedCount;
    }

    adm.drainPendingCommands=drainPendingCommands;

    // 1. Drain any commands issued by Admin before Audience opened
    const drained=drainPendingCommands();

    // 2. Reconcile authoritative manual edition if stale fca_state restored a different edition
    if(drained===0&&window.__FCA_ROT__&&window.__FCA_ROT__.getConfig){
      const rc=window.__FCA_ROT__.getConfig();
      if(rc&&rc.edition&&rc.edition.mode==='manual'&&Number.isInteger(rc.edition.currentIdx)&&EDS[rc.edition.currentIdx]&&curEi!==rc.edition.currentIdx){
        setEdition(rc.edition.currentIdx);
      }
    }

    // 3. Re-drain whenever Audience tab regains focus, becomes visible, or storage receives new pending commands
    window.addEventListener('storage',ev=>{
      if(ev.key===PENDING_KEY&&ev.newValue)drainPendingCommands();
    });
    document.addEventListener('visibilitychange',()=>{
      if(!document.hidden){drainPendingCommands();adm.broadcastState();}
    });
    window.addEventListener('focus',()=>{
      drainPendingCommands();adm.broadcastState();
    });

    adm.broadcastState();
  }else{
    // LIVE PREVIEW MODE (IS_PREVIEW === true): Strictly Read-Only Mirror of Authoritative Audience Config
    let lastMirrorSig='';
    function applyPreviewMirror(snap,pendingCmd){
      try{
        // 1. Re-hydrate shared visual/gameplay/showDirector config from authoritative storage
        const cfg=readJ(CFG_KEY,null);
        if(cfg&&typeof cfg==='object'){
          if(cfg.gameplay&&typeof cfg.gameplay==='object')Object.assign(adm.gameplay,cfg.gameplay);
          if(cfg.visual&&typeof cfg.visual==='object'){
            Object.assign(adm.visual,cfg.visual);
            if(cfg.visual.overlays&&typeof cfg.visual.overlays==='object')Object.assign(adm.visual.overlays,cfg.visual.overlays);
          }
          if(cfg.showDirector&&typeof cfg.showDirector==='object')Object.assign(adm.showDirector,cfg.showDirector);
        }
        // 2. Sync v6 config
        const v6s=readJ(V6_CFG_KEY,null);
        if(v6s&&window.__FCA_V6__&&window.__FCA_V6__.getConfig){
          const curV6=window.__FCA_V6__.getConfig();
          for(const k of Object.keys(v6s)){
            if(v6s[k]&&typeof v6s[k]==='object'&&curV6[k]&&typeof curV6[k]==='object')Object.assign(curV6[k],v6s[k]);
            else curV6[k]=v6s[k];
          }
        }
        // 3. Sync rotation theme overlay
        const rotS=readJ(ROT_KEY,null);
        if(rotS&&window.__FCA_ROT__&&window.__FCA_ROT__.getConfig){
          const curRot=window.__FCA_ROT__.getConfig();
          if(rotS.theme&&curRot.theme)Object.assign(curRot.theme,rotS.theme);
          if(rotS.edition&&curRot.edition)curRot.edition.mode=rotS.edition.mode;
        }
        // 4. Resolve authoritative active edition index:
        //    Priority: explicit pending edition command > live Audience snapshot > saved rotation currentIdx
        let targetEi=-1;
        if(pendingCmd&&pendingCmd.action==='edition.switch_classic')targetEi=0;
        else if(pendingCmd&&pendingCmd.action==='battle.set_edition'&&pendingCmd.payload&&Number.isInteger(+pendingCmd.payload.editionIdx)&&EDS[+pendingCmd.payload.editionIdx])targetEi=+pendingCmd.payload.editionIdx;
        else{
          // Check latest unapplied pending edition command in storage (when Audience tab is closed)
          const pList=readJ(PENDING_KEY,[]);
          const appSet=new Set(Array.isArray(readJ(APPLIED_KEY,[]))?readJ(APPLIED_KEY,[]):[]);
          if(Array.isArray(pList)){
            for(let i=pList.length-1;i>=0;i--){
              const c=pList[i];
              if(!c||appSet.has(c.reqId))continue;
              if(c.action==='edition.switch_classic'){targetEi=0;break;}
              if(c.action==='battle.set_edition'&&c.payload&&Number.isInteger(+c.payload.editionIdx)&&EDS[+c.payload.editionIdx]){targetEi=+c.payload.editionIdx;break;}
            }
          }
        }
        if(targetEi<0&&snap&&Number.isInteger(snap.editionIdx)&&EDS[snap.editionIdx])targetEi=snap.editionIdx;
        if(targetEi<0&&rotS&&rotS.edition&&Number.isInteger(rotS.edition.currentIdx)&&EDS[rotS.edition.currentIdx])targetEi=rotS.edition.currentIdx;

        // Also apply live theme/visual/gameplay/showDirector from snap or snap.config if provided
        const sVis=(snap&&(snap.visual||(snap.config&&snap.config.visual)))||null;
        const sGp=(snap&&(snap.gameplay||(snap.config&&snap.config.gameplay)))||null;
        const sSd=(snap&&(snap.showDirector||(snap.config&&snap.config.showDirector)))||null;
        if(sVis&&typeof sVis==='object')Object.assign(adm.visual,sVis);
        if(sGp&&typeof sGp==='object')Object.assign(adm.gameplay,sGp);
        if(sSd&&typeof sSd==='object')Object.assign(adm.showDirector,sSd);
        if(snap&&snap.rotation&&snap.rotation.theme&&window.__FCA_ROT__&&window.__FCA_ROT__.getConfig){
          Object.assign(window.__FCA_ROT__.getConfig().theme,snap.rotation.theme);
        }

        const rev=(snap&&snap.configRev)||Number(readJ(REV_KEY,0))||0;
        adm.configRev=rev;
        const themeId=(window.__FCA_ROT__&&window.__FCA_ROT__.getConfig&&window.__FCA_ROT__.getConfig().theme?.current)||'default';
        const sig=targetEi+'|'+themeId+'|'+rev;

        if(targetEi>=0&&EDS[targetEi]&&curEi!==targetEi){
          setEdition(targetEi);
          lastMirrorSig=sig;
        }else if(sig!==lastMirrorSig){
          lastMirrorSig=sig;
        }
      }catch(_){}
    }

    // Initial mirror on Preview boot
    applyPreviewMirror(readJ(SYNC_STATE_KEY,null),null);

    // Mirror live telemetry from Audience via BroadcastChannel (read-only)
    try{
      if(typeof BroadcastChannel!=='undefined'){
        const pbc=new BroadcastChannel('fca_admin_channel');
        pbc.onmessage=ev=>{
          const m=ev.data;
          if(m&&m.target==='admin'&&m.type==='telemetry'&&m.data){
            applyPreviewMirror(m.data,null);
          }
        };
      }
    }catch(_){}

    // Mirror storage updates from Audience or Admin (read-only)
    window.addEventListener('storage',ev=>{
      if(ev.key===SYNC_STATE_KEY||ev.key===CFG_KEY||ev.key===ROT_KEY||ev.key===V6_CFG_KEY||ev.key===PENDING_KEY){
        applyPreviewMirror(readJ(SYNC_STATE_KEY,null),null);
      }
    });

    // Mirror explicit postMessage sync from Admin parent window
    window.addEventListener('message',ev=>{
      if(ev.origin!==location.origin)return;
      const d=ev.data;
      if(d&&d.target==='preview'&&d.action==='preview.sync_state'&&d.payload){
        applyPreviewMirror(d.payload.telemetry||readJ(SYNC_STATE_KEY,null),d.payload.cmd||null);
      }
    });
  }
})();
