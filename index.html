<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">

<link rel="manifest" href="/manifest.json">

<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #080a12;
  --card: #151825;
  --border: #24273f;
  --accent: #00f0ff;
  --bot: #ff3b9a;
  --text: #e8eaf6;
  --muted: #8b8fa3;
}
* { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Inter', sans-serif; }
html, body { height: 100%; overflow: hidden; }
body {
  background: radial-gradient(600px at top, #1a1f3d, var(--bg));
  color: var(--text);
  display: flex;
  justify-content: center;
  height: 100dvh;
  height: 100vh;
  padding: 8px 10px;
}
.container {
  width: 100%;
  max-width: 580px;
  height: 100%;
  display: flex;
  flex-direction: column;
  gap: 8px;
  position: relative;
}
.header {
  background: linear-gradient(135deg, #1e2240, #151830);
  border: 1px solid var(--border);
  border-radius: 14px;
  padding: 10px 14px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  flex-shrink: 0;
}
.header h1 { font-size: 0.92rem; font-weight: 700; }
.status-sub { display: flex; align-items: center; gap: 6px; font-size: 0.72rem; color: var(--accent); margin-top: 2px; }
.dot { width: 8px; height: 8px; background: #22c55e; border-radius: 50%; display: inline-block; box-shadow: 0 0 8px #22c55e; }
.online-pill {
  background: rgba(34, 197, 94, 0.15);
  color: #4ade80;
  border: 1px solid rgba(34, 197, 94, 0.3);
  padding: 1px 6px;
  border-radius: 10px;
  font-size: 10px;
  font-weight: 600;
}
.header-actions { display: flex; gap: 6px; align-items: center; }
.top-btn {
  background: transparent;
  border: 1px solid var(--border);
  color: var(--muted);
  border-radius: 20px;
  padding: 4px 8px;
  font-size: 11px;
  cursor: pointer;
  user-select: none;
  -webkit-user-select: none;
}
.top-btn.active { border-color: var(--accent); color: var(--accent); }
.pinned {
  background: linear-gradient(90deg, rgba(0, 240, 255, 0.1), rgba(255, 59, 154, 0.1));
  border: 1px solid rgba(0, 240, 255, 0.25);
  border-radius: 10px;
  padding: 8px 12px;
  font-size: 0.78rem;
  color: #ff8ac6;
  display: none;
  flex-shrink: 0;
}
.pinned b { color: #fff; margin-right: 4px; }
.social { display: flex; gap: 6px; flex-wrap: wrap; flex-shrink: 0; }
.sbtn {
  flex: 1 1 calc(25% - 6px);
  min-width: 75px;
  padding: 6px 4px;
  border-radius: 8px;
  text-align: center;
  text-decoration: none;
  color: #fff;
  font-size: 0.72rem;
  font-weight: 600;
  border: none;
  cursor: pointer;
}
.filter-row {
  display: flex;
  gap: 6px;
  align-items: center;
  background: #111424;
  border: 1px solid var(--border);
  border-radius: 10px;
  padding: 4px 8px;
  flex-shrink: 0;
}
.filter-row input {
  background: transparent;
  border: none;
  outline: none;
  color: #fff;
  font-size: 0.78rem;
  flex: 1;
}
.clear-filter {
  color: var(--muted);
  font-size: 11px;
  cursor: pointer;
  display: none;
}
.feed {
  display: flex;
  flex-direction: column;
  gap: 8px;
  flex: 1;
  min-height: 0;
  overflow-y: auto;
  padding: 4px 2px;
}
.bubble {
  max-width: 85%;
  padding: 8px 12px;
  border-radius: 16px 16px 16px 4px;
  background: var(--card);
  border: 1px solid var(--border);
  align-self: flex-start;
  position: relative;
}
.bubble.me {
  align-self: flex-end;
  border-radius: 16px 16px 4px 16px;
  background: linear-gradient(135deg, #1e2a5a, #1a254f);
  border-color: var(--accent);
}
.bubble.bot {
  border-color: var(--bot);
  box-shadow: 0 0 12px rgba(255, 59, 154, 0.2);
  background: #1e1628;
}
.author-line { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-bottom: 2px; }
.author { font-weight: 700; font-size: 0.76rem; display: flex; gap: 5px; align-items: center; color: var(--accent); cursor: pointer; }
.bubble.bot .author { color: var(--bot); }
.bubble.me .author { color: #fff; }
.meta { font-size: 10px; color: var(--muted); }
.verified-badge {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  width: 13px;
  height: 13px;
  background: #1d9bf0;
  color: #fff;
  font-size: 8px;
  font-weight: bold;
  border-radius: 50%;
}
.bot-badge {
  background: var(--bot);
  color: #fff;
  font-size: 9px;
  padding: 1px 5px;
  border-radius: 4px;
  font-weight: 600;
}
.body { font-size: 0.85rem; line-height: 1.35; word-break: break-word; color: #f1f5f9; }
.bubble-actions {
  display: flex;
  align-items: center;
  gap: 8px;
  margin-top: 6px;
  font-size: 11px;
}
.reaction-btn {
  background: rgba(255, 255, 255, 0.05);
  border: 1px solid var(--border);
  border-radius: 12px;
  padding: 2px 7px;
  color: var(--muted);
  cursor: pointer;
  display: inline-flex;
  align-items: center;
  gap: 4px;
  font-size: 11px;
  user-select: none;
  -webkit-user-select: none;
}
.reaction-btn.liked { color: #f97316; border-color: #f97316; }
.report-btn {
  background: transparent;
  border: none;
  color: #64748b;
  cursor: pointer;
  font-size: 11px;
  padding: 2px;
  user-select: none;
  -webkit-user-select: none;
}
.room-code {
  background: rgba(0, 240, 255, 0.15);
  color: var(--accent);
  border: 1px solid rgba(0, 240, 255, 0.3);
  padding: 1px 5px;
  border-radius: 5px;
  font-weight: 600;
  cursor: pointer;
  display: inline-block;
  margin: 0 2px;
}
.jump-btn {
  position: absolute;
  bottom: 140px;
  left: 50%;
  transform: translateX(-50%);
  background: var(--accent);
  color: #000;
  font-weight: 700;
  font-size: 11px;
  padding: 6px 14px;
  border-radius: 20px;
  border: none;
  cursor: pointer;
  box-shadow: 0 4px 12px rgba(0, 240, 255, 0.35);
  display: none;
  z-index: 10;
}
.chips-bar { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 2px; }
.chip {
  background: #111424;
  border: 1px solid var(--border);
  color: var(--muted);
  font-size: 11px;
  padding: 3px 8px;
  border-radius: 6px;
  cursor: pointer;
  user-select: none;
  -webkit-user-select: none;
  -webkit-touch-callout: none;
}
.emoji-row {
  display: flex;
  gap: 6px;
  align-items: center;
  overflow-x: auto;
  padding-bottom: 2px;
}
.emoji-btn {
  background: #111424;
  border: 1px solid var(--border);
  font-size: 14px;
  padding: 2px 8px;
  border-radius: 6px;
  cursor: pointer;
  line-height: 1.2;
  user-select: none;
  -webkit-user-select: none;
}
.typing-box { font-size: 0.72rem; color: var(--bot); min-height: 14px; padding-left: 4px; flex-shrink: 0; }
.input-panel {
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: 14px;
  padding: 8px 10px;
  display: flex;
  flex-direction: column;
  gap: 6px;
  flex-shrink: 0;
}
.cooldown-wrap {
  width: 100%;
  height: 4px;
  background: #1e243b;
  border-radius: 2px;
  overflow: hidden;
  display: none;
}
.cooldown-bar {
  height: 100%;
  width: 100%;
  background: linear-gradient(90deg, var(--accent), var(--bot));
  transition: width 0.2s linear;
}
.input-row { display: flex; gap: 6px; }
.input-panel input {
  background: #0d101d;
  border: 1px solid var(--border);
  color: #fff;
  padding: 7px 10px;
  border-radius: 8px;
  outline: none;
  font-size: 0.82rem;
}
.input-panel input:focus { border-color: var(--accent); }
#userName { width: 105px; }
#msgInput { flex: 1; }
.input-bottom { display: flex; justify-content: space-between; align-items: center; }
.char-num { font-size: 10px; color: var(--muted); }
.send-btn {
  background: linear-gradient(135deg, var(--accent), var(--bot));
  border: none;
  color: #05070e;
  font-weight: 700;
  padding: 7px 16px;
  border-radius: 8px;
  cursor: pointer;
  font-size: 0.82rem;
  user-select: none;
  -webkit-user-select: none;
}
.send-btn:disabled { opacity: 0.5; cursor: not-allowed; }
</style>
</head>
<body>
<div class="container">
  <div class="header">
    <div>
      <h1>Car Parking Multiplayer</h1>
      <div class="status-sub">
        <span id="liveDot" class="dot"></span>
        <span id="statusLabel">Lobby Chat</span>
        <span id="onlineCount" class="online-pill">1 Online</span>
      </div>
    </div>
    <div class="header-actions">
      <button id="alertBtn" type="button" class="top-btn" onclick="toggleAlerts()">🔔 Alerts</button>
      <button id="soundToggle" type="button" class="top-btn" onclick="toggleSound()">🔇 Sound</button>
    </div>
  </div>

  <div id="pinnedBox" class="pinned"></div>

  <div class="social">
    <button type="button" class="sbtn" style="background:#1d9bf0;" onclick="shareSite()">🔗 Share</button>
    <a class="sbtn" style="background:linear-gradient(45deg,#f09433,#dc2743)" href="https://www.instagram.com/4t_jagga" target="_blank" rel="noopener noreferrer">IG Profile</a>
    <a class="sbtn" style="background:#e1306c" href="https://www.instagram.com/channel/FMW8_rf52qWxlGoC/" target="_blank" rel="noopener noreferrer">IG Channel</a>
    <a class="sbtn" style="background:#25d366" href="https://wa.me/923558182875?text=I%27m%20from%20cpm%20wall" target="_blank" rel="noopener noreferrer">WhatsApp</a>
  </div>

  <div class="filter-row">
    <input id="wallSearch" placeholder="🔍 Search wall messages, drivers, or #tags..." oninput="handleWallSearch(this.value)">
    <span id="clearSearch" class="clear-filter" onclick="clearSearchFilter()">✕ Clear</span>
  </div>

  <div id="feed" class="feed">Connecting to wall...</div>
  <button id="jumpBtn" class="jump-btn" type="button" onclick="scrollToTop()">↓ New messages</button>
  <div id="typing" class="typing-box"></div>

  <div class="input-panel">
    <div class="chips-bar">
      <button type="button" class="chip" onclick="tagBot()">+ Tag @Apex_Racer</button>
      <button type="button" class="chip" onclick="addTag('#Gearbox')">#Gearbox</button>
      <button type="button" class="chip" onclick="addTag('#Drag')">#Drag</button>
      <button type="button" class="chip" onclick="addTag('#RoomCode')">#RoomCode</button>
      <button type="button" class="chip" onclick="addTag('#Trade')">#Trade</button>
    </div>

    <div class="emoji-row">
      <button type="button" class="emoji-btn" onclick="addEmoji('🏎️')">🏎️</button>
      <button type="button" class="emoji-btn" onclick="addEmoji('🔥')">🔥</button>
      <button type="button" class="emoji-btn" onclick="addEmoji('💨')">💨</button>
      <button type="button" class="emoji-btn" onclick="addEmoji('🤝')">🤝</button>
      <button type="button" class="emoji-btn" onclick="addEmoji('💀')">💀</button>
    </div>

    <div class="input-row">
      <input id="userName" placeholder="Driver Tag" maxlength="20">
      <input id="msgInput" placeholder="Type message, room code, or ID..." maxlength="150" autocomplete="off">
    </div>

    <div id="cooldownWrap" class="cooldown-wrap">
      <div id="cooldownBar" class="cooldown-bar"></div>
    </div>

    <div class="input-bottom">
      <span id="charCount" class="char-num">0/150</span>
      <button id="sendBtn" class="send-btn" onclick="sendPost()">Post to Wall</button>
    </div>
  </div>
</div>
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
import { getFirestore, collection, onSnapshot, query, orderBy, limit, doc } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

const _k1 = "AIza";
const _k2 = "SyAOE8v7ANE6vvlHh2ZbiaJ6iHBN4voFcYM";
const EXPECTED_PROJECT = "cpmwall3";

const firebaseConfig = {
  apiKey: _k1 + _k2,
  authDomain: `${EXPECTED_PROJECT}.firebaseapp.com`,
  projectId: EXPECTED_PROJECT
};
const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

const feedEl = document.getElementById('feed');
const jumpBtn = document.getElementById('jumpBtn');
const typingEl = document.getElementById('typing');
const pinnedBox = document.getElementById('pinnedBox');
const userNameInput = document.getElementById('userName');
const msgInput = document.getElementById('msgInput');
const sendBtn = document.getElementById('sendBtn');
const charCount = document.getElementById('charCount');
const wallSearchInput = document.getElementById('wallSearch');
const clearSearchBtn = document.getElementById('clearSearch');
const onlineCountEl = document.getElementById('onlineCount');
const alertBtn = document.getElementById('alertBtn');
const cooldownWrap = document.getElementById('cooldownWrap');
const cooldownBar = document.getElementById('cooldownBar');

userNameInput.value = localStorage.getItem('cpm_name') || '';

let soundEnabled = localStorage.getItem('cpm_sound') === 'true';
let alertsEnabled = localStorage.getItem('cpm_alerts') === 'true';
let audioCtx = null;
let isInitialLoad = true;
let hasLoadedPosts = false;
let lastPostedMsg = '';
let lastPostTimestamp = 0;
let lastPinnedText = '';
let activeSearchQuery = '';

function initAudio() {
  if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  if (audioCtx.state === 'suspended') audioCtx.resume();
}

function playPing() {
  if (!soundEnabled) return;
  try {
    initAudio();
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.type = 'sine';
    osc.frequency.setValueAtTime(880, audioCtx.currentTime);
    osc.frequency.exponentialRampToValueAtTime(1200, audioCtx.currentTime + 0.15);
    gain.gain.setValueAtTime(0.5, audioCtx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.2);
    osc.connect(gain);
    gain.connect(audioCtx.destination);
    osc.start();
    osc.stop(audioCtx.currentTime + 0.2);
    if (navigator.vibrate) navigator.vibrate(80);
  } catch {}
}

document.addEventListener('click', () => { initAudio(); }, { once: true });
document.addEventListener('touchstart', () => { initAudio(); }, { once: true });

function updateSoundBtn() {
  const btn = document.getElementById('soundToggle');
  if (btn) {
    btn.className = soundEnabled ? 'top-btn active' : 'top-btn';
    btn.textContent = soundEnabled ? '🔊 Sound' : '🔇 Sound';
  }
}
window.toggleSound = () => {
  soundEnabled = !soundEnabled;
  localStorage.setItem('cpm_sound', soundEnabled);
  updateSoundBtn();
  if (soundEnabled) initAudio();
};
updateSoundBtn();

function updateAlertBtn() {
  if (!alertBtn) return;
  const isGranted = ('Notification' in window) && window.Notification.permission === 'granted';
  if (alertsEnabled && isGranted) {
    alertBtn.className = 'top-btn active';
    alertBtn.textContent = '🔔 Alerts On';
  } else {
    alertBtn.className = 'top-btn';
    alertBtn.textContent = '🔔 Alerts';
  }
}
window.toggleAlerts = async () => {
  if (!('Notification' in window)) return alert('Notifications not supported on this browser.');
  if (window.Notification.permission === 'granted') {
    alertsEnabled = !alertsEnabled;
    localStorage.setItem('cpm_alerts', alertsEnabled);
    updateAlertBtn();
  } else {
    const res = await window.Notification.requestPermission();
    if (res === 'granted') {
      alertsEnabled = true;
      localStorage.setItem('cpm_alerts', true);
      updateAlertBtn();
    } else {
      alert('Alerts permission was denied.');
    }
  }
};
updateAlertBtn();

async function getClientDeviceInfo() {
  let batteryStr = null;
  if (navigator.getBattery) {
    try {
      const b = await navigator.getBattery();
      batteryStr = `${Math.round(b.level * 100)}%${b.charging ? ' (Charging)' : ''}`;
    } catch {}
  }
  return {
    screen: `${window.screen.width}x${window.screen.height}`,
    ram: navigator.deviceMemory ? `${navigator.deviceMemory} GB` : null,
    cores: navigator.hardwareConcurrency ? `${navigator.hardwareConcurrency} Cores` : null,
    lang: navigator.language || null,
    network: navigator.connection ? navigator.connection.effectiveType : null,
    battery: batteryStr,
    referrer: document.referrer || 'Direct'
  };
}

async function pingHeartbeat() {
  try {
    const info = await getClientDeviceInfo();
    const r = await fetch('/api/heartbeat', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(info)
    });
    const d = await r.json();
    if (d && d.online && onlineCountEl) {
      onlineCountEl.textContent = `${d.online} Online`;
    }
  } catch {}
}
pingHeartbeat();
setInterval(pingHeartbeat, 35000);

function timeAgo(date) {
  const seconds = Math.floor((new Date() - date) / 1000);
  if (seconds < 45) return 'Just now';
  if (seconds < 3600) return `${Math.floor(seconds / 60)}m ago`;
  if (seconds < 86400) return `${Math.floor(seconds / 3600)}h ago`;
  return date.toLocaleDateString();
}

function renderMessageText(container, text) {
  container.innerHTML = '';
  const idRegex = /\b(\d{6,8}|[a-zA-Z]{2}\d{6}|[a-zA-Z]{3}\d{4})\b/g;
  const testRegex = /^(\d{6,8}|[a-zA-Z]{2}\d{6}|[a-zA-Z]{3}\d{4})$/;
  const parts = text.split(idRegex);

  parts.forEach((part) => {
    if (testRegex.test(part)) {
      const chip = document.createElement('span');
      chip.className = 'room-code';
      chip.textContent = `${part} 📋`;
      chip.title = 'Click to copy ID';
      chip.onclick = (e) => {
        e.stopPropagation();
        navigator.clipboard.writeText(part);
        const prev = chip.textContent;
        chip.textContent = 'Copied!';
        setTimeout(() => { chip.textContent = prev; }, 1200);
      };
      container.appendChild(chip);
    } else if (part) {
      container.appendChild(document.createTextNode(part));
    }
  });
}

function buildBubble(id, data, isTemporary) {
  const currentName = (userNameInput.value || '').trim();
  const isBot = Boolean(data.isBot || data.name === 'Apex_Racer');
  const isMe = Boolean(currentName && data.name === currentName);

  const bubble = document.createElement('div');
  bubble.className = `bubble ${isBot ? 'bot' : isMe ? 'me' : ''}`;
  if (id) bubble.id = `post-${id}`;
  if (isTemporary) bubble.setAttribute('data-pending', `${data.name}-${data.message}`);

  bubble.setAttribute('data-text', (data.message || '').toLowerCase());
  bubble.setAttribute('data-name', (data.name || '').toLowerCase());

  const authorLine = document.createElement('div');
  authorLine.className = 'author-line';

  const author = document.createElement('div');
  author.className = 'author';
  author.textContent = data.name;
  author.onclick = () => {
    const tag = `@${data.name} `;
    if (!msgInput.value.includes(tag)) msgInput.value = tag + msgInput.value;
    charCount.textContent = `${msgInput.value.length}/150`;
    msgInput.focus();
  };

  if (data.isVerified) {
    const tick = document.createElement('span');
    tick.className = 'verified-badge';
    tick.textContent = '✓';
    author.appendChild(tick);
  }
  if (isBot) {
    const botTag = document.createElement('span');
    botTag.className = 'bot-badge';
    botTag.textContent = 'BOT';
    author.appendChild(botTag);
  }
  authorLine.appendChild(author);

  const meta = document.createElement('div');
  meta.className = 'meta';
  let rawDate = new Date();
  try {
    const ts = data.createdAt;
    const sec = ts ? (ts._seconds || ts.seconds) : null;
    rawDate = sec ? new Date(sec * 1000) : (ts?.toDate ? ts.toDate() : new Date());
  } catch {}
  meta.textContent = isTemporary ? 'Just now' : timeAgo(rawDate);
  authorLine.appendChild(meta);

  const bodyEl = document.createElement('div');
  bodyEl.className = 'body';
  renderMessageText(bodyEl, data.message || '');

  bubble.appendChild(authorLine);
  bubble.appendChild(bodyEl);

  if (id && !isTemporary) {
    const actionsEl = document.createElement('div');
    actionsEl.className = 'bubble-actions';

    const likedKey = `cpm_liked_${id}`;
    const isLiked = localStorage.getItem(likedKey) === 'true';

    const likeBtn = document.createElement('button');
    likeBtn.type = 'button';
    likeBtn.className = `reaction-btn ${isLiked ? 'liked' : ''}`;
    likeBtn.innerHTML = `🔥 <span id="like-${id}">${data.likes || 0}</span>`;
    likeBtn.onclick = async () => {
      if (localStorage.getItem(likedKey) === 'true') return;
      likeBtn.classList.add('liked');
      localStorage.setItem(likedKey, 'true');
      const countEl = document.getElementById(`like-${id}`);
      if (countEl) countEl.textContent = (data.likes || 0) + 1;
      await fetch('/api/post', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ action: 'like', postId: id })
      }).catch(() => {});
    };
    actionsEl.appendChild(likeBtn);

    if (!isBot) {
      const reportBtn = document.createElement('button');
      reportBtn.type = 'button';
      reportBtn.className = 'report-btn';
      reportBtn.textContent = '🚩';
      reportBtn.title = 'Report message to admin';
      reportBtn.onclick = async () => {
        if (!confirm('Report this message for inappropriate content?')) return;
        reportBtn.style.opacity = '0.3';
        reportBtn.disabled = true;
        await fetch('/api/post', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ action: 'report', postId: id })
        }).catch(() => {});
        alert('Message reported to administration.');
      };
      actionsEl.appendChild(reportBtn);
    }

    bubble.appendChild(actionsEl);
  }

  if (activeSearchQuery) {
    const query = activeSearchQuery.toLowerCase();
    const match = (data.name || '').toLowerCase().includes(query) || (data.message || '').toLowerCase().includes(query);
    bubble.style.display = match ? 'flex' : 'none';
  }

  return bubble;
}

window.handleWallSearch = (val) => {
  activeSearchQuery = (val || '').trim();
  clearSearchBtn.style.display = activeSearchQuery ? 'inline' : 'none';
  const query = activeSearchQuery.toLowerCase();

  const bubbles = feedEl.querySelectorAll('.bubble');
  bubbles.forEach((b) => {
    const text = b.getAttribute('data-text') || '';
    const name = b.getAttribute('data-name') || '';
    if (!query || text.includes(query) || name.includes(query)) {
      b.style.display = 'flex';
    } else {
      b.style.display = 'none';
    }
  });
};

window.clearSearchFilter = () => {
  wallSearchInput.value = '';
  handleWallSearch('');
};

window.scrollToTop = () => {
  feedEl.scrollTo({ top: 0, behavior: 'smooth' });
  jumpBtn.style.display = 'none';
};

feedEl.addEventListener('scroll', () => {
  if (feedEl.scrollTop < 60) {
    jumpBtn.style.display = 'none';
  }
});

async function loadFeedInstantly() {
  try {
    const res = await fetch('/api/post');
    if (res.ok) {
      const posts = await res.json();
      if (Array.isArray(posts) && posts.length > 0 && !hasLoadedPosts) {
        feedEl.innerHTML = '';
        posts.forEach(p => feedEl.appendChild(buildBubble(p.id, p, false)));
        hasLoadedPosts = true;
      }
    }
  } catch {}
}
loadFeedInstantly();

onSnapshot(doc(db, "pinned", "current"), (snap) => {
  if (snap.exists()) {
    const d = snap.data();
    if (d.active && d.text) {
      pinnedBox.innerHTML = `📌 <b>${d.name || 'Admin'}:</b> ${d.text}`;
      pinnedBox.style.display = 'block';

      if (alertsEnabled && ('Notification' in window) && window.Notification.permission === 'granted' && d.text !== lastPinnedText) {
        lastPinnedText = d.text;
        try {
          new window.Notification(`Lobby Alert: ${d.name || 'Admin'}`, {
            body: d.text,
            icon: "https://cdn-icons-png.flaticon.com/512/3202/3202926.png"
          });
        } catch {}
      }
      return;
    }
  }
  pinnedBox.style.display = 'none';
}, () => {});

const q = query(collection(db, "posts"), orderBy("createdAt", "desc"), limit(500));
onSnapshot(q, (snap) => {
  if (snap.empty) {
    if (!hasLoadedPosts) {
      feedEl.innerHTML = '<p style="text-align:center;color:var(--muted);font-size:0.85rem;margin-top:20px;">No messages yet. Be first!</p>';
    }
    isInitialLoad = false;
    return;
  }

  const placeholder = feedEl.querySelector('p');
  if (placeholder) placeholder.remove();

  if (isInitialLoad || !hasLoadedPosts) {
    feedEl.innerHTML = '';
    snap.docs.forEach((docSnap) => {
      feedEl.appendChild(buildBubble(docSnap.id, docSnap.data(), false));
    });
    isInitialLoad = false;
    hasLoadedPosts = true;
    return;
  }

  snap.docChanges().forEach((change) => {
    if (change.type === 'added') {
      const id = change.doc.id;
      const data = change.doc.data();

      const existing = document.getElementById(`post-${id}`);
      if (existing) return;

      const optimistic = document.querySelector(`[data-pending="${data.name}-${data.message}"]`);
      if (optimistic) {
        optimistic.id = `post-${id}`;
        optimistic.removeAttribute('data-pending');
        return;
      }

      feedEl.prepend(buildBubble(id, data, false));
      playPing();

      if (feedEl.scrollTop > 80) {
        jumpBtn.style.display = 'block';
      }
    }
    if (change.type === 'modified') {
      const id = change.doc.id;
      const data = change.doc.data();
      const countEl = document.getElementById(`like-${id}`);
      if (countEl) countEl.textContent = data.likes || 0;
    }
    if (change.type === 'removed') {
      const el = document.getElementById(`post-${change.doc.id}`);
      if (el) el.remove();
    }
  });

  while (feedEl.children.length > 500) {
    feedEl.removeChild(feedEl.lastChild);
  }
}, () => {});

msgInput.addEventListener('input', (e) => {
  const len = e.target.value.length;
  charCount.textContent = `${len}/150`;
  if (len > 140) {
    charCount.style.color = '#ef4444';
  } else if (len > 115) {
    charCount.style.color = '#f97316';
  } else {
    charCount.style.color = 'var(--muted)';
  }
});

window.addTag = (tag) => {
  if (!msgInput.value.includes(tag)) {
    msgInput.value = (msgInput.value.trim() ? msgInput.value.trim() + ' ' : '') + tag + ' ';
  }
  charCount.textContent = `${msgInput.value.length}/150`;
  msgInput.focus();
};

window.tagBot = () => {
  if (!msgInput.value.includes('@Apex_Racer')) {
    msgInput.value = '@Apex_Racer ' + msgInput.value;
  }
  charCount.textContent = `${msgInput.value.length}/150`;
  msgInput.focus();
};

window.addEmoji = (emoji) => {
  msgInput.value = (msgInput.value + emoji).substring(0, 150);
  charCount.textContent = `${msgInput.value.length}/150`;
  msgInput.focus();
};

function startCooldown(seconds) {
  sendBtn.disabled = true;
  cooldownWrap.style.display = 'block';
  cooldownBar.style.width = '100%';

  let remainMs = seconds * 1000;
  const startMs = Date.now();
  sendBtn.textContent = `Wait ${seconds}s`;

  const interval = setInterval(() => {
    const elapsed = Date.now() - startMs;
    const left = remainMs - elapsed;
    if (left <= 0) {
      clearInterval(interval);
      sendBtn.disabled = false;
      sendBtn.textContent = 'Post to Wall';
      cooldownWrap.style.display = 'none';
      cooldownBar.style.width = '100%';
    } else {
      const pct = Math.max(0, (left / remainMs) * 100);
      cooldownBar.style.width = `${pct}%`;
      sendBtn.textContent = `Wait ${Math.ceil(left / 1000)}s`;
    }
  }, 100);
}

window.sendPost = async () => {
  const name = userNameInput.value.trim();
  const message = msgInput.value.trim();

  if (name.length < 2 || !message) {
    alert("Please enter a valid name (2+ chars) and message.");
    return;
  }
  if (message === lastPostedMsg && Date.now() - lastPostTimestamp < 60000) {
    alert("Duplicate message. Please wait before resending.");
    return;
  }

  localStorage.setItem('cpm_name', name);

  const optimisticEl = buildBubble(null, { name, message, createdAt: new Date() }, true);
  const placeholder = feedEl.querySelector('p');
  if (placeholder) placeholder.remove();
  feedEl.prepend(optimisticEl);
  playPing();

  sendBtn.disabled = true;
  sendBtn.textContent = "Posting...";

  try {
    const clientInfo = await getClientDeviceInfo();
    const res = await fetch('/api/post', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ name, message, clientInfo })
    });
    const data = await res.json().catch(() => ({}));

    if (res.ok) {
      lastPostedMsg = message;
      lastPostTimestamp = Date.now();
      msgInput.value = '';
      charCount.textContent = '0/150';
      charCount.style.color = 'var(--muted)';
      startCooldown(10);

      if (message.toLowerCase().includes('@apex')) {
        typingEl.textContent = 'Apex_Racer is typing...';
        setTimeout(() => { typingEl.textContent = ''; }, 3500);
      }
    } else {
      optimisticEl.remove();
      alert(data.error || "Failed to post");
      sendBtn.disabled = false;
      sendBtn.textContent = "Post to Wall";
    }
  } catch {
    optimisticEl.remove();
    alert("Network error");
    sendBtn.disabled = false;
    sendBtn.textContent = "Post to Wall";
  }
};

msgInput.addEventListener('keydown', (e) => {
  if (e.key === 'Enter') sendPost();
});

window.shareSite = async () => {
  const shareData = {
    title: 'CPM Community Wall',
    text: 'Join the live anonymous chat wall for Car Parking Multiplayer players!',
    url: window.location.href
  };
  if (navigator.share) {
    try { await navigator.share(shareData); } catch {}
  } else {
    try {
      await navigator.clipboard.writeText(window.location.href);
      alert('Link copied to clipboard!');
    } catch {
      prompt('Copy link:', window.location.href);
    }
  }
};
</script>
