  if(this.safeR<.98&&rnd()<dt*(1.2+this.stage*1.1)){
   const q1=rnd()*PI2,q2=q1+(rnd()-.5)*.45;
   const r1=(this.safeR+rnd()*(1-this.safeR))*R,r2=Math.min(R-3,r1+(rnd()-.5)*26);

  this.timer-=dt;

   if(this.timer<=0)this.beginWarning(1);

   if(this.timer<=0)this.beginShrink();

const KING_SLAYER_WINDOW=2.2; // max seconds between last flag collision and King hole capture for reliable attribution
const KING={
 kingC:-1,

 phaseActive:false,

 kingWonRound:false,

 init(){
  this.rings=[];for(let i=0;i<8;i++)this.rings.push({o:0,x:0,y:0,r:6,mr:80,t:0,d:.75,col:'#ffd23f'});
  this.sparks=[];for(let i=0;i<60;i++)this.sparks.push({o:0,x:0,y:0,vx:0,vy:0,l:0,c:'#ffd23f',sz:3.5});
 },
 reset(){
  if(this.roundSelectionRecorded&&!this.roundOutcomeRecorded&&APPS.has(this.kingC)){
   kingStats.totalSelected=Math.max(0,kingStats.totalSelected-1);
   if(kingStats.selected[this.kingC]>1)kingStats.selected[this.kingC]--;
   else delete kingStats.selected[this.kingC];
   saveKingStats();
  }
  this.kingC=-1;
  this.kingAlive=false;
  this.phaseActive=false;
  this.slayerC=-1;
  this.pendingSlayerC=-1;
  this.kingWonRound=false;
  this.roundSelectionRecorded=false;
  this.roundOutcomeRecorded=false;
  this.introAnnounced=false;
  this.introT=0;
  this.defeatAnim=null;
  for(const r of this.rings)r.o=0;
  for(const p of this.sparks)p.o=0;
 },
 selectKingFromParticipants(){
  if(!F||!F.length)return -1;
  const active=F.filter(f=>f&&f.on&&APPS.has(f.c));
  if(!active.length)return -1;
  const pickIdx=Math.floor(rnd()*active.length);
  return active[pickIdx].c;
 },
 startRound(){
  if(!ED.king||!F||F.length!==N)return;
  const c=this.selectKingFromParticipants();
  if(!APPS.has(c))return;
  this.kingC=c;
  this.kingAlive=true;
  this.phaseActive=true;
  this.slayerC=-1;
  this.pendingSlayerC=-1;
  this.kingWonRound=false;
  this.roundSelectionRecorded=true;
  this.roundOutcomeRecorded=false;
  this.introAnnounced=false;
  this.introT=0;
  this.defeatAnim=null;
  this.kingRoundsCount++;
  // Record King selection exactly once per round
  kingStats.totalSelected++;
  kingStats.selected[c]=(kingStats.selected[c]||0)+1;
  saveKingStats();
  const kf=F.find(f=>f.c===c);

 },

  if(!ED.king||this.introAnnounced||!APPS.has(this.kingC))return;
  this.introAnnounced=true;
  this.introT=0.01;
  kingIntroS();
  const kName=C[this.kingC].n;
  ann={s:'KING OF THE ARENA · '+kName.toUpperCase(),t:0};
  if(this.kingRoundsCount<=1){
   say('King of the Arena begins! '+kName+' is crowned King of the Arena! All countries compete to eliminate the King!',2);
  }else{
   say('New King selected for Round '+round+'! '+kName+' is crowned King of the Arena!',2);
  }

  if(!isTimeout&&APPS.has(f.lastHitBy)&&f.lastHitBy!==this.kingC&&(t-(f.lastHitAt||-99))<=KING_SLAYER_WINDOW){
   this.pendingSlayerC=f.lastHitBy;

   this.pendingSlayerC=-1;

 onKingEliminated(remCount){

  this.phaseActive=false;
  const kC=this.kingC,kName=C[kC]?C[kC].n:'The King';
  const slayer=APPS.has(this.pendingSlayerC)&&this.pendingSlayerC!==kC?this.pendingSlayerC:-1;
  this.slayerC=slayer;
  if(!this.roundOutcomeRecorded){
   this.roundOutcomeRecorded=true;
   kingStats.totalKingElims++;
   kingStats.kingElims[kC]=(kingStats.kingElims[kC]||0)+1;
   kingStats.curKingStreak=0;
   kingStats.curKingStreakC=-1;
   delete kingStats.curCountryStreak[kC];
   if(slayer>=0){
    kingStats.totalSlayerWins++;
    kingStats.slayerWins[slayer]=(kingStats.slayerWins[slayer]||0)+1;
   }
   saveKingStats();
  }
  this.defeatAnim={t:0,d:3.4,kingC:kC,slayerC:slayer};
  this.spawnRoyalBurst(CX,CY,'#ffd23f',44,115);
  this.spawnRoyalBurst(CX,CY,'#ff4d6d',22,85);
  flash=Math.max(flash,.55);

  if(toast&&toast.c===kC){toast.king=1;toast.slayer=slayer}
  if(slayer>=0){
   const sName=C[slayer].n;
   ann={s:'KING DEFEATED! SLAYER: '+sName.toUpperCase(),t:0};
   say('King defeated! King '+kName+' has been eliminated by '+sName+'! '+sName+' is awarded King Slayer!',3);
  }else{
   ann={s:'KING DEFEATED! '+kName.toUpperCase()+' HAS FALLEN!',t:0};
   say('King defeated! King '+kName+' has been eliminated! '+remCount+' countries battle on!',3);
  }

  if(!ED.king)return;

   this.kingWonRound=true;
   this.phaseActive=false;
   if(!this.roundOutcomeRecorded){
    this.roundOutcomeRecorded=true;
    kingStats.totalKingWins++;
    kingStats.kingWins[winnerC]=(kingStats.kingWins[winnerC]||0)+1;
    kingStats.curKingStreak=(kingStats.curKingStreak||0)+1;
    kingStats.curKingStreakC=winnerC;
    const cs=(kingStats.curCountryStreak[winnerC]||0)+1;
    kingStats.curCountryStreak[winnerC]=cs;
    if(cs>(kingStats.bestCountryStreak[winnerC]||0))kingStats.bestCountryStreak[winnerC]=cs;
    if(kingStats.curKingStreak>kingStats.bestKingStreak){
     kingStats.bestKingStreak=kingStats.curKingStreak;
     kingStats.bestKingStreakC=winnerC;
    }
    if(cs>kingStats.bestKingStreak){
     kingStats.bestKingStreak=cs;
     kingStats.bestKingStreakC=winnerC;
    }
    saveKingStats();
   }
   kingWinS();
  }else{
   this.kingWonRound=false;
   this.phaseActive=false;

   kingC:this.kingC,
   kingAlive:this.kingAlive,

   slayerC:this.slayerC,
   pendingSlayerC:this.pendingSlayerC,

  if(!o||typeof o!=='object')return;
  if(APPS.has(+o.kingC)&&F&&F.some(f=>f.c===+o.kingC)){
   this.kingC=+o.kingC;
   const kf=F.find(f=>f.c===this.kingC);
   this.kingAlive=!!(o.kingAlive&&kf&&kf.on);
   this.phaseActive=!!(o.phaseActive&&this.kingAlive);
   this.slayerC=APPS.has(+o.slayerC)?+o.slayerC:-1;
   this.pendingSlayerC=APPS.has(+o.pendingSlayerC)?+o.pendingSlayerC:-1;

   this.introT=isFinite(+o.introT)?Math.max(0,+o.introT):4;
   if(Number.isInteger(+o.kingRoundsCount)&&+o.kingRoundsCount>=0)this.kingRoundsCount=+o.kingRoundsCount;
  }else if(F&&F.length===N){

  for(const r of this.rings){if(!r.o)continue;r.t+=dt;r.r=8+(r.mr-8)*Math.min(1,r.t/r.d);if(r.t>=r.d)r.o=0}
  for(const p of this.sparks){if(!p.o)continue;p.x+=p.vx*dt;p.y+=p.vy*dt;p.vx*=1-1.8*dt;p.vy*=1-1.8*dt;p.l-=dt*1.5;if(p.l<=0)p.o=0}
 },
 drawBack(){
  if(!ED.king)return;

 resolveSimultaneousTie(elims){
  // Deterministic 3-tier tie-resolution rule (never invents an ungrounded winner):
  // 1) Greater distance from arena center at elimination moment
  // 2) Higher cumulative survival time of the team during the round
  // 3) Lower minimum canonical country index on the team roster
  const e0=elims.find(e=>e.team===0),e1=elims.find(e=>e.team===1);
  const d0=e0?e0.dist:0,d1=e1?e1.dist:0;
  if(Math.abs(d0-d1)>1e-6)return{winTeam:d0>d1?0:1,rule:'distance_from_hole'};
  if(Math.abs(this.survivalSum[0]-this.survivalSum[1])>1e-6)return{winTeam:this.survivalSum[0]>this.survivalSum[1]?0:1,rule:'team_survival_time'};
  const m0=Math.min(...(this.rosters[0].length?this.rosters[0]:[999]));
  const m1=Math.min(...(this.rosters[1].length?this.rosters[1]:[999]));
  return{winTeam:m0<=m1?0:1,rule:'canonical_roster_order'};
 },
 onMemberEliminated(c){
  if(!ED.team)return;
  const tm=this.teamByC[c];
  if(tm!==0&&tm!==1)return;
  const [a,b]=this.updateCounts();
  const mine=tm===0?a:b,other=tm===0?b:a;
  const tCfg=TEAM_CFG.teams[tm],oCfg=TEAM_CFG.teams[1-tm];
  if(toast&&toast.c===c)toast.team=tm;
  teamElimS(tm);
  if(a===0||b===0)return;
  const now=performance.now();
  if(mine===1&&!this.lastHopeAnn[tm]){
   this.lastHopeAnn[tm]=true;
   const lastF=F.find(f=>f.on&&f.team===tm);
   const ln=lastF?C[lastF.c].n:'one flag';
   if(other===1){
    const oF=F.find(f=>f.on&&f.team===1-tm);
    shout('Final one versus one! '+ln+' for '+tCfg.name+' versus '+(oF?C[oF.c].n:'rival')+' for '+oCfg.name+'!','1V1 TEAM SHOWDOWN!');
   }else{
    shout('Last hope for '+tCfg.name+' '+tCfg.label+'! Only '+ln+' remains!',tCfg.name+' LAST SURVIVOR: '+ln.toUpperCase());
   }
   this.lastElimSay=now;
   return;
  }
  if(!this.critAnn[tm]&&((other-mine>=5&&mine<=7)||mine<=3)){
   this.critAnn[tm]=true;
   shout(tCfg.name+' '+tCfg.label+' is in critical danger with only '+mine+' remaining against '+other+'!',tCfg.name+' IN CRITICAL DANGER!');
   this.lastElimSay=now;
   return;
  }

   shout(C[c].n+' is out! '+tCfg.name+' '+tCfg.label+' drops to '+mine+' survivors!',tCfg.name+': '+mine+' LEFT');
   this.lastElimSay=now;
   return;
  }
  if(now-this.lastElimSay>=TEAM_CFG.elimSayGap){
   this.lastElimSay=now;
   say(C[c].n+' is eliminated! '+tCfg.name+' '+tCfg.label+' has '+mine+' left.',1);
  }
 },
 checkVictory(elimsThisTick){
  if(!ED.team||phase!==0)return null;
  const [a,b]=this.updateCounts();
  if(a>0&&b>0)return null;
  let winTeam=-1,tieRule=null;
  if(a>0&&b===0)winTeam=0;
  else if(b>0&&a===0)winTeam=1;
  else{
   const res=this.resolveSimultaneousTie(elimsThisTick||[]);
   winTeam=res.winTeam;tieRule=res.rule;
  }
  this.winTeam=winTeam;this.tieRule=tieRule;
  if(!this.roundOutcomeRecorded){
   this.roundOutcomeRecorded=true;
   teamStats.totalMatches++;
   if(winTeam===0)teamStats.teamAWins++;else teamStats.teamBWins++;
   if(teamStats.curStreakTeam===winTeam)teamStats.curStreak++;
   else{teamStats.curStreakTeam=winTeam;teamStats.curStreak=1}
   if(teamStats.curStreak>teamStats.bestStreak){teamStats.bestStreak=teamStats.curStreak;teamStats.bestStreakTeam=winTeam}
   for(const c of this.rosters[winTeam]){
    if(APPS.has(c))teamStats.countryWins[c]=(teamStats.countryWins[c]||0)+1;

  const tCfg=TEAM_CFG.teams[winTeam];
  teamWinS();
  winCap=tCfg.name+' · '+tCfg.label+' VICTORY!'+(tieRule?' (TIE-BREAK)':'');
  say(tCfg.name+' '+tCfg.label+' wins Team Wars!'+(survivors.length?' '+survivors.length+(survivors.length===1?' survivor':' survivors')+' standing!':' Decided by tie-breaker!'),3);

 sp:1,pull:1,rot:1,slow:1,

// ===== 5. POWER-UP BATTLE EDITION CONTROLLER =====
const POWER_CFG={
 spawnInterval:4.8,
 firstSpawn:3.2,
 maxOrbs:2,
 orbRadius:.055,
 orbLife:11.0,
 pickupCd:2.5,
 minSpawnR:.42,
 maxSpawnR:.78,
 types:{
  speed:{id:'speed',n:'SPEED BOOST',short:'SPEED',sym:'S',col:'#ff9f1c',dur:5.5,rare:false},
  shield:{id:'shield',n:'TEMP SHIELD',short:'SHIELD',sym:'H',col:'#67e8f9',dur:6.0,rare:false},
  gravity:{id:'gravity',n:'GRAVITY RESIST',short:'GRAV',sym:'G',col:'#a78bfa',dur:6.5,rare:false},
  recovery:{id:'recovery',n:'RECOVERY BOOST',short:'RECOV',sym:'R',col:'#80ed99',dur:7.0,rare:true},
  burst:{id:'burst',n:'ENERGY BURST',short:'BURST',sym:'B',col:'#ff2bd6',dur:3.5,rare:true}
 }
};
const POWER_LIST=Object.values(POWER_CFG.types);
const POWER={
 orbs:[],nextSpawnT:3.2,collectedRound:0,lastCollector:null,
 introAnnounced:false,roundOutcomeRecorded:false,lastSayAt:0,
 fx:[],
 reset(){
  this.orbs=[];this.nextSpawnT=POWER_CFG.firstSpawn;this.collectedRound=0;this.lastCollector=null;
  this.introAnnounced=false;this.roundOutcomeRecorded=false;this.lastSayAt=0;this.fx=[];
  if(F)for(const f of F){f.pu=null;f.puCount=0;f.puCd=0}
 },
 startRound(){this.reset()},
 spawnOrb(al){
  if(this.orbs.length>=POWER_CFG.maxOrbs||al.length<=1)return null;
  const tp=POWER_LIST[Math.floor(rnd()*POWER_LIST.length)];
  // Fair placement: bias toward open spot near a survivor with lowest collection count
  let minCnt=1e9;
  for(const f of al)if((f.puCount||0)<minCnt)minCnt=f.puCount||0;
  const lowFlags=al.filter(f=>(f.puCount||0)===minCnt);
  let ox=0,oy=0;
  for(let tries=0;tries<12;tries++){
   const baseAng=lowFlags.length&&tries<6?Math.atan2(lowFlags[Math.floor(rnd()*lowFlags.length)].y,lowFlags[Math.floor(rnd()*lowFlags.length)].x)+(rnd()-.5)*1.1:rnd()*PI2;
   const dist=POWER_CFG.minSpawnR+rnd()*(POWER_CFG.maxSpawnR-POWER_CFG.minSpawnR);
   ox=Math.cos(baseAng)*dist;oy=Math.sin(baseAng)*dist;
   if(!this.orbs.some(o=>Math.hypot(o.x-ox,o.y-oy)<.25))break;
  }
  const orb={id:Math.floor(rnd()*1e9),t:tp.id,x:ox,y:oy,r:POWER_CFG.orbRadius,age:0,life:POWER_CFG.orbLife,collected:false};
  this.orbs.push(orb);
  powerSpawnS();
  const now=performance.now();
  if(tp.rare&&now-this.lastSayAt>4500){this.lastSayAt=now;say('Rare power-up spawned: '+tp.n.toLowerCase()+'!',2)}
  return orb;
 },
 collectOrb(f,orb,al){
  if(orb.collected||!f.on||f.cp||(cap&&cap.f===f))return false;
  orb.collected=true;
  const tp=POWER_CFG.types[orb.t];
  f.pu={t:tp.id,r:tp.dur,d:tp.dur};
  f.puCount=(f.puCount||0)+1;
  f.puCd=POWER_CFG.pickupCd;
  if(tp.id==='shield')f.sh=Math.max(f.sh,tp.dur);
  if(tp.id==='burst'){
   powerBurstS();
   const d=Math.hypot(f.x,f.y)||1e-5;
   f.vx+=(f.x/d)*.22;f.vy+=(f.y/d)*.22;
   for(const q of al){
    if(q===f||!q.on)continue;
    const dx=q.x-f.x,dy=q.y-f.y,dd=Math.hypot(dx,dy);
    if(dd>1e-5&&dd<.32){q.vx+=dx/dd*.16;q.vy+=dy/dd*.16}
   }
  }else powerCollectS();
  this.collectedRound++;
  this.lastCollector={c:f.c,t:tp.id,at:t};
  this.fx.push({x:CX+orb.x*R,y:CY+orb.y*R,col:tp.col,t:0,d:.65,lbl:tp.short});
  powerStats.totalCollected++;
  powerStats.typeCounts[tp.id]=(powerStats.typeCounts[tp.id]||0)+1;
  if(APPS.has(f.c))powerStats.countryCollected[f.c]=(powerStats.countryCollected[f.c]||0)+1;
  savePowerStats();
  const now=performance.now();
  if(now-this.lastSayAt>3800){
   this.lastSayAt=now;
   say(C[f.c].n+' collects '+tp.n.toLowerCase()+'!',tp.rare?2:1);
  }
  return true;
 },
 getSpeedMul(f){
  if(!ED.power||!f.pu)return 1;
  if(f.pu.t==='speed')return 1.38;
  if(f.pu.t==='burst')return 1+.55*(f.pu.r/Math.max(.1,f.pu.d));
  return 1;
 },
 getPullMul(f){
  if(!ED.power||!f.pu)return 1;
  if(f.pu.t==='gravity')return .35;
  return 1;
 },
 checkRecovery(f,d){
  if(!ED.power||!f.on||!f.pu||f.pu.t!=='recovery'||d>=HR)return false;
  const nx=f.x/(d||1e-5),ny=f.y/(d||1e-5);
  f.vx=nx*Math.max(f.sp*1.45,.55);f.vy=ny*Math.max(f.sp*1.45,.55);
  f.x=nx*(HR+rr+.02);f.y=ny*(HR+rr+.02);
  f.pu=null;
  this.fx.push({x:CX+f.x*R,y:CY+f.y*R,col:'#80ed99',t:0,d:.7,lbl:'SAVED!'});
  chime();
  return true;
 },
 tick(dt,al){
  if(!ED.power||phase!==0)return;
  if(!this.introAnnounced&&t>=.08){
   this.introAnnounced=true;
   ann={s:'POWER-UP BATTLE · GRAB THE ORBS!',t:0};
   say('Power-Up Battle begins! Collect arena power-ups for temporary advantages!',2);
  }
  for(const f of F){
   if(!f.on){f.pu=null;f.puCd=0;continue}
   if(f.puCd>0)f.puCd=Math.max(0,f.puCd-dt);
   if(f.pu){f.pu.r-=dt;if(f.pu.r<=0)f.pu=null}
  }
  for(let i=this.fx.length-1;i>=0;i--){this.fx[i].t+=dt;if(this.fx[i].t>=this.fx[i].d)this.fx.splice(i,1)}
  if(al.length<=1){this.orbs=[];return}
  if(t>=this.nextSpawnT){
   this.spawnOrb(al);
   this.nextSpawnT=t+POWER_CFG.spawnInterval;
  }
  let minCnt=1e9;
  for(const f of al)if((f.puCount||0)<minCnt)minCnt=f.puCount||0;
  for(let i=this.orbs.length-1;i>=0;i--){
   const o=this.orbs[i];
   o.age+=dt;
   if(o.age>=o.life||o.collected){this.orbs.splice(i,1);continue}
   for(const f of al){
    if(f.puCd>0||f.cp||(cap&&cap.f===f))continue;
    // Anti-hoarding fairness: skip collector if they already have >=2 more pickups than minimum and orb is fresh
    if((f.puCount||0)>=minCnt+2&&o.age<3.0)continue;
    if(Math.hypot(f.x-o.x,f.y-o.y)<rr+o.r){
     if(this.collectOrb(f,o,al))break;
    }
   }
   if(o.collected)this.orbs.splice(i,1);
  }
 },
 onRoundWinner(winnerC){
  if(!ED.power||this.roundOutcomeRecorded)return;
  this.roundOutcomeRecorded=true;
  const wf=F.find(f=>f.c===winnerC);
  const hadPu=!!(wf&&(wf.puCount>0||wf.pu));
  this.orbs=[];
  if(F)for(const f of F){f.pu=null;f.puCd=0}
  powerStats.totalRounds++;
  if(APPS.has(winnerC))powerStats.wins[winnerC]=(powerStats.wins[winnerC]||0)+1;
  if(hadPu)powerStats.winsWithPowerUp++;
  savePowerStats();
 },
 serialize(){return{orbs:this.orbs,nextSpawnT:this.nextSpawnT,collectedRound:this.collectedRound,introAnnounced:this.introAnnounced,roundOutcomeRecorded:this.roundOutcomeRecorded}},
 deserialize(o){
  if(!o||typeof o!=='object')return;
  this.orbs=Array.isArray(o.orbs)?o.orbs.filter(x=>x&&POWER_IDS.has(x.t)&&isFinite(x.x+x.y)&&!x.collected).slice(0,POWER_CFG.maxOrbs):[];
  this.nextSpawnT=isFinite(+o.nextSpawnT)?+o.nextSpawnT:t+POWER_CFG.spawnInterval;
  this.collectedRound=safeInt(o.collectedRound,500);
  this.introAnnounced=!!o.introAnnounced;this.roundOutcomeRecorded=!!o.roundOutcomeRecorded;
 },
 drawBack(){
  if(!ED.power)return;
  ctx.save();
  const g=ctx.createRadialGradient(CX,CY,20,CX,CY,310);
  g.addColorStop(0,'#10b98133');g.addColorStop(1,'#00000000');
  ctx.fillStyle=g;ctx.fillRect(0,0,SW,SH);
  ctx.restore();
 },
 drawOrbs(){
  if(!ED.power||phase!==0)return;
  const tt=performance.now()/1000;
  ctx.save();

  function drawFront(){
    const k=key();if(!k)return;
    // 1. Edition-themed collision impact bursts
    if(impacts.length){
      ctx.save();
      for(const imp of impacts){
        const p=imp.t/imp.d,a=1-p;
        ctx.globalAlpha=a*0.8;
        ctx.strokeStyle=imp.c1;ctx.lineWidth=2*(1-p*0.5);
        ctx.beginPath();ctx.arc(imp.x,imp.y,4+p*16,0,PI2);ctx.stroke();
        ctx.fillStyle=imp.c2;
        for(let s=0;s<3;s++){
          const ag=imp.ang+s*2.09+p*1.2;
          ctx.beginPath();ctx.arc(imp.x+Math.cos(ag)*(4+p*14),imp.y+Math.sin(ag)*(4+p*14),1.8*(1-p*0.4),0,PI2);ctx.fill();
        }
      }
      ctx.restore();
    }
    // 2. Fast, non-blocking livestream-safe edition intro reveal (1.55s)
    if(introT>0&&phase===0){
      const alpha=Math.min(1,introT*2.2,(1.55-introT)*4.5);
      const lc=ED.leg&&LEGEND_CFG[ED.leg];
      const meta=lc?{tag:lc.sub,col:lc.rim,sub:ED.rarity?ED.rarity.toUpperCase()+' EDITION':'SPECIAL EDITION'}:INTRO_META[k];
      if(meta&&alpha>0.02){
        ctx.save();ctx.globalAlpha=alpha;
        pill(64,140,256,34,8,'#070b1ae6',meta.col);
        T(meta.tag,192,155,10,meta.col,'center',AN);
        T(meta.sub,192,168,7.5,'#e2e8f0','center','bold system-ui,sans-serif');
        ctx.restore();
      }
    }
  }

  function drawVictory(){
    const k=key();if(!k)return;
    const cols=IMPACT_COLORS[k]||['#ffd23f','#22d3ee'];
    const lc=ED.leg&&LEGEND_CFG[ED.leg];
    ctx.save();
    // Edition-colored victory radial spotlight & animated emblem ring
    const rg=ctx.createRadialGradient(192,300,18,192,300,225);
    rg.addColorStop(0,cols[0]+'44');rg.addColorStop(0.6,cols[1]+'18');rg.addColorStop(1,'#00000000');
    ctx.fillStyle=rg;ctx.fillRect(0,0,SW,SH);
    ctx.strokeStyle=cols[0]+'88';ctx.lineWidth=3;ctx.setLineDash([12,8]);
    ctx.beginPath();ctx.arc(192,300,104,wt*0.9,wt*0.9+PI2);ctx.stroke();ctx.setLineDash([]);
    ctx.strokeStyle=cols[1]+'55';ctx.lineWidth=1.8;
    ctx.beginPath();ctx.arc(192,300,114,-wt*0.6,-wt*0.6+PI2);ctx.stroke();
    if(lc){
      pill(84,158,216,24,12,'#070b1add',lc.rim);
      T(lc.sub+' CHAMPION',192,174,10,lc.rim,'center',AN);
    }
    ctx.restore();
  }

    getParticleMul(isVictory){
      const v=adm.visual||{};
      if(v.particlesEnabled===false)return 0;
      if(isVictory&&v.victoryAnimEnabled===false)return 0;
      let m=Math.max(0,Math.min(1,(v.fxIntensity??100)/100));
      if(v.reducedEffects)m*=0.35;
      else if(v.adaptiveQuality!==false){
        if(perfState.adaptiveLevel==='REDUCED')m*=0.35;
        else if(perfState.adaptiveLevel==='BALANCED')m*=0.65;
      }
      return m;

    recordFrame(rawMs){
      if(!(rawMs>0&&rawMs<1000))return;
      frameBuf[frameIdx]=rawMs;
      frameIdx=(frameIdx+1)%60;
      if(frameCount<60)frameCount++;
      if(frameIdx===0||frameCount===15){
        let sum=0,mx=0;
        for(let i=0;i<frameCount;i++){const v=frameBuf[i];sum+=v;if(v>mx)mx=v;}
        const avg=sum/Math.max(1,frameCount);
        const fps=Math.min(120,Math.round(1000/Math.max(1,avg)));
        perfState.avgFrameMs=+avg.toFixed(1);
        perfState.maxFrameMs=+mx.toFixed(1);
        perfState.fps=fps;
        perfState.unstable=(fps<42||mx>55);
        if(fps<42)lowFpsSec+=avg*frameCount/1000;else lowFpsSec=Math.max(0,lowFpsSec-0.5);
        if(adm.visual&&adm.visual.reducedEffects)perfState.adaptiveLevel='REDUCED';
        else if(adm.visual&&adm.visual.adaptiveQuality===false)perfState.adaptiveLevel='FULL';
        else if(lowFpsSec>=2)perfState.adaptiveLevel='REDUCED';
        else if(fps<50)perfState.adaptiveLevel='BALANCED';
        else perfState.adaptiveLevel='FULL';
        perfState.activeParticles=(Array.isArray(conf)?conf.length:0)+(EVP&&Array.isArray(EVP.p)?EVP.p.filter(x=>x.o).length:0);
        try{
          if(performance&&performance.memory&&performance.memory.usedJSHeapSize){
            perfState.memoryMB=+(performance.memory.usedJSHeapSize/(1024*1024)).toFixed(1);
          }
        }catch(_){}
      }

    applySupporterEffect(effectType,countryId,supporterName){
      if(adm.emergencyStop)return{ok:false,error:'Emergency stop is active.'};
      if(adm.activeMatchType!=='normal')return{ok:false,error:'Supporter advantages only apply in Normal Competitive battles.'};
      if(phase!==0||!F)return{ok:false,error:'No active battle in progress.'};
      const lim=adm.supporterLimits;
      if(!lim.enabled)return{ok:false,error:'Supporter gameplay effects are disabled.'};
      if(!APPS.has(+countryId)||!validCountry(C[+countryId]?.n))return{ok:false,error:'Invalid country.'};
      const now=Date.now();
      if(now-adm.roundSupporterEffects.lastAt<(lim.cooldownSec||6)*1000){
        return{ok:false,error:'Supporter effect cooldown active.'};
      }
      if(adm.roundSupporterEffects.total>=(lim.maxEffectsPerRound||4)){
        return{ok:false,error:'Round supporter effect limit reached.'};
      }
      const cCount=adm.roundSupporterEffects.byCountry[countryId]||0;
      if(cCount>=(lim.maxEffectsPerCountry||2)){
        return{ok:false,error:'Country supporter effect limit reached for this round.'};
      }
      const flag=F.find(x=>x.on&&x.c===+countryId);
      if(!flag)return{ok:false,error:'Country is not currently alive in the arena.'};
      if(effectType==='shield_boost'){
        const dur=Math.max(1,Math.min(6,+lim.maxShieldSec||4));
        flag.sh=Math.max(flag.sh||0,dur);
        banner={f:flag,t:0};
        chime();
      }else if(effectType==='speed_boost'){
        flag.supBoost=4;
        chime();
      }else if(effectType==='recovery_nudge'){
        const d=Math.hypot(flag.x,flag.y)||.01;
        flag.vx+=(flag.x/d)*.35;
        flag.vy+=(flag.y/d)*.35;
        chime();
      }else{
        return{ok:false,error:'Unknown supporter effect.'};
      }
      adm.roundSupporterEffects.total++;
      adm.roundSupporterEffects.byCountry[countryId]=cCount+1;
      adm.roundSupporterEffects.lastAt=now;
      adm.supporterCelebration={
        supporter:String(supporterName||'Supporter').slice(0,32),
        country:C[+countryId].n,
        effect:effectType.replace('_',' ').toUpperCase(),
        t:0,
        ttl:4.5
      };
      adm.broadcastState();
      return{ok:true};

    handleCommand(cmd){
      if(!cmd||typeof cmd!=='object')return{ok:false,error:'Invalid command'};
      const {action,payload={}}=cmd;
      try{
        switch(action){
          case 'battle.start':
            if(adm.emergencyStop)return{ok:false,error:'Clear Emergency Stop first.'};
            adm.paused=false;start(payload.override||null);break;
          case 'battle.pause':
            adm.paused=true;break;
          case 'battle.resume':
            if(adm.emergencyStop)return{ok:false,error:'Clear Emergency Stop first.'};
            adm.paused=false;break;
          case 'battle.restart':
            if(adm.emergencyStop)return{ok:false,error:'Clear Emergency Stop first.'};
            adm.paused=false;start();break;
          case 'battle.skip':
            if(adm.emergencyStop)return{ok:false,error:'Clear Emergency Stop first.'};
            adm.paused=false;start();break;
          case 'battle.set_edition':
            if(EDS[+payload.editionIdx]){adm.paused=false;setEdition(+payload.editionIdx);if(phase===4)fin()}break;
          case 'battle.set_auto':
            adm.autoBattle=!!payload.autoBattle;adm.saveConfig();break;
          case 'battle.set_duration':
            adm.gameplay.battleDuration=Math.max(20,Math.min(180,+payload.battleDuration||60));
            adm.gameplay.customDurationEnabled=!!payload.customDurationEnabled;
            adm.saveConfig();break;
          case 'battle.select_countries':
            if(Array.isArray(payload.countries)){
              const clean=payload.countries.map(Number).filter(i=>APPS.has(i)&&validCountry(C[i]?.n));
              start({countries:clean,editionIdx:Number.isInteger(+payload.editionIdx)?+payload.editionIdx:curEi,matchType:payload.matchType||'normal',showcaseWinner:payload.showcaseWinner});
            }break;
          case 'battle.set_queue':
            adm.battleQueue=sanitizeConfig({battleQueue:payload.queue}).battleQueue;adm.saveConfig();break;
          case 'battle.trigger_event':
            return adm.triggerSpecialEvent(payload.eventId);
          case 'country.update_config':

            syncAudioGains();
            if(adm.visual.announcerEnabled===false&&window.speechSynthesis){try{speechSynthesis.cancel()}catch(_){}}
            adm.saveConfig();break;
          case 'showdirector.update':
            adm.showDirector=sanitizeConfig({showDirector:{...adm.showDirector,...payload,enabledEvents:{...adm.showDirector.enabledEvents,...(payload.enabledEvents||{})}}}).showDirector;
            adm.saveConfig();break;
          case 'showdirector.trigger_special':
            return adm.triggerShowDirectorSpecial(payload.specialType);
          case 'showdirector.return_normal':
            EV.end();adm.introBanner=null;adm.featuredComment=null;adm.supporterCelebration=null;adm.audiencePoll.active=false;adm.activeSpecialTag='';
            adm.nextMatchType='normal';adm.nextShowcaseWinner=-1;adm.paused=false;adm.saveConfig();break;
          case 'diagnostics.clear':
            diagnostics.length=0;break;
          case 'recovery.reload_storage':
            if(!IS_PREVIEW&&typeof location!=='undefined'&&location.reload){setTimeout(()=>location.reload(),120);}
            break;
          case 'recovery.safe_reset':
            LS.set('fca_state','');adm.paused=false;adm.emergencyStop=false;EV.end();start();break;
          case 'config.undo':
          case 'config.rollback':
            if(payload.config){
              const cleanCfg=sanitizeConfig(payload.config);
              Object.assign(adm,cleanCfg);
              syncAudioGains();
              adm.saveConfig();
            }break;
          case 'emergency.stop':
            adm.emergencyStop=true;adm.paused=true;EV.end();adm.supporterCelebration=null;
            if(window.speechSynthesis){try{speechSynthesis.cancel()}catch(_){}}
            save();saveS();break;
          case 'emergency.resume':
            adm.emergencyStop=false;adm.paused=false;break;
          case 'preview.test':
            if(IS_PREVIEW){
              if(payload.type==='showcase')adm.previewState.showcaseBanner=!!payload.enabled;
              if(payload.type==='comment')adm.featuredComment={user:payload.user||'ViewerPreview',text:payload.text||'Go Pakistan! Live Preview Test',t:0,ttl:8};
              if(payload.type==='celebration')adm.supporterCelebration={supporter:payload.supporter||'VIP_Fan',country:payload.country||'Brazil',effect:'SHIELD BOOST',t:0,ttl:6};
              if(payload.type==='event'&&EVDEF[payload.eventId])EV.go(payload.eventId,{mag:1,hidden:0},F.filter(x=>x.on));
              if(payload.type==='announcement')ann={s:String(payload.text||'PREVIEW ANNOUNCEMENT').slice(0,40),t:0};
              if(payload.type==='intro')adm.introBanner={title:'RIVALRY SHOWDOWN',sub:'PREVIEW BATTLE INTRO',col:'#ffd23f',t:0,ttl:4};
              if(payload.type==='poll')adm.audiencePoll={active:true,question:'Next Match?',optionA:'Brazil',optionB:'Argentina',votesA:0,votesB:0};
              if(payload.type==='clear'){adm.previewState.showcaseBanner=false;adm.featuredComment=null;adm.supporterCelebration=null;adm.introBanner=null;adm.audiencePoll.active=false;ann=null}
            }break;
          case 'ping':

          default:
            return{ok:false,error:'Unhandled command'};

        return{ok:true};
      }catch(e){
        recordDiagnostic('admin_bridge',e.message||'Command failed',action);

        championLegacy.totalTitleChanges++;
      }
      championLegacy.championWins[winId]=(championLegacy.championWins[winId]||0)+1;
      if(championLegacy.reignDefenses>championLegacy.longestReign){
        championLegacy.longestReign=championLegacy.reignDefenses;
        championLegacy.longestReignC=winId;
      }
      championLegacy.history.unshift({round,champion:winId,name:C[winId].n,defenses:championLegacy.reignDefenses,edition:ED.n,at:new Date().toISOString()});
      championLegacy.history=championLegacy.history.slice(0,40);

      // Champion's Gauntlet progression
      if(championLegacy.gauntlet.active){
        if(winId===championLegacy.gauntlet.championId){
          championLegacy.gauntlet.defeated++;
          if(championLegacy.gauntlet.defeated>championLegacy.gauntlet.bestSurvival){
            championLegacy.gauntlet.bestSurvival=championLegacy.gauntlet.defeated;
            championLegacy.gauntlet.bestSurvivalC=winId;
          }
          if(championLegacy.gauntlet.defeated>=championLegacy.gauntlet.targetDefenses){
            recordHighlight('Gauntlet Complete',C[winId].n+' survived the full '+championLegacy.gauntlet.targetDefenses+'-match Champion Gauntlet!');
            championLegacy.gauntlet.active=false;
          }
        }else{
          recordHighlight('Gauntlet Ended',C[winId].n+' defeated Gauntlet Champion '+C[championLegacy.gauntlet.championId]?.n+' after '+championLegacy.gauntlet.defeated+' defenses!');
          championLegacy.gauntlet.active=false;
        }
      }
      writeJ(LEGACY_KEY,championLegacy);
    }

    // 3. Battle Personality Classification (genuine metrics only)
    let personality='Standard Clash';
    if(isUpset)personality='Giant Slayer Upset';
    else if(dur<=14)personality='Quick Destruction';
    else if(dur>=65)personality='War of Attrition';
    else if(ED.chaos||(LEGEND_ED.sigCount>=2))personality='Chaos Spectacle';
    else if(ED.n==='Rivalry'||ED.leg==='ronin')personality='Rivalry Showdown';
    else if(ED.storm||ED.leg==='expedition')personality='Survival Endurance';
    else if(championLegacy.reignDefenses>=3)personality='Unstoppable Streak';
    else if(showdownDone)personality='Nail-Biter Finish';
    adm.currentBattlePersonality=personality;

    // 4. Highlight Moment Detector
    if(isUpset)recordHighlight('Giant Slayer Upset',C[winId]?.n+' pulled off a genuine underdog victory!');
    else if(titleChanged&&prevDef>=2)recordHighlight('Champion Defeated',C[winId]?.n+' ended '+C[prevChamp]?.n+' ('+prevDef+' defenses)!');
    else if(championLegacy.reignDefenses>=3)recordHighlight('Streak Milestone',C[winId]?.n+' reached '+championLegacy.reignDefenses+' consecutive defenses!');
    else if(dur<=12)recordHighlight('Quick Destruction',C[winId]?.n+' won in '+dur+'s!');

    // 5. Battle Story Recap
    recaps.unshift({
      round,
      at:new Date().toISOString(),
      edition:ED.n,
      winner:APPS.has(winId)?C[winId].n:'',
      runnerUp:APPS.has(rec.runnerUp)?C[rec.runnerUp].n:'',
      durationSec:dur,
      personality,
      stakes:adm.currentStakes?adm.currentStakes.label:'',
      upset:isUpset,
      titleChanged
    });
    if(recaps.length>60)recaps.length=60;
    writeJ(RECAP_KEY,recaps);

    // 6. Finale closing banner
    if(adm.finaleState.active){
      adm.finaleState.completedBanner={winner:APPS.has(winId)?C[winId].n:'',format:adm.finaleState.format,t:0,ttl:9};
      recordHighlight('Grand Finale',C[winId]?.n+' won the '+adm.finaleState.format+'!');
      adm.finaleState.active=false;
    }
    adm.broadcastState();
  };

  // Wrap drawOverlays to add Live Show Status Bar, Battle Intensity rim aura, Rare Moment banner, Battle Personality badge, and Finale closing overlay
  const origDrawOverlays=adm.drawOverlays.bind(adm);
  adm.drawOverlays=(g)=>{
    const ov=(adm.visual&&adm.visual.overlays)||{};
    // Live Show Status Bar (compact, top-safe, zero obstruction to arena ring)
    if(ov.statusBar!==false&&phase===0&&!adm.emergencyStop){
      const champName=APPS.has(championLegacy.currentChampion)?C[championLegacy.currentChampion].n.toUpperCase().slice(0,11):'OPEN';
      const stTxt=adm.currentStakes?adm.currentStakes.type:(ED.rarity?ED.rarity.toUpperCase():'LIVE');
      const intCol=['#22d3ee','#22d3ee','#38bdf8','#f59e0b','#ff4d6d'][adm.intensityStage]||'#22d3ee';
      g.save();
      pill(12,674,360,20,5,'#070b1ae6',intCol+'99');
      T('CHAMP: '+champName+(championLegacy.reignDefenses>1?' x'+championLegacy.reignDefenses:'')+'  ·  '+stTxt+(adm.pendingEditionIdx>=0?'  ·  NEXT: '+EDS[adm.pendingEditionIdx].n.toUpperCase().slice(0,10):''),192,687,7.5,'#e2e8f0','center','bold system-ui,sans-serif');
      g.restore();
    }
    // Rare Moment Banner
    if(adm.activeRareMoment&&phase===0){
      const rm=adm.activeRareMoment;
      const alpha=Math.max(0,Math.min(1,rm.t*4,(rm.ttl-rm.t)*2));
      g.save();g.globalAlpha=alpha;
      pill(44,204,296,38,8,'#09051af2',rm.col);
      T('★ '+rm.rarity.toUpperCase()+' MOMENT: '+rm.name.toUpperCase(),192,220,9.5,rm.col,'center',AN);
      T(rm.sub+' ('+rm.source+')',192,234,7.5,'#f8fafc','center','bold system-ui,sans-serif');
      g.restore();
    }
    // Victory Screen Battle Personality Badge
    if(phase===1&&adm.currentBattlePersonality){
      g.save();
      pill(84,18,216,22,5,'#09152cee','#c084fc');
      T('BATTLE: '+adm.currentBattlePersonality.toUpperCase(),192,32,8.5,'#e9d5ff','center',AN);
      g.restore();
    }
    // Finale Closing Banner
    if(adm.finaleState.completedBanner){
      const fb=adm.finaleState.completedBanner;
      g.save();
      pill(34,536,316,38,8,'#1a1004f5','#ffd23f');
      T('★ GRAND FINALE COMPLETE · '+fb.format.toUpperCase(),192,552,9,'#ffd23f','center',AN);
      T('CHAMPION: '+fb.winner.toUpperCase()+' · THANKS FOR WATCHING!',192,566,8.5,'#fff','center','bold system-ui,sans-serif');
      g.restore();
    }
    origDrawOverlays(g);
  };

  // Wrap getSnapshot to include all new real state & monotonic stateSeq
  const origGetSnapshot=adm.getSnapshot.bind(adm);
  adm.getSnapshot=()=>{
    const base=origGetSnapshot();
    base.stateSeq=++adm.stateSeq;
    base.editions=EDS.map((e,i)=>({
      idx:i,
      name:e.n,
      tier:e.tier||(i===0?1:3),
      rarity:e.rarity||(i===0?'Classic':'Standard'),
      desc:e.desc||(i===0?'Original protected Flag Clash Arena experience.':e.n+' Edition'),
      isLegendary:!!e.leg
    }));
    base.pendingEditionIdx=adm.pendingEditionIdx;
    base.pendingEditionName=adm.pendingEditionIdx>=0&&EDS[adm.pendingEditionIdx]?EDS[adm.pendingEditionIdx].n:'';
    base.championLegacy=championLegacy;
    base.currentStakes=adm.currentStakes;
    base.currentBattlePersonality=adm.currentBattlePersonality;
    base.intensityStage=adm.intensityStage;
    base.activeRareMoment=adm.activeRareMoment?{id:adm.activeRareMoment.id,name:adm.activeRareMoment.name,rarity:adm.activeRareMoment.rarity,source:adm.activeRareMoment.source}:null;
    base.finaleActive=adm.finaleState.active;
    base.highlights=highlights.slice(0,30);
    base.recaps=recaps.slice(0,25);
    base.hallOfLegends=computeHallOfLegends();
    base.retentionIntel=computeRetentionIntelligence();
    return base;
  };

  // Wrap handleCommand to add deduplication, safe mid-battle edition queuing, and new commands
  const origHandleCommand=adm.handleCommand.bind(adm);
  adm.handleCommand=(cmd)=>{
    if(!cmd||typeof cmd!=='object')return{ok:false,error:'Invalid command'};
    if(cmd.reqId){
      if(processedReqIds.has(cmd.reqId)){
        return{ok:true,deduplicated:true,stateSeq:adm.stateSeq,activeEditionIdx:curEi,pendingEditionIdx:adm.pendingEditionIdx};
      }
      processedReqIds.add(cmd.reqId);
      if(processedReqIds.size>200){
        const first=processedReqIds.values().next().value;
        processedReqIds.delete(first);
      }
    }
    const {action,payload={}}=cmd;
    try{
      if(action==='battle.set_edition'){
        const idx=+payload.editionIdx;
        if(!EDS[idx])return{ok:false,error:'Invalid edition index.'};
        const safeQueue=payload.immediate===true?false:(payload.safeQueue!==undefined?!!payload.safeQueue:adm.showDirector.safeEditionQueue!==false);
        if(safeQueue&&phase===0&&!adm.paused&&idx!==curEi){
          adm.pendingEditionIdx=idx;
          adm.broadcastState();
          return{ok:true,queued:true,applied:false,activeEditionIdx:curEi,pendingEditionIdx:idx,stateSeq:adm.stateSeq};
        }
        adm.pendingEditionIdx=-1;
        adm.paused=false;
        setEdition(idx);
        if(phase===4)fin();
        adm.broadcastState();
        return{ok:true,queued:false,applied:true,activeEditionIdx:curEi,pendingEditionIdx:-1,stateSeq:adm.stateSeq};
      }
      if(action==='edition.queue'){
        const idx=+payload.editionIdx;
        if(!EDS[idx])return{ok:false,error:'Invalid edition index.'};
        adm.pendingEditionIdx=idx;
        adm.broadcastState();
        return{ok:true,queued:true,pendingEditionIdx:idx,activeEditionIdx:curEi,stateSeq:adm.stateSeq};
      }
      if(action==='edition.cancel_queue'){
        adm.pendingEditionIdx=-1;
        adm.broadcastState();
        return{ok:true,pendingEditionIdx:-1,activeEditionIdx:curEi,stateSeq:adm.stateSeq};
      }
      if(action==='edition.switch_classic'){
        adm.pendingEditionIdx=-1;
        adm.paused=false;
        setEdition(0);
        if(phase===4)fin();
        adm.broadcastState();
        return{ok:true,applied:true,activeEditionIdx:0,pendingEditionIdx:-1,stateSeq:adm.stateSeq};
      }
      if(action==='showdirector.apply_preset'){
        const p=SHOW_PRESETS[payload.preset];
        if(!p)return{ok:false,error:'Unknown show preset.'};
        adm.showDirector.preset=payload.preset;
        adm.showDirector.pacingMode=p.pacingMode;
        adm.showDirector.intensityDirectorEnabled=p.intensityDirectorEnabled;
        adm.showDirector.introEnabled=p.introEnabled;
        adm.showDirector.dramaticAlerts=p.dramaticAlerts;
        adm.showDirector.rareConfig.enabled=p.rareEnabled;
        adm.gameplay.eventFreqMul=p.eventFreqMul;
        adm.visual.reducedEffects=p.reducedEffects;
        applyPacingDurations();
        adm.saveConfig();
        adm.broadcastState();
        return{ok:true,applied:true,preset:payload.preset,stateSeq:adm.stateSeq};
      }
      if(action==='showdirector.set_pacing'){
        const valid=['quick','standard','high_stakes','finale'];
        if(!valid.includes(payload.pacingMode))return{ok:false,error:'Invalid pacing mode.'};
        adm.showDirector.pacingMode=payload.pacingMode;
        applyPacingDurations();
        adm.saveConfig();adm.broadcastState();
        return{ok:true,applied:true,stateSeq:adm.stateSeq};
      }
      if(action==='showdirector.set_intensity'){
        adm.showDirector.intensityDirectorEnabled=!!payload.enabled;
        adm.saveConfig();adm.broadcastState();
        return{ok:true,applied:true,stateSeq:adm.stateSeq};
      }
      if(action==='showdirector.update_rare_config'){
        adm.showDirector.rareConfig={
          ...adm.showDirector.rareConfig,
          enabled:payload.enabled!==undefined?!!payload.enabled:adm.showDirector.rareConfig.enabled,
          chance:payload.chance!==undefined?Math.max(0,Math.min(0.5,+payload.chance)):adm.showDirector.rareConfig.chance,
          cooldownRounds:payload.cooldownRounds!==undefined?Math.max(1,Math.min(20,Math.floor(+payload.cooldownRounds))):adm.showDirector.rareConfig.cooldownRounds
        };
        adm.saveConfig();adm.broadcastState();
        return{ok:true,applied:true,stateSeq:adm.stateSeq};
      }
      if(action==='showdirector.trigger_rare'){
        const res=triggerRareMoment(payload.rareId,'MANUAL');
        adm.broadcastState();
        return{...res,stateSeq:adm.stateSeq};
      }
      if(action==='showdirector.trigger_finale'){
        if(adm.emergencyStop)return{ok:false,error:'Clear Emergency Stop first.'};
        const fmt=String(payload.format||'Grand Championship Finale').slice(0,48);
        const edIdxFin=Number.isInteger(+payload.editionIdx)&&EDS[+payload.editionIdx]?+payload.editionIdx:36; // Legendary Infinity default
        adm.finaleState={active:true,format:fmt,completedBanner:null};
        adm.showDirector.pacingMode='finale';
        applyPacingDurations();
        adm.paused=false;
        start({editionIdx:edIdxFin,matchType:'normal',label:'FINALE: '+fmt,specialTag:'finale'});
        adm.broadcastState();
        return{ok:true,applied:true,activeEditionIdx:curEi,stateSeq:adm.stateSeq};
      }
      if(action==='gauntlet.start'){
        if(adm.emergencyStop)return{ok:false,error:'Clear Emergency Stop first.'};
        const champId=APPS.has(+payload.championId)?+payload.championId:(APPS.has(championLegacy.currentChampion)?championLegacy.currentChampion:getEligibleCountries()[0]);
        const target=Math.max(2,Math.min(10,Math.floor(+payload.targetDefenses||5)));
        championLegacy.gauntlet={...championLegacy.gauntlet,active:true,championId:champId,defeated:0,targetDefenses:target};
        writeJ(LEGACY_KEY,championLegacy);
        adm.paused=false;
        start({editionIdx:curEi,countries:[champId],matchType:'normal',label:"GAUNTLET: "+C[champId].n,specialTag:'champions_challenge'});
        adm.broadcastState();
        return{ok:true,applied:true,stateSeq:adm.stateSeq};
      }
      if(action==='gauntlet.stop'){
        championLegacy.gauntlet.active=false;
        writeJ(LEGACY_KEY,championLegacy);
        adm.broadcastState();
        return{ok:true,applied:true,stateSeq:adm.stateSeq};
      }
      if(action==='queue.smart_fill'){
        const count=Math.max(1,Math.min(6,Math.floor(+payload.count||3)));
        const recentSet=new Set(adm.recentEditionIds.slice(-4));
        const candEds=EDS.map((e,i)=>i).filter(i=>!recentSet.has(i));
        const pickPool=candEds.length?candEds:EDS.map((_,i)=>i);
        const items=[];
        for(let k=0;k<count;k++){
          const eId=pickPool[Math.floor(rnd()*pickPool.length)];
          items.push({id:'smart_'+Date.now()+'_'+k,editionIdx:eId,countries:[],matchType:'normal',showcaseWinner:-1,durationSec:0,label:'SMART: '+EDS[eId].n,tournamentId:'',specialTag:''});
        }
        adm.battleQueue=[...adm.battleQueue,...items].slice(0,50);
        adm.saveConfig();adm.broadcastState();
        return{ok:true,applied:true,added:items.length,stateSeq:adm.stateSeq};
      }
      if(action==='highlights.clear'){
        highlights.length=0;writeJ(HIGHLIGHT_KEY,highlights);
        adm.broadcastState();
        return{ok:true,applied:true,stateSeq:adm.stateSeq};
      }
      if(action==='sync.resync'){
        adm.broadcastState();
        return{ok:true,applied:true,stateSeq:adm.stateSeq,activeEditionIdx:curEi,pendingEditionIdx:adm.pendingEditionIdx};
      }
      const res=origHandleCommand(cmd);
      return{...res,stateSeq:adm.stateSeq,activeEditionIdx:curEi,pendingEditionIdx:adm.pendingEditionIdx};
    }catch(e){
      adm.recordDiagnostic('sync_ext',e.message||'Extension command failed',action);
      return{ok:false,error:e.message||'Extension command failed'};
    }
  };

  // Dual-transport sync: mirror telemetry & commands through localStorage storage events as fallback
  const origBroadcast=adm.broadcastState.bind(adm);
  let lastStoragePush=0;
  adm.broadcastState=()=>{
    origBroadcast();
    if(IS_PREVIEW)return;
    const now=Date.now();
    if(now-lastStoragePush>=300){
      lastStoragePush=now;
      try{localStorage.setItem(SYNC_STATE_KEY,JSON.stringify(adm.getSnapshot()))}catch(_){}
    }
  };

  if(!IS_PREVIEW){
    window.addEventListener('storage',ev=>{
      if(ev.key!==SYNC_CMD_KEY||!ev.newValue)return;
      try{
        const msg=JSON.parse(ev.newValue);
        if(!msg||msg.target!=='game')return;
        const res=adm.handleCommand(msg);
        try{localStorage.setItem(SYNC_ACK_KEY,JSON.stringify({reqId:msg.reqId,ts:Date.now(),res}))}catch(_){}
      }catch(_){}
    });
    // Push initial state immediately for fast Admin hydration
    adm.broadcastState();
  }
})();


// ===== FLAG CLASH ARENA v5.0 ROTATION ENGINE + v6.0 BATTLE INTELLIGENCE & ENTERTAINMENT =====
(function(){
  const adm=window.__FCA_ADM__;
  if(!adm)return;

  const ROT_KEY='fca_rotation_v5';
  const V6_CFG_KEY='fca_v6_config';
  const JOURNEY_KEY='fca_country_journey';
  const TIMELINE_KEY='fca_moment_timelines';
  const RIVAL_EXT_KEY='fca_rivalry_ext';

  const readJ=(k,fb)=>{try{const v=localStorage.getItem(k);return v?JSON.parse(v):fb}catch(_){return fb}};
  const writeJ=(k,v)=>{if(IS_PREVIEW)return;try{localStorage.setItem(k,JSON.stringify(v))}catch(_){}};

  // -------------------------------------------------------------------------
  // PART A: INDEPENDENT ROUND-BASED ROTATION ENGINE (Edition / Theme / Mode / Difficulty)
  // -------------------------------------------------------------------------
  const THEMES=[
    {id:'default',name:'Edition Native',tint:'',accent:''},
    {id:'midnight_neon',name:'Midnight Neon',tint:'rgba(14,165,233,0.09)',accent:'#38bdf8'},
    {id:'golden_gala',name:'Golden Gala',tint:'rgba(250,204,21,0.09)',accent:'#facc15'},
    {id:'arctic_ice',name:'Arctic Ice',tint:'rgba(186,230,253,0.09)',accent:'#bae6fd'},
    {id:'crimson_forge',name:'Crimson Forge',tint:'rgba(244,63,94,0.09)',accent:'#f43f5e'},
    {id:'emerald_pulse',name:'Emerald Pulse',tint:'rgba(16,185,129,0.09)',accent:'#10b981'},
    {id:'royal_velvet',name:'Royal Velvet',tint:'rgba(168,85,247,0.10)',accent:'#a855f7'},
    {id:'solar_dawn',name:'Solar Dawn',tint:'rgba(251,146,60,0.09)',accent:'#fb923c'}
  ];
  const MODES=['standard','quick','high_stakes'];
  const DIFFS=['casual','normal','intense'];
  const VALID_ROT_MODES=new Set(['every_battle','every_2','every_3','smart','timed','manual']);

  const defaultRot=()=>({
    edition:{mode:'every_battle',timedSec:300,battlesSince:0,lastSwitchAt:Date.now(),currentIdx:curEi||0,nextIdx:-1},
    theme:{mode:'manual',timedSec:300,battlesSince:0,lastSwitchAt:Date.now(),current:'default'},
    mode:{mode:'manual',timedSec:300,battlesSince:0,lastSwitchAt:Date.now(),current:'standard'},
    difficulty:{mode:'manual',timedSec:300,battlesSince:0,lastSwitchAt:Date.now(),current:'normal'},
    disabledEditions:[],
    recentEditions:[],
    recentThemes:[],
    recentModes:[],
    recentDiffs:[],
    manualOverrideEdition:-1,
    totalSwitches:0
  });

  let rot=Object.assign(defaultRot(),readJ(ROT_KEY,{}));
  for(const k of ['edition','theme','mode','difficulty']){
    rot[k]=Object.assign(defaultRot()[k],rot[k]||{});
    if(!VALID_ROT_MODES.has(rot[k].mode))rot[k].mode=k==='edition'?'every_battle':'manual';
    rot[k].timedSec=Math.max(30,Math.min(7200,Math.floor(+rot[k].timedSec||300)));
  }
  if(!Array.isArray(rot.disabledEditions))rot.disabledEditions=[];
  rot.disabledEditions=[...new Set(rot.disabledEditions.map(Number).filter(i=>Number.isInteger(i)&&i>=1&&i<EDS.length))];
  if(!Array.isArray(rot.recentEditions))rot.recentEditions=[];
  if(!Array.isArray(rot.recentThemes))rot.recentThemes=[];
  if(!Array.isArray(rot.recentModes))rot.recentModes=[];
  if(!Array.isArray(rot.recentDiffs))rot.recentDiffs=[];

  const saveRot=()=>writeJ(ROT_KEY,rot);

  function getEnabledEditionIndices(){
    const dis=new Set(rot.disabledEditions);
    const list=[];
    for(let i=0;i<EDS.length;i++)if(!dis.has(i))list.push(i);
    return list.length?list:[0];
  }

  function pickNonRepeating(pool,recent,current){
    const recSet=new Set(recent.slice(-Math.min(6,Math.max(1,pool.length-1))));
    let cands=pool.filter(x=>x!==current&&!recSet.has(x));
    if(!cands.length)cands=pool.filter(x=>x!==current);
    if(!cands.length)cands=pool;
    return cands[Math.floor(rnd()*cands.length)];
  }

  function shouldRotate(cfg){
    if(cfg.mode==='manual')return false;
    if(cfg.mode==='every_battle')return cfg.battlesSince>=1;
    if(cfg.mode==='every_2')return cfg.battlesSince>=2;
    if(cfg.mode==='every_3')return cfg.battlesSince>=3;
    if(cfg.mode==='smart')return cfg.battlesSince>=1;
    if(cfg.mode==='timed')return (Date.now()-(cfg.lastSwitchAt||0))>=Math.max(30,cfg.timedSec||300)*1000;
    return false;
  }

  let rotEvaluatedRound=-1;
  const ROT_API={
    THEMES,MODES,DIFFS,
    getConfig(){return rot;},
    getDisabledEditions(){return rot.disabledEditions.slice();},
    isEditionDisabled(idx){return rot.disabledEditions.includes(idx);},
    resolveEditionIdx(){
      if(adm.pendingEditionIdx>=0&&EDS[adm.pendingEditionIdx])return adm.pendingEditionIdx;
      if(rot.edition.mode==='manual'){
        if(rot.manualOverrideEdition>=0&&EDS[rot.manualOverrideEdition])return rot.manualOverrideEdition;
        return edForce>=0&&EDS[edForce]?edForce:(rot.edition.currentIdx>=0&&EDS[rot.edition.currentIdx]?rot.edition.currentIdx:0);
      }
      if(rot.edition.currentIdx>=0&&EDS[rot.edition.currentIdx]&&!rot.disabledEditions.includes(rot.edition.currentIdx)){
        return rot.edition.currentIdx;
      }
      return getEnabledEditionIndices()[0];
    },
    onManualEdition(idx){
      rot.manualOverrideEdition=idx;
      rot.edition.currentIdx=idx;
      rot.edition.battlesSince=0;
      rot.edition.lastSwitchAt=Date.now();
      saveRot();
    },
    onBattleCompleted(){
      // Strict single-evaluation guard per round to prevent duplicate triggers or rapid loops
      if(IS_PREVIEW||rotEvaluatedRound===round)return;
      rotEvaluatedRound=round;
      const now=Date.now();

      // 1. Edition rotation (only if no explicit queued edition is already pending)
      rot.edition.battlesSince=(rot.edition.battlesSince||0)+1;
      if(adm.pendingEditionIdx<0&&shouldRotate(rot.edition)){
        const enabled=getEnabledEditionIndices();
        const nextE=pickNonRepeating(enabled,rot.recentEditions,curEi);
        rot.edition.currentIdx=nextE;
        rot.edition.nextIdx=nextE;
        rot.edition.battlesSince=0;
        rot.edition.lastSwitchAt=now;
        edForce=nextE;
        rot.recentEditions.push(nextE);
        if(rot.recentEditions.length>24)rot.recentEditions.shift();
        rot.totalSwitches++;
      }

      // 2. Theme overlay rotation
      rot.theme.battlesSince=(rot.theme.battlesSince||0)+1;
      if(shouldRotate(rot.theme)){
        const tIds=THEMES.map(x=>x.id);
        const nextT=pickNonRepeating(tIds,rot.recentThemes,rot.theme.current);
        rot.theme.current=nextT;
        rot.theme.battlesSince=0;
        rot.theme.lastSwitchAt=now;
        rot.recentThemes.push(nextT);
        if(rot.recentThemes.length>12)rot.recentThemes.shift();
      }

      // 3. Pacing Mode rotation
      rot.mode.battlesSince=(rot.mode.battlesSince||0)+1;
      if(shouldRotate(rot.mode)&&!adm.finaleState?.active){
        const nextM=pickNonRepeating(MODES,rot.recentModes,rot.mode.current);
        rot.mode.current=nextM;
        rot.mode.battlesSince=0;
        rot.mode.lastSwitchAt=now;
        adm.showDirector.pacingMode=nextM;
        rot.recentModes.push(nextM);
        if(rot.recentModes.length>12)rot.recentModes.shift();
      }

      // 4. Difficulty rotation (Classic physics lock still respected automatically in getBal())
      rot.difficulty.battlesSince=(rot.difficulty.battlesSince||0)+1;
      if(shouldRotate(rot.difficulty)){
        const nextD=pickNonRepeating(DIFFS,rot.recentDiffs,rot.difficulty.current);
        rot.difficulty.current=nextD;
        rot.difficulty.battlesSince=0;
        rot.difficulty.lastSwitchAt=now;
        if(adm.gameplay)adm.gameplay.difficulty=nextD;
        rot.recentDiffs.push(nextD);
        if(rot.recentDiffs.length>12)rot.recentDiffs.shift();
      }
      saveRot();
    },
    drawThemeAtmosphere(g){
      if(!rot.theme||rot.theme.current==='default')return;
      const th=THEMES.find(x=>x.id===rot.theme.current);
      if(!th||!th.tint)return;
      g.save();g.fillStyle=th.tint;g.fillRect(0,0,SW,SH);g.restore();
    },
    updateConfig(payload){
      for(const k of ['edition','theme','mode','difficulty']){
        if(payload[k]&&typeof payload[k]==='object'){
          if(payload[k].mode&&VALID_ROT_MODES.has(payload[k].mode)){
            rot[k].mode=payload[k].mode;
            rot[k].battlesSince=0;
            rot[k].lastSwitchAt=Date.now();
          }
          if(payload[k].timedSec!==undefined){
            rot[k].timedSec=Math.max(30,Math.min(7200,Math.floor(+payload[k].timedSec||300)));
          }
          if(k==='theme'&&typeof payload[k].current==='string'&&THEMES.some(x=>x.id===payload[k].current)){
            rot.theme.current=payload[k].current;
          }
          if(k==='mode'&&MODES.includes(payload[k].current)){
            rot.mode.current=payload[k].current;
            adm.showDirector.pacingMode=payload[k].current;
          }
          if(k==='difficulty'&&DIFFS.includes(payload[k].current)){
            rot.difficulty.current=payload[k].current;
            if(adm.gameplay)adm.gameplay.difficulty=payload[k].current;
          }
        }
      }
      if(Array.isArray(payload.disabledEditions)){
        rot.disabledEditions=[...new Set(payload.disabledEditions.map(Number).filter(i=>Number.isInteger(i)&&i>=1&&i<EDS.length))];
      }
      saveRot();
      return {ok:true,rotation:rot};
    },
    toggleEditionEnabled(idx,enabled){
      if(!Number.isInteger(idx)||idx<=0||idx>=EDS.length)return{ok:false,error:'Classic Edition cannot be disabled; index out of range.'};
      const set=new Set(rot.disabledEditions);
      if(enabled)set.delete(idx);else set.add(idx);
      rot.disabledEditions=[...set];
      saveRot();
      return {ok:true,disabledEditions:rot.disabledEditions};
    },
    getSummary(){
      const fmtNext=(cfg)=>{
        if(cfg.mode==='manual')return 'Manual';
        if(cfg.mode==='every_battle'||cfg.mode==='smart')return 'Next battle';
        if(cfg.mode==='every_2')return 'In '+Math.max(1,2-(cfg.battlesSince||0))+' battle(s)';
        if(cfg.mode==='every_3')return 'In '+Math.max(1,3-(cfg.battlesSince||0))+' battle(s)';
        if(cfg.mode==='timed'){
          const rem=Math.max(0,Math.ceil((cfg.timedSec*1000-(Date.now()-(cfg.lastSwitchAt||0)))/1000));
          return rem<=0?'Next battle boundary':('In '+rem+'s (at battle end)');
        }
        return cfg.mode;
      };
      return {
        edition:{...rot.edition,nextLabel:fmtNext(rot.edition),currentName:EDS[curEi]?.n||'Classic'},
        theme:{...rot.theme,nextLabel:fmtNext(rot.theme),currentName:(THEMES.find(x=>x.id===rot.theme.current)||THEMES[0]).name},
        mode:{...rot.mode,nextLabel:fmtNext(rot.mode),current:adm.showDirector.pacingMode||rot.mode.current},
        difficulty:{...rot.difficulty,nextLabel:fmtNext(rot.difficulty),current:(adm.gameplay&&adm.gameplay.difficulty)||rot.difficulty.current},
        disabledEditions:rot.disabledEditions.slice(),
        totalSwitches:rot.totalSwitches
      };
    }
  };
  window.__FCA_ROT__=ROT_API;

  // -------------------------------------------------------------------------
  // PART B: v6.0 BATTLE INTELLIGENCE & ENTERTAINMENT ENGINE (15 SYSTEMS)
  // -------------------------------------------------------------------------
  const PROFILES={
    auto:{label:'Auto (Dynamic)',col:'#38bdf8',sub:'ADAPTIVE BROADCAST'},
    energetic:{label:'Fast & Energetic',col:'#facc15',sub:'HIGH-TEMPO SHOWCASE'},
    dramatic:{label:'Dramatic',col:'#f43f5e',sub:'HIGH-TENSION CLASH'},
    tactical:{label:'Tactical Presentation',col:'#22d3ee',sub:'STRATEGIC ANALYSIS'},
    rivalry_focus:{label:'Rivalry-Focused',col:'#fb7185',sub:'HEAD-TO-HEAD GRUDGE'},
    championship_focus:{label:'Championship-Focused',col:'#ffd23f',sub:'TITLE PRESTIGE'},
    minimal:{label:'Minimal Presentation',col:'#94a3b8',sub:'CLEAN PURE ARENA'},
    cinematic:{label:'Cinematic',col:'#c084fc',sub:'WIDESCREEN SPECTACLE'},
    celebration:{label:'Celebration-Focused',col:'#4ade80',sub:'FESTIVAL SHOWTIME'}
  };

  const defaultV6=()=>({
    suddenDeath:{enabled:true,triggerSec:75,minAlive:3},
    rivalry:{enabled:true,minMatches:2,cooldownRounds:3},
    eventDirector:{enabled:true,cooldownRounds:3},

    replayMoments:{enabled:true,maxStored:25}
  });

  let v6Cfg=Object.assign(defaultV6(),readJ(V6_CFG_KEY,{}));
  for(const k of ['suddenDeath','rivalry','eventDirector','upsetDetector','comeback','entranceEvolution','hud','replayMoments']){
    v6Cfg[k]=Object.assign(defaultV6()[k],v6Cfg[k]||{});
  }
  const saveV6Cfg=()=>writeJ(V6_CFG_KEY,v6Cfg);

  // Country Journey (genuine persisted progression — strictly cosmetic)
  let journey=readJ(JOURNEY_KEY,{});
  if(!journey||typeof journey!=='object'||Array.isArray(journey))journey={};
  const saveJourney=()=>writeJ(JOURNEY_KEY,journey);

  // Moment Timelines (bounded structured event-timeline capture — NOT video)
  let timelines=readJ(TIMELINE_KEY,[]);
  if(!Array.isArray(timelines))timelines=[];
  const saveTimelines=()=>writeJ(TIMELINE_KEY,timelines.slice(0,v6Cfg.replayMoments.maxStored||25));

  // Extended Rivalry Metadata (revenge counts, streaks, cooldown)
  let rivalExt=readJ(RIVAL_EXT_KEY,{revengeWins:0,lastCalloutRound:-99,recentRevenge:null,topRivalry:null});
  const saveRivalExt=()=>writeJ(RIVAL_EXT_KEY,rivalExt);

  // Runtime per-battle state (always cleaned up on round start / reset)
  let rt={
    suddenActive:false,
    suddenTriggeredAt:0,
    suddenBannerT:0,
    activeRivalry:null,
    activeDirectorEvent:null,
    entranceTier:'Standard',
    activeProfile:'auto',
    upsetBanner:null,
    comebackBanner:null,
    recordBanner:null,
    dangerEscapes:{}, // countryId -> {inDanger:bool, count:int}
    currentTimeline:[],
