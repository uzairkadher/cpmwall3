<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>CPM Community Wall</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #080a12;
  --card: #151825;
  --border: #24273f;
  --accent: #00f0ff;
  --bot: #ff3b9a;
  --text: #e8eaf6;
  --muted: #8b8fa3;
}
* { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Inter', sans-serif; }
body {
  background: radial-gradient(600px at top, #1a1f3d, var(--bg));
  color: var(--text);
  display: flex;
  justify-content: center;
  min-height: 100vh;
  padding: 12px;
}
.container { width: 100%; max-width: 580px; display: flex; flex-direction: column; gap: 12px; }
.header {
  background: linear-gradient(135deg, #1e2240, #151830);
  border: 1px solid var(--border);
  border-radius: 16px;
  padding: 12px 16px;
  display: flex;
  align-items: center;
  justify-content: space-between;
}
.header h1 { font-size: 0.95rem; font-weight: 700; }
.status-sub { display: flex; align-items: center; gap: 6px; font-size: 0.75rem; color: var(--accent); margin-top: 2px; }
.dot { width: 8px; height: 8px; background: #22c55e; border-radius: 50%; display: inline-block; box-shadow: 0 0 8px #22c55e; }
.dot.offline { background: #ef4444; box-shadow: 0 0 8px #ef4444; }
.sound-btn {
  background: transparent;
  border: 1px solid var(--border);
  color: var(--muted);
  border-radius: 20px;
  padding: 4px 10px;
  font-size: 11px;
  cursor: pointer;
}
.sound-btn.active { border-color: var(--accent); color: var(--accent); }
.pinned {
  background: linear-gradient(90deg, rgba(0, 240, 255, 0.1), rgba(255, 59, 154, 0.1));
  border: 1px solid rgba(0, 240, 255, 0.25);
  border-radius: 12px;
  padding: 10px 14px;
  font-size: 0.82rem;
  color: #ff8ac6;
  display: none;
}
.pinned b { color: #fff; margin-right: 4px; }
.social { display: flex; gap: 8px; flex-wrap: wrap; }
.sbtn {
  flex: 1 1 calc(25% - 8px);
  min-width: 100px;
  padding: 8px;
  border-radius: 10px;
  text-align: center;
  text-decoration: none;
  color: #fff;
  font-size: 0.75rem;
  font-weight: 600;
  border: none;
  cursor: pointer;
}
.feed {
  display: flex;
  flex-direction: column;
  gap: 10px;
  height: 52vh;
  overflow-y: auto;
  padding: 6px 4px;
}
.bubble {
  max-width: 85%;
  padding: 10px 14px;
  border-radius: 18px 18px 18px 4px;
  background: var(--card);
  border: 1px solid var(--border);
  align-self: flex-start;
}
.bubble.me {
  align-self: flex-end;
  border-radius: 18px 18px 4px 18px;
  background: linear-gradient(135deg, #1e2a5a, #1a254f);
  border-color: var(--accent);
}
.bubble.bot {
  border-color: var(--bot);
  box-shadow: 0 0 12px rgba(255, 59, 154, 0.2);
  background: #1e1628;
}
.author-line { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-bottom: 3px; }
.author { font-weight: 700; font-size: 0.78rem; display: flex; gap: 5px; align-items: center; color: var(--accent); cursor: pointer; }
.bubble.bot .author { color: var(--bot); }
.bubble.me .author { color: #fff; }
.meta { font-size: 10px; color: var(--muted); }
.verified-badge {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  width: 13px;
  height: 13px;
  background: #1d9bf0;
  color: #fff;
  font-size: 8px;
  font-weight: bold;
  border-radius: 50%;
}
.bot-badge {
  background: var(--bot);
  color: #fff;
  font-size: 9px;
  padding: 1px 5px;
  border-radius: 4px;
  font-weight: 600;
}
.body { font-size: 0.88rem; line-height: 1.4; word-break: break-word; color: #f1f5f9; }
.room-code {
  background: rgba(0, 240, 255, 0.15);
  color: var(--accent);
  border: 1px solid rgba(0, 240, 255, 0.3);
  padding: 1px 6px;
  border-radius: 5px;
  font-weight: 600;
  cursor: pointer;
  display: inline-block;
  margin: 0 2px;
}
.room-code:hover { background: var(--accent); color: #000; }
.chips-bar { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 2px; }
.chip {
  background: #111424;
  border: 1px solid var(--border);
  color: var(--muted);
  font-size: 11px;
  padding: 3px 8px;
  border-radius: 6px;
  cursor: pointer;
}
.chip:hover { border-color: var(--accent); color: var(--accent); }
.typing-box { font-size: 0.75rem; color: var(--bot); min-height: 16px; padding-left: 4px; }
.input-panel {
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: 16px;
  padding: 10px 12px;
  display: flex;
  flex-direction: column;
  gap: 8px;
}
.input-row { display: flex; gap: 8px; }
.input-panel input {
  background: #0d101d;
  border: 1px solid var(--border);
  color: #fff;
  padding: 8px 12px;
  border-radius: 8px;
  outline: none;
  font-size: 0.85rem;
}
.input-panel input:focus { border-color: var(--accent); }
#userName { width: 110px; }
#msgInput { flex: 1; }
.input-bottom { display: flex; justify-content: space-between; align-items: center; }
.char-num { font-size: 11px; color: var(--muted); }
.send-btn {
  background: linear-gradient(135deg, var(--accent), var(--bot));
  border: none;
  color: #05070e;
  font-weight: 700;
  padding: 8px 18px;
  border-radius: 8px;
  cursor: pointer;
  font-size: 0.85rem;
}
.send-btn:disabled { opacity: 0.5; cursor: not-allowed; }
</style>
</head>
<body>
<div class="container">
  <div class="header">
    <div>
      <h1>Car Parking Multiplayer</h1>
      <div class="status-sub">
        <span id="liveDot" class="dot"></span>
        <span id="statusLabel">Lobby Chat</span>
      </div>
    </div>
    <button id="soundToggle" type="button" class="sound-btn" onclick="toggleSound()">🔇 Sound</button>
  </div>

  <div id="pinnedBox" class="pinned"></div>

  <div class="social">
    <button type="button" class="sbtn" style="background:#1d9bf0;" onclick="shareSite()">🔗 Share</button>
    <a class="sbtn" style="background:linear-gradient(45deg,#f09433,#dc2743)" href="https://www.instagram.com/4t_jagga" target="_blank" rel="noopener noreferrer">IG Profile</a>
    <a class="sbtn" style="background:#e1306c" href="https://www.instagram.com/channel/FMW8_rf52qWxlGoC/" target="_blank" rel="noopener noreferrer">IG Channel</a>
    <a class="sbtn" style="background:#25d366" href="https://wa.me/923558182875?text=I%27m%20from%20cpm%20wall" target="_blank" rel="noopener noreferrer">WhatsApp</a>
  </div>

  <div id="feed" class="feed">Connecting to wall...</div>
  <div id="typing" class="typing-box"></div>

  <div class="input-panel">
    <div class="chips-bar">
      <span class="chip" onclick="tagBot()">+ Tag @Apex_Racer</span>
      <span class="chip" onclick="addTag('#Gearbox')">#Gearbox</span>
      <span class="chip" onclick="addTag('#Drag')">#Drag</span>
      <span class="chip" onclick="addTag('#RoomCode')">#RoomCode</span>
      <span class="chip" onclick="addTag('#Trade')">#Trade</span>
    </div>
    <div class="input-row">
      <input id="userName" placeholder="Driver Tag" maxlength="20">
      <input id="msgInput" placeholder="Type message, room code, or ID..." maxlength="150" autocomplete="off">
    </div>
    <div class="input-bottom">
      <span id="charCount" class="char-num">0/150</span>
      <button id="sendBtn" class="send-btn" onclick="sendPost()">Post to Wall</button>
    </div>
  </div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
import { getFirestore, collection, onSnapshot, query, orderBy, limit, doc } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

const _k1 = "AIza";
const _k2 = "SyAOE8v7ANE6vvlHh2ZbiaJ6iHBN4voFcYM";
const EXPECTED_PROJECT = "cpm-wall-3";

const firebaseConfig = {
  apiKey: _k1 + _k2,
  authDomain: `${EXPECTED_PROJECT}.firebaseapp.com`,
  projectId: EXPECTED_PROJECT
};
const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

const feedEl = document.getElementById('feed');
const typingEl = document.getElementById('typing');
const pinnedBox = document.getElementById('pinnedBox');
const userNameInput = document.getElementById('userName');
const msgInput = document.getElementById('msgInput');
const sendBtn = document.getElementById('sendBtn');
const charCount = document.getElementById('charCount');

userNameInput.value = localStorage.getItem('cpm_name') || '';

let soundEnabled = localStorage.getItem('cpm_sound') === 'true';
let audioCtx = null;
let isInitialLoad = true;
let lastPostedMsg = '';
let lastPostTimestamp = 0;

function initAudio() {
  if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  if (audioCtx.state === 'suspended') audioCtx.resume();
}

function playPing() {
  if (!soundEnabled) return;
  try {
    initAudio();
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.type = 'sine';
    osc.frequency.setValueAtTime(880, audioCtx.currentTime);
    osc.frequency.exponentialRampToValueAtTime(1200, audioCtx.currentTime + 0.15);
    gain.gain.setValueAtTime(0.5, audioCtx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.2);
    osc.connect(gain);
    gain.connect(audioCtx.destination);
    osc.start();
    osc.stop(audioCtx.currentTime + 0.2);
    if (navigator.vibrate) navigator.vibrate(80);
  } catch {}
}

document.addEventListener('click', () => { initAudio(); }, { once: true });
document.addEventListener('touchstart', () => { initAudio(); }, { once: true });

function updateSoundBtn() {
  const btn = document.getElementById('soundToggle');
  if (soundEnabled) {
    btn.className = 'sound-btn active';
    btn.textContent = '🔊 Sound';
  } else {
    btn.className = 'sound-btn';
    btn.textContent = '🔇 Sound';
  }
}
window.toggleSound = () => {
  soundEnabled = !soundEnabled;
  localStorage.setItem('cpm_sound', soundEnabled);
  updateSoundBtn();
  if (soundEnabled) initAudio();
};
updateSoundBtn();

function updateConnection() {
  const dot = document.getElementById('liveDot');
  const label = document.getElementById('statusLabel');
  if (navigator.onLine) {
    dot.className = 'dot';
    label.textContent = 'Lobby Chat';
    label.style.color = 'var(--accent)';
  } else {
    dot.className = 'dot offline';
    label.textContent = 'Offline';
    label.style.color = '#ef4444';
  }
}
window.addEventListener('online', updateConnection);
window.addEventListener('offline', updateConnection);

function timeAgo(date) {
  const seconds = Math.floor((new Date() - date) / 1000);
  if (seconds < 45) return 'Just now';
  if (seconds < 3600) return `${Math.floor(seconds / 60)}m ago`;
  if (seconds < 86400) return `${Math.floor(seconds / 3600)}h ago`;
  return date.toLocaleDateString();
}

function renderMessageText(container, text) {
  container.innerHTML = '';
  const idRegex = /\b(\d{6,8}|[a-zA-Z]{2}\d{6}|[a-zA-Z]{3}\d{4})\b/g;
  const testRegex = /^(\d{6,8}|[a-zA-Z]{2}\d{6}|[a-zA-Z]{3}\d{4})$/;
  const parts = text.split(idRegex);

  parts.forEach((part) => {
    if (testRegex.test(part)) {
      const chip = document.createElement('span');
      chip.className = 'room-code';
      chip.textContent = `${part} 📋`;
      chip.title = 'Click to copy ID';
      chip.onclick = (e) => {
        e.stopPropagation();
        navigator.clipboard.writeText(part);
        const prev = chip.textContent;
        chip.textContent = 'Copied!';
        setTimeout(() => { chip.textContent = prev; }, 1200);
      };
      container.appendChild(chip);
    } else if (part) {
      container.appendChild(document.createTextNode(part));
    }
  });
}

function buildBubble(id, data, isTemporary) {
  const currentName = (userNameInput.value || '').trim();
  const isBot = Boolean(data.isBot || data.name === 'Apex_Racer');
  const isMe = Boolean(currentName && data.name === currentName);

  const bubble = document.createElement('div');
  bubble.className = `bubble ${isBot ? 'bot' : isMe ? 'me' : ''}`;
  if (id) bubble.id = `post-${id}`;
  if (isTemporary) bubble.setAttribute('data-pending', `${data.name}-${data.message}`);

  const authorLine = document.createElement('div');
  authorLine.className = 'author-line';

  const author = document.createElement('div');
  author.className = 'author';
  author.textContent = data.name;
  author.onclick = () => {
    const tag = `@${data.name} `;
    if (!msgInput.value.includes(tag)) msgInput.value = tag + msgInput.value;
    charCount.textContent = `${msgInput.value.length}/150`;
    msgInput.focus();
  };

  if (data.isVerified) {
    const tick = document.createElement('span');
    tick.className = 'verified-badge';
    tick.textContent = '✓';
    author.appendChild(tick);
  }
  if (isBot) {
    const botTag = document.createElement('span');
    botTag.className = 'bot-badge';
    botTag.textContent = 'BOT';
    author.appendChild(botTag);
  }
  authorLine.appendChild(author);

  const meta = document.createElement('div');
  meta.className = 'meta';
  let rawDate = new Date();
  try {
    const ts = data.createdAt;
    const sec = ts ? (ts._seconds || ts.seconds) : null;
    rawDate = sec ? new Date(sec * 1000) : (ts?.toDate ? ts.toDate() : new Date());
  } catch {}
  meta.textContent = isTemporary ? 'Just now' : timeAgo(rawDate);
  authorLine.appendChild(meta);

  const bodyEl = document.createElement('div');
  bodyEl.className = 'body';
  renderMessageText(bodyEl, data.message || '');

  bubble.appendChild(authorLine);
  bubble.appendChild(bodyEl);
  return bubble;
}

onSnapshot(doc(db, "pinned", "current"), (snap) => {
  if (snap.exists()) {
    const d = snap.data();
    if (d.active && d.text) {
      pinnedBox.innerHTML = `📌 <b>${d.name || 'Admin'}:</b> ${d.text}`;
      pinnedBox.style.display = 'block';
      return;
    }
  }
  pinnedBox.style.display = 'none';
});

const q = query(collection(db, "posts"), orderBy("createdAt", "desc"), limit(500));
onSnapshot(q, (snap) => {
  if (snap.empty) {
    feedEl.innerHTML = '<p style="text-align:center;color:var(--muted);font-size:0.85rem;margin-top:20px;">No messages yet. Be first!</p>';
    isInitialLoad = false;
    return;
  }

  const placeholder = feedEl.querySelector('p');
  if (placeholder) placeholder.remove();

  if (isInitialLoad) {
    feedEl.innerHTML = '';
    snap.docs.forEach((docSnap) => {
      feedEl.appendChild(buildBubble(docSnap.id, docSnap.data(), false));
    });
    isInitialLoad = false;
    return;
  }

  snap.docChanges().forEach((change) => {
    if (change.type === 'added') {
      const id = change.doc.id;
      const data = change.doc.data();

      const existing = document.getElementById(`post-${id}`);
      if (existing) return;

      const optimistic = document.querySelector(`[data-pending="${data.name}-${data.message}"]`);
      if (optimistic) {
        optimistic.id = `post-${id}`;
        optimistic.removeAttribute('data-pending');
        return;
      }

      feedEl.prepend(buildBubble(id, data, false));
      playPing();
    }
    if (change.type === 'removed') {
      const el = document.getElementById(`post-${change.doc.id}`);
      if (el) el.remove();
    }
  });

  while (feedEl.children.length > 500) {
    feedEl.removeChild(feedEl.lastChild);
  }
}, (err) => {
  console.error("Firestore error:", err);
  feedEl.innerHTML = `<p style="text-align:center;color:#ef4444;font-size:0.85rem;margin-top:20px;">Connection failed: ${err.message}</p>`;
});

msgInput.addEventListener('input', (e) => {
  charCount.textContent = `${e.target.value.length}/150`;
});

window.addTag = (tag) => {
  if (!msgInput.value.includes(tag)) {
    msgInput.value = (msgInput.value.trim() ? msgInput.value.trim() + ' ' : '') + tag + ' ';
  }
  charCount.textContent = `${msgInput.value.length}/150`;
  msgInput.focus();
};

window.tagBot = () => {
  if (!msgInput.value.includes('@Apex_Racer')) {
    msgInput.value = '@Apex_Racer ' + msgInput.value;
  }
  charCount.textContent = `${msgInput.value.length}/150`;
  msgInput.focus();
};

function startCooldown(seconds) {
  sendBtn.disabled = true;
  let remain = seconds;
  sendBtn.textContent = `Wait ${remain}s`;
  const t = setInterval(() => {
    remain--;
    if (remain <= 0) {
      clearInterval(t);
      sendBtn.disabled = false;
      sendBtn.textContent = 'Post to Wall';
    } else {
      sendBtn.textContent = `Wait ${remain}s`;
    }
  }, 1000);
}

window.sendPost = async () => {
  const name = userNameInput.value.trim();
  const message = msgInput.value.trim();

  if (name.length < 2 || !message) {
    alert("Please enter a valid name (2+ chars) and message.");
    return;
  }
  if (message === lastPostedMsg && Date.now() - lastPostTimestamp < 60000) {
    alert("Duplicate message. Please wait before resending.");
    return;
  }

  localStorage.setItem('cpm_name', name);

  const optimisticEl = buildBubble(null, { name, message, createdAt: new Date() }, true);
  const placeholder = feedEl.querySelector('p');
  if (placeholder) placeholder.remove();
  feedEl.prepend(optimisticEl);
  playPing();

  sendBtn.disabled = true;
  sendBtn.textContent = "Posting...";

  try {
    const res = await fetch('/api/post', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ name, message })
    });
    const data = await res.json().catch(() => ({}));

    if (res.ok) {
      if (data.projectId && data.projectId !== EXPECTED_PROJECT && data.projectId !== "unknown") {
        alert(`CRITICAL PROJECT MISMATCH:\nBackend is saving to "${data.projectId}", but frontend is watching "${EXPECTED_PROJECT}".\nUpdate FIREBASE_SERVICE_KEY in Vercel to match "${EXPECTED_PROJECT}"!`);
      }

      lastPostedMsg = message;
      lastPostTimestamp = Date.now();
      msgInput.value = '';
      charCount.textContent = '0/150';
      startCooldown(10);

      if (message.toLowerCase().includes('@apex')) {
        typingEl.textContent = 'Apex_Racer is typing...';
        setTimeout(() => { typingEl.textContent = ''; }, 3500);
      }
    } else {
      optimisticEl.remove();
      alert(data.error || "Failed to post");
      sendBtn.disabled = false;
      sendBtn.textContent = "Post to Wall";
    }
  } catch {
    optimisticEl.remove();
    alert("Network error");
    sendBtn.disabled = false;
    sendBtn.textContent = "Post to Wall";
  }
};

msgInput.addEventListener('keydown', (e) => {
  if (e.key === 'Enter') sendPost();
});

window.shareSite = async () => {
  const shareData = {
    title: 'CPM Community Wall',
    text: 'Join the live anonymous chat wall for Car Parking Multiplayer players!',
    url: window.location.href
  };
  if (navigator.share) {
    try { await navigator.share(shareData); } catch {}
  } else {
    try {
      await navigator.clipboard.writeText(window.location.href);
      alert('Link copied to clipboard!');
    } catch {
      prompt('Copy link:', window.location.href);
    }
  }
};
</script>
</body>
</html>
