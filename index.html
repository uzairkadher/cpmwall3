<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CPM Wall - Live</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<style>
:root{--bg:#08080a;--card:#131316;--border:#232328;--accent:#3b82f6;--text:#f1f1f1;--muted:#8a8a93}
*{box-sizing:border-box} body{margin:0;background:var(--bg);color:var(--text);font-family:Inter,system-ui,sans-serif}
.container{max-width:680px;margin:0 auto;padding:12px}
.header{display:flex;justify-content:space-between;align-items:center;padding:10px 0;border-bottom:1px solid var(--border);margin-bottom:12px}
.dot{width:10px;height:10px;border-radius:50%;background:#22c55e;box-shadow:0 0 8px #22c55e;display:inline-block;animation:pulse 2s infinite}
@keyframes pulse{0%{opacity:1}50%{opacity:.5}100%{opacity:1}}
.pinned{background:linear-gradient(90deg,#1e3a8a,#172554);border:1px solid var(--accent);border-radius:10px;padding:10px 14px;margin-bottom:12px;display:none}
.card{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:14px;margin-bottom:12px}
input,textarea{width:100%;background:#0f0f12;border:1px solid var(--border);color:#fff;border-radius:10px;padding:12px;outline:none}
input:focus,textarea:focus{border-color:var(--accent)}
.tags{display:flex;gap:6px;flex-wrap:wrap;margin:8px 0}
.tag{background:#1e1e24;border:1px solid var(--border);padding:6px 10px;border-radius:20px;font-size:12px;cursor:pointer}
.tag:hover{border-color:var(--accent);color:var(--accent)}
.btn{background:var(--accent);color:#fff;border:0;padding:12px 18px;border-radius:10px;font-weight:700;cursor:pointer;width:100%}
.btn:disabled{opacity:.5}
.bubble{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:12px 14px;margin:10px 0;animation:pop.2s ease}
.bubble.me{border-color:var(--accent)}
.bubble.bot{border-color:#a855f7;background:#1a1325}
@keyframes pop{from{transform:scale(.96);opacity:0}to{transform:scale(1);opacity:1}}
.author{font-weight:700;font-size:14px;cursor:pointer}
.author:hover{color:var(--accent)}
.meta{font-size:11px;color:var(--muted)}
.body{margin-top:6px;line-height:1.5;word-break:break-word;white-space:pre-wrap}
.chip{background:#1e293b;border:1px solid #334155;color:#38bdf8;padding:2px 8px;border-radius:12px;font-size:11px;font-family:monospace;cursor:pointer;margin-left:4px}
.chip:active{transform:scale(.95)}
.socials{display:flex;gap:12px;margin-top:10px;font-size:13px}
.socials a{color:var(--muted);text-decoration:none}
.socials a:hover{color:var(--text)}
</style>
</head>
<body>
<div class="container">
<div class="header">
<div><b>CPM WALL</b> <span class="dot" id="connDot"></span> <small id="connText" style="color:var(--muted)">live</small></div>
<div class="socials"><a href="#"><i class="fab fa-discord"></i></a><a href="#"><i class="fab fa-tiktok"></i></a><a href="#"><i class="fab fa-youtube"></i></a></div>
</div>

<div id="pinnedBox" class="pinned"></div>

<div class="card">
<div style="display:flex;gap:8px">
<input id="userName" placeholder="Your name (2-20)" maxlength="20">
<button id="soundBtn" style="width:auto;background:#1e1e24;border:1px solid var(--border)" onclick="toggleSound()">🔇</button>
</div>

<div class="tags">
<span class="tag" onclick="insertTag('#Gearbox ')">#Gearbox</span>
<span class="tag" onclick="insertTag('#Drag ')">#Drag</span>
<span class="tag" onclick="insertTag('#RoomCode ')">#RoomCode</span>
<span class="tag" onclick="insertTag('#Trade ')">#Trade</span>
<span class="tag" onclick="insertTag('@Apex_Racer ')">@Apex_Racer</span>
</div>

<textarea id="msgInput" rows="3" maxlength="150" placeholder="Message... ID auto-detect, tag @Apex_Racer for bot reply"></textarea>
<div style="display:flex;justify-content:space-between;margin:8px 0;font-size:12px;color:var(--muted)">
<span id="charCount">0/150</span><span id="typing"></span>
</div>
<button id="sendBtn" class="btn" onclick="sendPost()">Post to Wall</button>
</div>

<div id="feed"><p style="text-align:center;color:var(--muted)">Loading wall...</p></div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
import { getFirestore, collection, query, orderBy, limit, onSnapshot, doc, getDoc } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyAOE8v7ANE6vvlHh2ZbiaJ6iHBN4voFcYM",
  authDomain: "cpm-wall-3.firebaseapp.com",
  projectId: "cpm-wall-3",
  storageBucket: "cpm-wall-3.firebasestorage.app",
  messagingSenderId: "1046950098549",
  appId: "1:1046950098549:web:example"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

const feedEl = document.getElementById('feed');
const msgInput = document.getElementById('msgInput');
const userNameInput = document.getElementById('userName');
const charCount = document.getElementById('charCount');
const typingEl = document.getElementById('typing');
const sendBtn = document.getElementById('sendBtn');
const pinnedBox = document.getElementById('pinnedBox');
const soundBtn = document.getElementById('soundBtn');
const connDot = document.getElementById('connDot');
const connText = document.getElementById('connText');

let soundEnabled = localStorage.getItem('cpm_sound')==='on';
let audioCtx, isInitialLoad=true, lastPostedMsg='', lastPostTimestamp=0, cooldownInterval=null;

function initAudio(){ if(!audioCtx) audioCtx=new (window.AudioContext||window.webkitAudioContext)(); if(audioCtx.state==='suspended') audioCtx.resume(); }
function playPing(){ if(!soundEnabled) return; try{ initAudio(); const o=audioCtx.createOscillator(), g=audioCtx.createGain(); o.type='sine'; o.frequency.setValueAtTime(880,audioCtx.currentTime); o.frequency.exponentialRampToValueAtTime(1200,audioCtx.currentTime+0.15); g.gain.setValueAtTime(0.6,audioCtx.currentTime); g.gain.exponentialRampToValueAtTime(0.01,audioCtx.currentTime+0.3); o.connect(g); g.connect(audioCtx.destination); o.start(); o.stop(audioCtx.currentTime+0.3);}catch{}}
window.toggleSound=()=>{ soundEnabled=!soundEnabled; localStorage.setItem('cpm_sound', soundEnabled?'on':'off'); soundBtn.textContent=soundEnabled?'🔊':'🔇'; if(soundEnabled) playPing(); };
if(soundEnabled) soundBtn.textContent='🔊';
document.addEventListener('click',()=>{ initAudio(); },{once:true});
window.insertTag=(t)=>{ msgInput.value+=t; msgInput.focus(); charCount.textContent=msgInput.value.length+'/150'; }

const ID_REGEX = /\b(\d{6,8}|[a-zA-Z]{2}\d{6}|[a-zA-Z]{3}\d{4})\b/g;

function renderMessageText(el, text){
  el.innerHTML='';
  let lastIndex=0, match;
  const safeText = text.replace(/</g,'&lt;');
  while((match=ID_REGEX.exec(safeText))!==null){
    if(match.index>lastIndex) el.appendChild(document.createTextNode(safeText.slice(lastIndex, match.index)));
    const chip=document.createElement('span');
    chip.className='chip'; chip.textContent=match[0]+' 📋';
    chip.onclick=()=>{ navigator.clipboard.writeText(match[0]); chip.textContent='Copied!'; setTimeout(()=>chip.textContent=match[0]+' 📋',1000); };
    el.appendChild(chip);
    lastIndex=ID_REGEX.lastIndex;
  }
  if(lastIndex<safeText.length) el.appendChild(document.createTextNode(safeText.slice(lastIndex)));
}

function timeAgo(ts){
  if(!ts) return 'Just now';
  const d=ts.toDate?ts.toDate():new Date(ts);
  const s=Math.floor((Date.now()-d)/1000);
  if(s<60) return 'Just now';
  if(s<3600) return Math.floor(s/60)+'m ago';
  if(s<86400) return Math.floor(s/3600)+'h ago';
  return Math.floor(s/86400)+'d ago';
}

function addBubble(docSnap, isNew){
 const data=docSnap.data();
 const div=document.createElement('div');
 div.className='bubble'+(data.isBot?' bot':'')+(data.name===userNameInput.value.trim()?' me':'');
 div.id=docSnap.id;
 div.innerHTML=`<div style="display:flex;justify-content:space-between"><div class="author" onclick="replyTo('${data.name.replace(/'/g,'')}')">${data.name} ${data.isVerified?'✔️':''}</div><div class="meta">${timeAgo(data.createdAt)}</div></div><div class="body"></div>`;
 renderMessageText(div.querySelector('.body'), data.message);
 if(isNew){
   feedEl.prepend(div);
   if(!isInitialLoad) playPing();
 } else {
   feedEl.appendChild(div);
 }
}
window.replyTo=(name)=>{ msgInput.value='@'+name+' '; msgInput.focus(); }

const q=query(collection(db,"posts"), orderBy("createdAt","desc"), limit(50));
onSnapshot(q,(snap)=>{
 connDot.style.background='#22c55e'; connText.textContent='live';
 if(snap.empty && isInitialLoad){ feedEl.innerHTML='<p style="text-align:center;color:var(--muted)">No messages yet. Be first!</p>'; isInitialLoad=false; return; }
 if(isInitialLoad){
   feedEl.innerHTML='';
   snap.docs.forEach(d=> addBubble(d, false));
   isInitialLoad=false;
 } else {
   snap.docChanges().forEach(ch=>{ if(ch.type==='added') addBubble(ch.doc, true); });
 }
 const pinDoc=doc(db,"pinned","current");
 getDoc(pinDoc).then(s=>{ if(s.exists()&&s.data().active){ pinnedBox.style.display='block'; pinnedBox.innerHTML=`📌 <b>${s.data().name}:</b> ${s.data().text}`; } else { pinnedBox.style.display='none'; }});
}, (err)=>{
 connDot.style.background='#ef4444'; connText.textContent='offline';
 feedEl.innerHTML='<p style="color:#ef4444">Connection lost. Refresh.</p>';
});

msgInput.addEventListener('input',()=>{
 charCount.textContent=msgInput.value.length+'/150';
 if(msgInput.value.toLowerCase().includes('@apex')) typingEl.textContent='Apex_Racer will reply...';
 else typingEl.textContent='';
});

window.sendPost=async()=>{
 const name=userNameInput.value.trim(), message=msgInput.value.trim();
 if(name.length<2||!message){ alert('Enter name 2+ and message'); return; }
 if(message===lastPostedMsg&&Date.now()-lastPostTimestamp<60000){ alert('Duplicate, wait'); return; }
 localStorage.setItem('cpm_name',name);
 sendBtn.disabled=true; sendBtn.textContent='Posting...';
 try{
  const res=await fetch('/api/post',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({name,message})});
  const data=await res.json().catch(()=>({}));
  if(res.ok){
   lastPostedMsg=message; lastPostTimestamp=Date.now(); msgInput.value=''; charCount.textContent='0/150';
   let c=15; sendBtn.textContent=`Wait ${c}s`;
   cooldownInterval=setInterval(()=>{ c--; sendBtn.textContent=c>0?`Wait ${c}s`:'Post to Wall'; if(c<=0){ clearInterval(cooldownInterval); sendBtn.disabled=false; }},1000);
   if(message.toLowerCase().includes('@apex')){ typingEl.textContent='Apex_Racer is typing...'; setTimeout(()=>typingEl.textContent='',4000); }
   playPing();
  } else { alert(data.error||'Failed'); sendBtn.disabled=false; sendBtn.textContent='Post to Wall'; }
 }catch(e){ alert('Network error'); sendBtn.disabled=false; sendBtn.textContent='Post to Wall'; }
};

userNameInput.value=localStorage.getItem('cpm_name')||'';
</script>
</body>
</html>
