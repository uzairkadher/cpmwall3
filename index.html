<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CPM Community Wall</title>
<style>
:root{--bg:#0f172a;--card:#1e293b;--border:#334155;--accent:#38bdf8;--bot:#ec4899;--text:#f8fafc;--muted:#94a3b8;--wa:#25d366;--ig:#e1306c}
*{box-sizing:border-box;margin:0;padding:0;font-family:sans-serif}
body{background:var(--bg);color:var(--text);display:flex;justify-content:center;min-height:100vh;padding:16px}
.container{width:100%;max-width:600px;display:flex;flex-direction:column;gap:16px}
header{text-align:center}header h1{color:var(--accent);text-transform:uppercase;letter-spacing:1px;font-size:1.5rem}header p{color:var(--muted);font-size:.85rem;margin-top:4px}
.social-bar{display:flex;gap:8px;flex-wrap:wrap}
.social-btn{flex:1 1 calc(33% - 8px);min-width:120px;padding:10px;border-radius:8px;color:#fff;text-decoration:none;font-size:.8rem;font-weight:600;text-align:center;display:flex;justify-content:center}
.btn-ig-profile{background:linear-gradient(45deg,#f09433,#e6683c,#dc2743,#cc2366,#bc1888)}
.btn-ig-channel{background:var(--ig)}.btn-whatsapp{background:var(--wa)}
.panel{background:var(--card);border:1px solid var(--border);border-radius:10px;padding:16px}
input,textarea{width:100%;background:#0b1329;border:1px solid var(--border);border-radius:6px;padding:10px 12px;color:var(--text);outline:none}
textarea{min-height:70px;resize:vertical}.action-row{display:flex;gap:8px;justify-content:flex-end;margin-top:10px}
button{padding:9px 16px;border:none;border-radius:6px;font-weight:600;cursor:pointer}
.btn-tag{background:#334155;color:#e2e8f0}.btn-submit{background:var(--accent);color:#0f172a}
.feed{display:flex;flex-direction:column;gap:10px;max-height:520px;overflow-y:auto}
.post{background:#111c35;border:1px solid var(--border);border-radius:8px;padding:12px}
.post.bot{border-color:var(--bot);background:#1a162b}
.author{font-weight:700;color:var(--accent);font-size:.85rem}.bot.author{color:var(--bot)}
.body{font-size:.9rem;margin-top:4px;word-break:break-word}
</style>
</head>
<body>
<div class="container">
<header><h1>CPM Community Wall</h1><p>Car Parking Multiplayer Online Hub</p></header>
<nav class="social-bar">
<a href="https://www.instagram.com/4t_jagga?cplk=Z3IyZ3Y0YWgwc3pi" target="_blank" class="social-btn btn-ig-profile">Instagram Profile</a>
<a href="https://www.instagram.com/channel/FMW8_rf52qWxlGoC/" target="_blank" class="social-btn btn-ig-channel">Instagram Channel</a>
<a href="https://wa.me/923558182875?text=hi%20I%27m%20from%20your%20website." target="_blank" class="social-btn btn-whatsapp">WhatsApp Direct</a>
</nav>
<section class="panel">
<input type="text" id="usernameInput" placeholder="Driver Tag" maxlength="25">
<textarea id="messageInput" placeholder="Share room codes or tag @Apex_Racer..." maxlength="150" style="margin-top:10px"></textarea>
<div class="action-row"><button id="tagApexBtn" class="btn-tag">@Apex_Racer</button><button id="submitBtn" class="btn-submit">Post to Wall</button></div>
</section>
<main class="panel"><div id="feedContainer" class="feed"><p style="text-align:center;color:var(--muted);font-size:.85rem">Loading...</p></div></main>
</div>
<script>
function esc(s){return s? s.toString().replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#039;'):''}
async function loadFeed(){
  try{
    const r=await fetch('/api/feed'); const posts=await r.json();
    const c=document.getElementById('feedContainer');
    if(!posts.length){c.innerHTML='<p style="text-align:center;color:var(--muted)">No posts yet.</p>';return}
    c.innerHTML=posts.map(p=>`<div class="post ${p.isBot?'bot':''}"><div class="author">${esc(p.name)}</div><div class="body">${esc(p.message)}</div></div>`).join('');
  }catch(e){console.log(e)}
}
async function sendPost(){
  const name=document.getElementById('usernameInput').value.trim()||'Anonymous';
  const msg=document.getElementById('messageInput').value.trim();
  if(!msg) return;
  const btn=document.getElementById('submitBtn'); btn.disabled=true;
  try{
    const res=await fetch('/api/post',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({name,message:msg})});
    if(!res.ok){const err=await res.json().catch(()=>({})); alert(err.error||'Failed')}
    else{
      document.getElementById('messageInput').value='';
      await loadFeed();
      if(msg.toLowerCase().includes('@apex')){setTimeout(loadFeed,2000);setTimeout(loadFeed,4500);}
    }
  }catch(e){alert('Network failed')} finally{btn.disabled=false}
}
document.getElementById('submitBtn').addEventListener('click',sendPost);
document.getElementById('tagApexBtn').addEventListener('click',()=>{const i=document.getElementById('messageInput'); if(!i.value.includes('@Apex_Racer')) i.value='@Apex_Racer '+i.value; i.focus()});
loadFeed(); setInterval(loadFeed,10000);
</script>
</body>
</html>
