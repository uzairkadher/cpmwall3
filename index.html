function drawCrown(g,cx,cy,w,h,alpha=1){
 g.save();
 g.globalAlpha*=alpha;
 const hw=w/2,hh=h/2,by=cy+hh,ty=cy-hh;
 const grd=g.createLinearGradient(cx,ty,cx,by);
 grd.addColorStop(0,'#fff6b8');
 grd.addColorStop(.45,'#ffd23f');
 grd.addColorStop(1,'#d97706');
 g.fillStyle=grd;
 g.strokeStyle='#451a03';
 g.lineWidth=Math.max(1,w*.065);
 g.lineJoin='round';
 g.beginPath();
 g.moveTo(cx-hw*.82,by);
 g.lineTo(cx-hw,ty+h*.22);
 g.lineTo(cx-hw*.45,ty+h*.58);
 g.lineTo(cx,ty);
 g.lineTo(cx+hw*.45,ty+h*.58);
 g.lineTo(cx+hw,ty+h*.22);
 g.lineTo(cx+hw*.82,by);
 g.closePath();
 g.fill();
 g.stroke();
 // Base royal band
 g.fillStyle='#b45309';
 g.fillRect(cx-hw*.78,by-h*.22,w*.78,h*.18);
 // Crown jewels
 const jr=Math.max(1.1,w*.075);
 g.fillStyle='#ff4d6d';circ(g,cx,by-h*.42,jr*1.15);
 g.fillStyle='#38bdf8';circ(g,cx-hw*.48,by-h*.32,jr*.9);circ(g,cx+hw*.48,by-h*.32,jr*.9);
 g.fillStyle='#fff';circ(g,cx,ty,jr*.85);circ(g,cx-hw,ty+h*.22,jr*.75);circ(g,cx+hw,ty+h*.22,jr*.75);
 g.restore();
}

// ===== 1. TEAM WARS EDITION CONTROLLER =====
const TEAM_CFG={
 teams:[
  {id:0,key:'A',name:'TEAM A',label:'CRIMSON',col:'#ff4d6d',soft:'rgba(255,77,109,0.22)',bg:'#260813dd'},
  {id:1,key:'B',name:'TEAM B',label:'COBALT',col:'#38bdf8',soft:'rgba(56,189,248,0.22)',bg:'#06192bdd'}

};
const TEAM={

 tieRule:null,

  this.rosters=[[],[]];

  this.survivalSum=[0,0];
  this.winTeam=-1;
  this.tieRule=null;
  this.roundOutcomeRecorded=false;
  this.introAnnounced=false;
  this.introT=0;
  this.critAnn=[false,false];
  this.lastHopeAnn=[false,false];
  this.lastElimSay=0;
  this.burstT=0;
  if(F)for(const f of F)f.team=-1;
 },
 startRound(){
  if(!ED.team||!F||F.length!==N)return;
  const idx=F.map((_,i)=>i);
  for(let i=idx.length-1;i>0;i--){const j=Math.floor(rnd()*(i+1));[idx[i],idx[j]]=[idx[j],idx[i]]}
  this.rosters=[[],[]];
  this.teamByC={};
  for(let k=0;k<idx.length;k++){
   const tm=k<TEAM_CFG.sizePerTeam?0:1;
   const f=F[idx[k]];
   f.team=tm;
   this.rosters[tm].push(f.c);
   this.teamByC[f.c]=tm;
  }
  if(this.rosters[0].length!==15||this.rosters[1].length!==15)console.error('Team Wars balance error');
  this.aliveCounts=[15,15];
  this.survivalSum=[0,0];
  this.winTeam=-1;
  this.tieRule=null;
  this.roundOutcomeRecorded=false;
  this.introAnnounced=false;
  this.introT=0;
  this.critAnn=[false,false];
  this.lastHopeAnn=[false,false];
 },

  let a=0,b=0;
  if(F)for(const f of F){if(f.on){if(f.team===0)a++;else if(f.team===1)b++}}
  this.aliveCounts=[a,b];
  return this.aliveCounts;
 },
 resolveSimultaneousTie(elims){
  // Deterministic 3-tier tie-resolution rule (never invents an ungrounded winner):
  // 1) Greater distance from arena center at elimination moment
  // 2) Higher cumulative survival time of the team during the round
  // 3) Lower minimum canonical country index on the team roster
  const e0=elims.find(e=>e.team===0),e1=elims.find(e=>e.team===1);
  const d0=e0?e0.dist:0,d1=e1?e1.dist:0;
  if(Math.abs(d0-d1)>1e-6)return{winTeam:d0>d1?0:1,rule:'distance_from_hole'};
  if(Math.abs(this.survivalSum[0]-this.survivalSum[1])>1e-6)return{winTeam:this.survivalSum[0]>this.survivalSum[1]?0:1,rule:'team_survival_time'};
  const m0=Math.min(...(this.rosters[0].length?this.rosters[0]:[999]));
  const m1=Math.min(...(this.rosters[1].length?this.rosters[1]:[999]));
  return{winTeam:m0<=m1?0:1,rule:'canonical_roster_order'};
 },
 onMemberEliminated(c){
  if(!ED.team)return;
  const tm=this.teamByC[c];
  if(tm!==0&&tm!==1)return;
  const [a,b]=this.updateCounts();
  const mine=tm===0?a:b,other=tm===0?b:a;
  const tCfg=TEAM_CFG.teams[tm],oCfg=TEAM_CFG.teams[1-tm];
  if(toast&&toast.c===c)toast.team=tm;
  teamElimS(tm);
  if(a===0||b===0)return;
  const now=performance.now();
  if(mine===1&&!this.lastHopeAnn[tm]){
   this.lastHopeAnn[tm]=true;
   const lastF=F.find(f=>f.on&&f.team===tm);
   const ln=lastF?C[lastF.c].n:'one flag';
   if(other===1){
    const oF=F.find(f=>f.on&&f.team===1-tm);
    shout('Final one versus one! '+ln+' for '+tCfg.name+' versus '+(oF?C[oF.c].n:'rival')+' for '+oCfg.name+'!','1V1 TEAM SHOWDOWN!');
   }else{
    shout('Last hope for '+tCfg.name+' '+tCfg.label+'! Only '+ln+' remains!',tCfg.name+' LAST SURVIVOR: '+ln.toUpperCase());
   }
   this.lastElimSay=now;
   return;
  }
  if(!this.critAnn[tm]&&((other-mine>=5&&mine<=7)||mine<=3)){
   this.critAnn[tm]=true;
   shout(tCfg.name+' '+tCfg.label+' is in critical danger with only '+mine+' remaining against '+other+'!',tCfg.name+' IN CRITICAL DANGER!');
   this.lastElimSay=now;
   return;

const CHAOS_POOL=[
 {id:'gravity_shift',n:'GRAVITY SHIFT',dur:6.0,col:'#b86bff',desc:'CENTER PULL SHIFTED'},
 {id:'speed_surge',n:'SPEED SURGE',dur:6.0,col:'#ff9f1c',desc:'MOVEMENT SPEED BOOSTED'},
 {id:'slow_motion',n:'SLOW MOTION',dur:4.5,col:'#22d3ee',desc:'TIME SLOWED DOWN'},
 {id:'paddle_frenzy',n:'PADDLE FRENZY',dur:5.5,col:'#ff4d6d',desc:'PADDLES IN FRENZY'},
 {id:'arena_pulse',n:'ARENA PULSE',dur:5.0,col:'#ff2bd6',desc:'ARENA SHOCKWAVE PULSES'},
 {id:'shield_wave',n:'SHIELD WAVE',dur:4.5,col:'#67e8f9',desc:'TEMPORARY SHIELDS ACTIVE'},
 {id:'direction_shift',n:'DIRECTION SHIFT',dur:5.5,col:'#80ed99',desc:'ROTATING VORTEX FLOW'}
];
const CHAOS={
 sp:1,pull:1,rot:1,slow:1,
 act:null,pend:null,nextT:6.0,lastId:'',eventsRun:0,
 pulseT:0,dirSign:1,gravHigh:true,
 introAnnounced:false,roundOutcomeRecorded:false,eventLog:[],
 restore(){
  this.sp=this.pull=this.rot=this.slow=1;
  if(this.act&&this.act.id==='shield_wave'&&F){
   for(const f of F){if(f.cw0!==undefined){f.sh=Math.max(0,f.cw0-this.act.t);delete f.cw0}}
  }
 },
 reset(){
  this.restore();
  this.act=null;this.pend=null;this.nextT=6.0;this.lastId='';this.eventsRun=0;
  this.pulseT=0;this.dirSign=1;this.gravHigh=true;
  this.introAnnounced=false;this.roundOutcomeRecorded=false;this.eventLog=[];
 },
 startRound(){
  this.reset();
 },
 pickEvent(){
  const pool=CHAOS_POOL.filter(e=>e.id!==this.lastId);
  return pool[Math.floor(rnd()*pool.length)];
 },
 activate(ev,al){
  this.restore();
  this.act={id:ev.id,n:ev.n,col:ev.col,desc:ev.desc,t:0,dur:ev.dur};
  this.lastId=ev.id;this.eventsRun++;this.eventLog.push(ev.id);
  chaosStats.eventFrequency[ev.id]=(chaosStats.eventFrequency[ev.id]||0)+1;
  saveChaosStats();
  if(ev.id==='gravity_shift'){this.gravHigh=rnd()<.5;this.pull=this.gravHigh?1.75:.4;this.act.desc=this.gravHigh?'STRONG GRAVITY PULL':'LOW GRAVITY DRIFT'}
  else if(ev.id==='speed_surge'){this.sp=1.32}
  else if(ev.id==='slow_motion'){this.slow=.58}
  else if(ev.id==='paddle_frenzy'){this.rot=rnd()<.5?1.9:-1.6;this.act.desc=this.rot<0?'REVERSE PADDLE FRENZY':'HYPER PADDLE SPIN'}
  else if(ev.id==='arena_pulse'){this.pulseT=0}
  else if(ev.id==='shield_wave'){for(const f of al){if(f.cp||(cap&&cap.f===f))continue;f.cw0=f.sh;f.sh=Math.max(f.sh,ev.dur)}}
  else if(ev.id==='direction_shift'){this.dirSign=rnd()<.5?1:-1}
  chaosActS();
  ann={s:'CHAOS · '+ev.n,t:0};
  say('Chaos event! '+ev.n.toLowerCase()+'!',2);
 },
 stopEvent(quiet){
  if(!this.act)return;
  const old=this.act;
  this.restore();
  this.act=null;
  this.nextT=t+4.5+rnd()*3.5;
  if(!quiet&&phase===0&&!speechBusy)say(old.n.toLowerCase()+' ended.',1);
 },
 applyFlagPhysics(f,dt,d){
  if(!ED.chaos||!this.act)return;
  if(this.act.id==='direction_shift'&&d>1e-5){
   const nx=f.x/d,ny=f.y/d;
   f.vx+=(-ny*this.dirSign)*.55*dt;
   f.vy+=(nx*this.dirSign)*.55*dt;
  }
 },
 tick(dt,al){
  if(!ED.chaos||phase!==0)return;
  if(!this.introAnnounced&&t>=.08){
   this.introAnnounced=true;
   ann={s:'CHAOS ARENA · EXPECT THE UNEXPECTED',t:0};
   say('Chaos Arena begins! Unpredictable events will reshape the battlefield!',2);
  }
  if(al.length<=1){if(this.act)this.stopEvent(true);this.pend=null;return}
  if(this.act){
   this.act.t+=dt;
   if(this.act.id==='arena_pulse'){
    this.pulseT+=dt;
    if(this.pulseT>=1.25){
     this.pulseT=0;
     for(const f of al){
      const d=Math.hypot(f.x,f.y)||1e-5;
      const dir=d>.55?-1:1;
      f.vx+=(f.x/d)*dir*.14;f.vy+=(f.y/d)*dir*.14;
     }
    }
   }
   if(this.act.t>=this.act.dur)this.stopEvent(false);
  }else if(this.pend){
   this.pend.w-=dt;
   if(this.pend.w<=0){const ev=this.pend.ev;this.pend=null;this.activate(ev,al)}
  }else if(t>=this.nextT){
   const ev=this.pickEvent();
   this.pend={ev,w:2.0};
   chaosWarnS();
  }
 },
 onRoundWinner(winnerC){
  if(!ED.chaos||this.roundOutcomeRecorded)return;
  this.roundOutcomeRecorded=true;
  const activeId=this.act?this.act.id:null;
  this.stopEvent(true);

   chaosStats.wins[winnerC]=(chaosStats.wins[winnerC]||0)+1;
   if(activeId&&CHAOS_IDS.has(activeId)){
    if(!chaosStats.winsUnderEvent[activeId])chaosStats.winsUnderEvent[activeId]={};
    chaosStats.winsUnderEvent[activeId][winnerC]=(chaosStats.winsUnderEvent[activeId][winnerC]||0)+1;
   }
  }
  saveChaosStats();
 },
 serialize(){return{nextT:this.nextT,lastId:this.lastId,eventsRun:this.eventsRun,introAnnounced:this.introAnnounced,roundOutcomeRecorded:this.roundOutcomeRecorded}},
 deserialize(o){
  if(!o||typeof o!=='object')return;

  this.eventsRun=safeInt(o.eventsRun,500);
  this.introAnnounced=!!o.introAnnounced;this.roundOutcomeRecorded=!!o.roundOutcomeRecorded;
 },
 drawBack(){
  if(!ED.chaos)return;
  const col=this.act?this.act.col:this.pend?this.pend.ev.col:'#d946ef';

  g.addColorStop(0,col+'38');g.addColorStop(1,'#00000000');
  ctx.fillStyle=g;ctx.fillRect(0,0,SW,SH);
  ctx.restore();
 },
 drawArenaZone(){
  if(!ED.chaos||!this.act)return;
  const tt=performance.now()/1000,col=this.act.col;
  ctx.save();
  if(this.act.id==='arena_pulse'){
   const u=(this.pulseT/1.25)%1;

  }else if(this.act.id==='direction_shift'){
   ctx.strokeStyle=col;ctx.lineWidth=2;ctx.globalAlpha=.32;
   for(let i=0;i<6;i++){const a0=tt*this.dirSign*1.8+i*PI/3;ctx.beginPath();ctx.arc(CX,CY,R*.68,a0,a0+.6);ctx.stroke()}
  }else if(this.act.id==='gravity_shift'){
   ctx.strokeStyle=col;ctx.lineWidth=2;
   for(let i=0;i<3;i++){const u=((tt*(this.gravHigh?-.45:.45)+i/3)%1+1)%1;ctx.globalAlpha=.3*(1-u);ctx.beginPath();ctx.arc(CX,CY,R*(.25+.7*u),0,PI2);ctx.stroke()}
  }
  ctx.restore();
 },
 drawHUD(){

      const lowFx=!!(adm.visual&&adm.visual.reducedEffects)||perfState.adaptiveLevel==='REDUCED';

      // Dramatic Final-5 / Critical Boss HP subtle tension pulse (phase 0 only, fair, non-obscuring)
      if(phase===0&&sd.dramaticAlerts!==false&&!lowFx&&F){
        const aliveCnt=F.reduce((acc,f)=>acc+(f.on?1:0),0);
        const bossLow=ED.boss&&BOSS.bossAlive&&BOSS.maxHp>0&&(BOSS.hp/BOSS.maxHp)<0.25;
        if((aliveCnt<=5&&aliveCnt>=2)||bossLow){
          const pulse=.18+.12*Math.sin(performance.now()/180);
          g.save();
          g.strokeStyle=bossLow?'#ff4d6d':'#ffd23f';
          g.globalAlpha=pulse;
          g.lineWidth=4;
          g.beginPath();g.arc(CX,CY,R+4,0,PI2);g.stroke();
          g.restore();
        }
      }

      // Brief Battle Intro Banner (non-blocking, vertical safe-zone)
      if(phase===0&&adm.introBanner&&sd.introEnabled!==false){
        const ib=adm.introBanner;
        const alpha=Math.max(0,Math.min(1,ib.t*4,(ib.ttl-ib.t)*3));
        g.save();g.globalAlpha=alpha;
        pill(38,154,308,46,8,'#070b1af0',ib.col);
        T(ib.title,192,175,15,ib.col,'center',AN);
        T(ib.sub,192,192,9,'#e2e8f0','center','bold system-ui,sans-serif');
        g.restore();
      }

      // Live Manual Audience Poll Bar (only when operator activates a real poll)
      if(phase===0&&adm.audiencePoll&&adm.audiencePoll.active&&ov.poll!==false){
        const p=adm.audiencePoll;
        const tot=Math.max(0,(p.votesA||0)+(p.votesB||0));
        const pctA=tot>0?Math.round((p.votesA/tot)*100):50;
        const pctB=tot>0?100-pctA:50;
        g.save();
        pill(18,522,348,22,6,'#09152cee','#22d3ee88');
        T('POLL: '+String(p.optionA||'A').slice(0,12)+' '+pctA+'%  VS  '+String(p.optionB||'B').slice(0,12)+' '+pctB+'% ('+tot+')',192,536,8.5,'#e2e8f0','center','bold system-ui,sans-serif');
        g.restore();
      }

      // Victory Screen MVP & Next-Match Teaser ("NEXT HOOK")
      if(phase===1){
        if(sd.mvpBadge!==false&&adm.roundMvp){
          g.save();
          pill(62,48,260,26,6,'#0d1430ee','#ffd23f');
          T(adm.roundMvp.role+': '+adm.roundMvp.name.toUpperCase(),192,65,10,'#ffd23f','center',AN);
          g.restore();
        }
        if(sd.nextMatchTeaser!==false&&ov.nextTeaser!==false){
          const nextQ=adm.battleQueue&&adm.battleQueue.length?adm.battleQueue[0]:null;
          const nextTxt=nextQ?('NEXT UP: '+(nextQ.label||EDS[nextQ.editionIdx]?.n||'QUEUED MATCH').toUpperCase().slice(0,28)):(APPS.has(rivalryHist.lastRunnerUp)&&APPS.has(rivalryHist.lastWinner)?'NEXT UP: CAN '+C[rivalryHist.lastWinner].n.toUpperCase()+' DEFEND THE CROWN?':'NEXT BATTLE LOADING...');
          g.save();
          pill(26,676,332,20,5,'#09152cee','#22d3ee99');
          T(nextTxt,192,689,8.5,'#67e8f9','center','bold system-ui,sans-serif');
          g.restore();
        }
      }

      const showShowcase=adm.activeMatchType==='showcase'||(IS_PREVIEW&&adm.previewState.showcaseBanner);
      if(showShowcase&&ov.showcaseBadge!==false){
        g.save();
        pill(52,134,280,22,5,'#3b0a18ee','#ff4d6d');
        T('OPERATOR-CONTROLLED SHOWCASE',192,149,10,'#ffd23f','center',AN);
        g.restore();
      }
      if(adm.topSupporter&&ov.topSupporter!==false){
        g.save();
        pill(12,516,176,22,5,'#0d1430ee','#ffd23f88');
        T('TOP SUPPORTER: '+String(adm.topSupporter.name).toUpperCase().slice(0,14),100,530,8,'#ffd23f','center','bold system-ui,sans-serif');
        g.restore();
      }
      if(adm.supporterCelebration&&ov.topSupporter!==false){
        const sc3=adm.supporterCelebration;
        const alpha=Math.max(0,Math.min(1,(sc3.ttl-sc3.t)*2));
        g.save();g.globalAlpha=alpha;
        pill(42,162,300,44,8,'#13102bee','#ffd23f');
        T('SUPPORTER BOOST · '+sc3.supporter.toUpperCase(),192,180,9,'#ffd23f','center','bold system-ui,sans-serif');
        T(sc3.country.toUpperCase()+' · '+sc3.effect,192,197,13,'#fff','center',AN);
        g.restore();
      }
      if(adm.featuredComment&&ov.featuredComment!==false){
        const fc=adm.featuredComment;
        const alpha=fc.ttl>0?Math.max(0,Math.min(1,(fc.ttl-fc.t)*2)):1;
        g.save();g.globalAlpha=alpha;
        pill(12,640,360,30,6,'#09152cf2','#22d3ee');
        T('@'+String(fc.user).slice(0,18)+': '+String(fc.text).slice(0,42),192,659,9.5,'#e2e8f0','center','bold system-ui,sans-serif');
        g.restore();
      }
      if(adm.emergencyStop){
        g.save();
        g.fillStyle='rgba(7,11,26,0.82)';
        g.fillRect(0,0,SW,SH);
        pill(32,265,320,110,10,'#2a0a14f5','#ff4d6d');
        T('EMERGENCY STOP ACTIVE',192,306,22,'#ff4d6d','center',AN);
        T('GAMEPLAY PAUSED · RECORDS PRESERVED',192,334,10,'#e2e8f0','center','bold system-ui,sans-serif');
        T('AWAITING OPERATOR RESUME',192,354,9,'#9aa4c7','center');
        g.restore();
      }else if(adm.paused){
        g.save();
        pill(112,292,160,44,8,'#070b1ae8','#22d3ee');
        T('PAUSED',192,322,24,'#22d3ee','center',AN);
        g.restore();
      }
    },
    getSnapshot(){
      const alive=F?F.filter(x=>x.on):[];
      const el=Math.max(0,(Date.now()-rStart)/1000);
      const durLimit=ED.lim||ED.bt?60:(adm.activeMatchDuration||0);
      return {
        ts:Date.now(),
        isPreview:IS_PREVIEW,
        isStreamSafe:IS_STREAM_SAFE,
        phase,
        round,
        paused:adm.paused,
        emergencyStop:adm.emergencyStop,
        autoBattle:adm.autoBattle,
        editionIdx:curEi,
        editionName:ED?ED.n:'Classic',
        editions:EDS.map((e,i)=>({idx:i,name:e.n})),
        matchType:adm.activeMatchType,
        showcaseWinner:adm.activeShowcaseWinner,
        nextMatchType:adm.nextMatchType,
        nextShowcaseWinner:adm.nextShowcaseWinner,
        elapsedSec:+el.toFixed(1),
        remainingSec:durLimit?Math.max(0,+(durLimit-el).toFixed(1)):null,
        totalFlags:N,
        aliveCount:alive.length,
        eliminatedCount:outs?outs.length:0,
        activeEvent:EV.act?{id:EV.act.id,name:EVDEF[EV.act.id]?.n||EV.act.id,t:+EV.act.t.toFixed(1),d:EV.act.d}:null,
        boss:ED.boss?{alive:BOSS.bossAlive,country:APPS.has(BOSS.bossC)?C[BOSS.bossC].n:'',hp:Math.round(BOSS.hp||0),maxHp:Math.round(BOSS.maxHp||100),dmg:Math.round(BOSS.damageTakenRound||0)}:null,
        king:ED.king?{alive:KING.kingAlive,country:APPS.has(KING.kingC)?C[KING.kingC].n:''}:null,
        storm:ED.storm?{stage:STORM.stage,dangerCount:STORM.dangerCount,elims:STORM.elims}:null,
        team:ED.team?{aAlive:alive.filter(f=>f.team===0).length,bAlive:alive.filter(f=>f.team===1).length,aWins:teamStats.teamAWins,bWins:teamStats.teamBWins}:null,
        aliveFlags:alive.slice(0,30).map(f=>({
          id:f.c,
          name:C[f.c]?.n||'',
          shield:+(f.sh||0).toFixed(1),
          supBoost:+(f.supBoost||0).toFixed(1),
          inHole:!!f.h,
          inDanger:!!f.inDanger,
          team:f.team,
          isBoss:!!(ED.boss&&BOSS.bossAlive&&f.c===BOSS.bossC),
          isKing:!!(ED.king&&KING.kingAlive&&f.c===KING.kingC),
          hp:ED.boss&&f.c===BOSS.bossC?Math.round(BOSS.hp||0):100
        })),
        battleQueue:adm.battleQueue,
        countryConfig:adm.countryConfig,
        supporterLimits:adm.supporterLimits,
        roundSupporterEffects:adm.roundSupporterEffects,
        gameplay:adm.gameplay,
        visual:adm.visual,
        showDirector:adm.showDirector,
        audiencePoll:adm.audiencePoll,
        rivalryHistory:rivalryHist,
        perf:perfState,
        diagnostics:diagnostics.slice(0,30),
        tourney,
        tourneyHistory:tourneyHistory.slice(-20),
        champ,
        life,
        session:S,
        achievements:ACHIEVEMENTS,
        achievementRecords:achievementRecords.slice(-100),
        kingStats,teamStats,suddenStats,bossStats,chaosStats,powerStats,
        recentResults:readJson(HIST_KEY,[]).slice(0,30),
        showcaseResults:readJson(SHOW_KEY,[]).slice(0,30),
        countries:APP.filter(i=>validCountry(C[i]?.n)).map(i=>({id:i,name:C[i].n,wins:life.w[i]||0,champWins:champ[i]||0}))
      };
    },
    handleCommand(cmd){
      if(!cmd||typeof cmd!=='object')return{ok:false,error:'Invalid command'};
      const {action,payload={}}=cmd;
      try{
        switch(action){
          case 'battle.start':
            if(adm.emergencyStop)return{ok:false,error:'Clear Emergency Stop first.'};
            adm.paused=false;start(payload.override||null);break;
          case 'battle.pause':
            adm.paused=true;break;
          case 'battle.resume':
            if(adm.emergencyStop)return{ok:false,error:'Clear Emergency Stop first.'};
            adm.paused=false;break;
          case 'battle.restart':
            if(adm.emergencyStop)return{ok:false,error:'Clear Emergency Stop first.'};
            adm.paused=false;start();break;
          case 'battle.skip':
            if(adm.emergencyStop)return{ok:false,error:'Clear Emergency Stop first.'};
            adm.paused=false;start();break;
          case 'battle.set_edition':
            if(EDS[+payload.editionIdx]){adm.paused=false;setEdition(+payload.editionIdx);if(phase===4)fin()}break;
          case 'battle.set_auto':
            adm.autoBattle=!!payload.autoBattle;adm.saveConfig();break;
          case 'battle.set_duration':
            adm.gameplay.battleDuration=Math.max(20,Math.min(180,+payload.battleDuration||60));
            adm.gameplay.customDurationEnabled=!!payload.customDurationEnabled;
            adm.saveConfig();break;
          case 'battle.select_countries':
            if(Array.isArray(payload.countries)){
              const clean=payload.countries.map(Number).filter(i=>APPS.has(i)&&validCountry(C[i]?.n));
              start({countries:clean,editionIdx:Number.isInteger(+payload.editionIdx)?+payload.editionIdx:curEi,matchType:payload.matchType||'normal',showcaseWinner:payload.showcaseWinner});
            }break;
          case 'battle.set_queue':
            adm.battleQueue=sanitizeConfig({battleQueue:payload.queue}).battleQueue;adm.saveConfig();break;
          case 'battle.trigger_event':
            return adm.triggerSpecialEvent(payload.eventId);
          case 'country.update_config':
            adm.countryConfig=sanitizeConfig({countryConfig:{...adm.countryConfig,...payload}}).countryConfig;adm.saveConfig();break;
          case 'match.set_mode':
            adm.nextMatchType=payload.matchType==='showcase'?'showcase':'normal';
            adm.nextShowcaseWinner=APPS.has(+payload.showcaseWinner)&&validCountry(C[+payload.showcaseWinner]?.n)?+payload.showcaseWinner:-1;
            adm.autoResetShowcaseAfterMatch=payload.autoResetShowcaseAfterMatch!==false;
            adm.saveConfig();break;
          case 'match.start_showcase':
            if(adm.emergencyStop)return{ok:false,error:'Clear Emergency Stop first.'};
            if(!APPS.has(+payload.showcaseWinner)||!validCountry(C[+payload.showcaseWinner]?.n))return{ok:false,error:'Valid showcase winner required.'};
            adm.paused=false;
            start({matchType:'showcase',showcaseWinner:+payload.showcaseWinner,editionIdx:Number.isInteger(+payload.editionIdx)?+payload.editionIdx:curEi,countries:Array.isArray(payload.countries)?payload.countries:[]});
            break;
          case 'supporter.trigger_effect':
            return adm.applySupporterEffect(payload.effectType,payload.countryId,payload.supporterName);
          case 'supporter.celebrate':
            adm.supporterCelebration={supporter:String(payload.supporterName||'Top Supporter').slice(0,32),country:String(payload.countryName||'Arena').slice(0,28),effect:String(payload.message||'SUPPORTER CELEBRATION!').slice(0,36),t:0,ttl:5};
            if(payload.topSupporter)adm.topSupporter={name:String(payload.topSupporter).slice(0,24)};
            chime();break;
          case 'supporter.update_limits':
            adm.supporterLimits={...adm.supporterLimits,...payload};adm.saveConfig();break;
          case 'audience.feature_comment':
            adm.featuredComment={user:String(payload.user||'Viewer').slice(0,24),text:String(payload.text||'').slice(0,80),t:0,ttl:Number(payload.ttl)||10};break;
          case 'audience.clear_featured':
            adm.featuredComment=null;break;
          case 'audience.poll_update':
            adm.audiencePoll={
              active:!!payload.active,
              question:String(payload.question||'').slice(0,60),
              optionA:String(payload.optionA||'Option A').slice(0,24),
              optionB:String(payload.optionB||'Option B').slice(0,24),
              votesA:Math.max(0,Math.floor(Number(payload.votesA)||0)),
              votesB:Math.max(0,Math.floor(Number(payload.votesB)||0))
            };break;
          case 'tournament.start':
          case 'tournament.pause':
            break;
          case 'tournament.reset':
            tourney={id:(tourney.id||1)+1,round:0,scores:{},wins:{},results:[]};
            saveTournament();break;
          case 'settings.update_gameplay':
            adm.gameplay={...adm.gameplay,...payload};adm.saveConfig();break;
          case 'settings.update_visual_audio':
            adm.visual={...adm.visual,...payload,overlays:{...adm.visual.overlays,...(payload.overlays||{})}};
            syncAudioGains();
            if(adm.visual.announcerEnabled===false&&window.speechSynthesis){try{speechSynthesis.cancel()}catch(_){}}
            adm.saveConfig();break;
          case 'showdirector.update':
            adm.showDirector=sanitizeConfig({showDirector:{...adm.showDirector,...payload,enabledEvents:{...adm.showDirector.enabledEvents,...(payload.enabledEvents||{})}}}).showDirector;
            adm.saveConfig();break;
          case 'showdirector.trigger_special':
            return adm.triggerShowDirectorSpecial(payload.specialType);
          case 'showdirector.return_normal':
            EV.end();adm.introBanner=null;adm.featuredComment=null;adm.supporterCelebration=null;adm.audiencePoll.active=false;adm.activeSpecialTag='';
            adm.nextMatchType='normal';adm.nextShowcaseWinner=-1;adm.paused=false;adm.saveConfig();break;
          case 'diagnostics.clear':
            diagnostics.length=0;break;
          case 'recovery.reload_storage':
            if(!IS_PREVIEW&&typeof location!=='undefined'&&location.reload){setTimeout(()=>location.reload(),120);}
            break;
          case 'recovery.safe_reset':
            LS.set('fca_state','');adm.paused=false;adm.emergencyStop=false;EV.end();start();break;
          case 'config.undo':
          case 'config.rollback':
            if(payload.config){
              const cleanCfg=sanitizeConfig(payload.config);
              Object.assign(adm,cleanCfg);
              syncAudioGains();
              adm.saveConfig();
            }break;
          case 'emergency.stop':
            adm.emergencyStop=true;adm.paused=true;EV.end();adm.supporterCelebration=null;
            if(window.speechSynthesis){try{speechSynthesis.cancel()}catch(_){}}
            save();saveS();break;
          case 'emergency.resume':
            adm.emergencyStop=false;adm.paused=false;break;
          case 'preview.test':
            if(IS_PREVIEW){
              if(payload.type==='showcase')adm.previewState.showcaseBanner=!!payload.enabled;
              if(payload.type==='comment')adm.featuredComment={user:payload.user||'ViewerPreview',text:payload.text||'Go Pakistan! Live Preview Test',t:0,ttl:8};
              if(payload.type==='celebration')adm.supporterCelebration={supporter:payload.supporter||'VIP_Fan',country:payload.country||'Brazil',effect:'SHIELD BOOST',t:0,ttl:6};
              if(payload.type==='event'&&EVDEF[payload.eventId])EV.go(payload.eventId,{mag:1,hidden:0},F.filter(x=>x.on));
              if(payload.type==='announcement')ann={s:String(payload.text||'PREVIEW ANNOUNCEMENT').slice(0,40),t:0};
              if(payload.type==='intro')adm.introBanner={title:'RIVALRY SHOWDOWN',sub:'PREVIEW BATTLE INTRO',col:'#ffd23f',t:0,ttl:4};
              if(payload.type==='poll')adm.audiencePoll={active:true,question:'Next Match?',optionA:'Brazil',optionB:'Argentina',votesA:0,votesB:0};
              if(payload.type==='clear'){adm.previewState.showcaseBanner=false;adm.featuredComment=null;adm.supporterCelebration=null;adm.introBanner=null;adm.audiencePoll.active=false;ann=null}
            }break;
          case 'ping':
            break;
          default:
            return{ok:false,error:'Unhandled command'};
        }
        adm.broadcastState();
        return{ok:true};
      }catch(e){
        recordDiagnostic('admin_bridge',e.message||'Command failed',action);
        return{ok:false,error:e.message||'Command failed'};
      }
    }
  };

  let bc=null;
  try{
    if(typeof BroadcastChannel!=='undefined'&&!IS_PREVIEW){
      bc=new BroadcastChannel('fca_admin_channel');
      bc.onmessage=ev=>{
        const msg=ev.data;
        if(!msg||msg.target!=='game')return;
        const res=adm.handleCommand(msg);
        bc.postMessage({target:'admin',type:'ack',reqId:msg.reqId,res});
      };
    }
  }catch(_){}

  adm.broadcastState=()=>{
    if(IS_PREVIEW)return;
    const snap=adm.getSnapshot();
    if(bc){try{bc.postMessage({target:'admin',type:'telemetry',data:snap})}catch(_){}}
  };

  if(IS_PREVIEW){
    window.addEventListener('message',ev=>{
      if(ev.origin!==location.origin)return;
      if(ev.data&&ev.data.target==='preview'){
        adm.handleCommand(ev.data);
      }
    });
  }else{
    setInterval(()=>{adm.broadcastState()},350);
  }

  window.__FCA_ADM__=adm;
  window.__FCA_EVENT_BUS__={
    // Standardized internal event interface prepared for future platform integrations
    version:'1.1.0',
    connectedPlatforms:[],
    emitViewerRequest(user,countryName,comment){
      if(!validCountry(countryName))return{ok:false,error:'Excluded country'};
      const reqs=readJson(AUD_KEY,[]);
      const rec={id:'req_'+Date.now()+'_'+Math.floor(Math.random()*999),user:String(user||'Viewer').slice(0,32),country:String(countryName).trim(),comment:String(comment||'').slice(0,140),status:'pending',source:'internal_manual',at:new Date().toISOString()};
      reqs.unshift(rec);writeJson(AUD_KEY,reqs.slice(0,300));
      return{ok:true,record:rec};
    },
    emitGiftEvent(supporter,countryName,giftName,value){
      if(!validCountry(countryName))return{ok:false,error:'Excluded country'};
      const data=readJson(SUP_KEY,{supporters:[],gifts:[]});
      const gift={id:'gift_'+Date.now(),supporter:String(supporter||'Supporter').slice(0,32),country:String(countryName).trim(),gift:String(giftName||'Arena Boost').slice(0,40),value:Math.max(1,Math.min(100000,+value||1)),source:'internal_manual',at:new Date().toISOString()};
      data.gifts.unshift(gift);data.gifts=data.gifts.slice(0,500);
      writeJson(SUP_KEY,data);
      return{ok:true,record:gift};
    }
  };
})();

</script></body>
