<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no,interactive-widget=resizes-content">
<title>CPM Community Wall - Empire Studio</title>

  if (!localStorage.getItem('wall_token')) {
    window.location.href = '/login';
  }
</script>
<link rel="manifest" href="/manifest.json">
<link rel="stylesheet" href="/design-tokens.css">
<meta name="theme-color" content="#0a0a0f">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<style>
/* Empire Studio Global Resets & Application Shell */
* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
  -webkit-tap-highlight-color: transparent;
}
html, body {
  height: 100%;
  width: 100%;
  overflow: hidden;
  font-family: var(--font-sans);
}
body {
  background-color: var(--bg-obsidian);
  color: var(--text-primary);
  display: flex;
  justify-content: center;
  position: fixed;
  inset: 0;
  height: 100dvh;
  padding: 0;
}
.container {
  width: 100%;
  max-width: 640px;
  height: 100%;
  display: flex;
  flex-direction: column;
  position: relative;
  overflow: hidden;
  background: var(--bg-obsidian);
}

/* Header & Top Nav */
.header {
  background: var(--bg-obsidian);
  border-bottom: 1px solid var(--border-strong);
  padding: var(--space-2);
  display: flex;
  align-items: center;
  justify-content: space-between;
  flex-shrink: 0;
  z-index: 50;
  position: sticky;
  top: 0;
}
.header-brand {
  display: flex;
  align-items: center;
  gap: 12px;
}
.header-logo {
  width: 40px;
  height: 40px;
  border-radius: var(--radius-sm);
  background: var(--surface-raised);
  border: 1px solid var(--cyan);
  display: grid;
  place-items: center;
  font-size: 10px;
  font-weight: bold;
  color: var(--cyan);
}
.header-title {
  display: flex;
  flex-direction: column;
}
.header-title h1 {
  font-size: 16px;
  font-weight: 700;
  color: var(--text-primary);
}
.header-presence {
  font-size: 12px;
  color: var(--text-secondary);
  display: flex;
  align-items: center;
  gap: 6px;
}
.header-presence .dot { color: var(--success); text-shadow: 0 0 8px var(--success); }

.user-pill {
  display: flex;
  align-items: center;
  gap: 6px;
  background: var(--warning);
  color: #000;
  padding: 4px 12px;
  border-radius: var(--radius-pill);
  font-weight: 700;
  font-size: 12px;
  cursor: pointer;
}

.header-right-actions {
  display: flex;
  gap: 8px;
}
.ctrl-btn {
  background: transparent;
  border: 1px solid var(--cyan);
  color: var(--cyan);
  padding: 4px 8px;
  border-radius: var(--radius-sm);
  font-size: 11px;
  font-weight: 600;
  cursor: pointer;
  display: flex;
  flex-direction: column;
  align-items: center;
}

/* Room Navigation */
.room-bar {
  display: flex;
  gap: 8px;
  padding: 12px var(--space-2);
  flex-shrink: 0;
}
.room-tab {
  flex: 1;
  background: transparent;
  border: 1px solid var(--border-strong);
  color: var(--text-secondary);
  padding: 10px 8px;
  border-radius: var(--radius-sm);
  font-size: 13px;
  font-weight: 600;
  cursor: pointer;
  text-align: center;
}
.room-tab.active {
  border-color: var(--cyan);
  color: var(--cyan);
  box-shadow: 0 0 8px rgba(0,245,255,0.2);
}

/* Banners & Pinned */
.pinned-banner {
  background: rgba(10, 10, 15, 0.9);
  border: 1px solid var(--border-subtle);
  margin: 0 var(--space-2) var(--space-1);
  padding: 10px 14px;
  border-radius: var(--radius-sm);
  font-size: 13px;
  color: var(--text-primary);
  display: flex;
  align-items: center;
  gap: 8px;
  flex-shrink: 0;
}
.pinned-banner b { color: var(--text-primary); font-weight: 600; }
.pinned-banner span.pink-text { color: #ff00ff; }

/* Action Chips */
.action-chips {
  display: flex;
  gap: 8px;
  padding: 0 var(--space-2) 12px;
  overflow-x: auto;
  scrollbar-width: none;
  flex-shrink: 0;
}
.action-chip {
  padding: 6px 12px;
  border-radius: var(--radius-sm);
  font-size: 12px;
  font-weight: 600;
  color: #fff;
  white-space: nowrap;
  border: none;
  cursor: pointer;
}
.chip-green { background: #10b981; }
.chip-blue { background: #3b82f6; }
.chip-orange { background: #f97316; }
.chip-pink { background: #ec4899; }

/* Filter & Search */
.filter-row {
  display: flex;
  margin: 0 var(--space-2) var(--space-1);
  background: var(--surface-raised);
  border: 1px solid var(--border-strong);
  border-radius: var(--radius-sm);
  padding: 4px 12px;
  align-items: center;
}
.filter-row input {
  background: transparent;
  border: none;
  outline: none;
  color: var(--text-primary);
  font-size: 13px;
  flex: 1;
  height: 36px;
}

/* Skeletons & Empty States */
.skeletons-wrapper {
  display: flex;
  flex-direction: column;
  gap: var(--space-2);
  padding: var(--space-2);
}
.skeleton-card {
  height: 72px;
  border-radius: var(--radius-lg);
  width: 85%;
}
.empty-state {
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  padding: 60px 20px;
  text-align: center;
  color: var(--text-secondary);
}

/* Feed */
.feed {
  display: flex;
  flex-direction: column;
  gap: 12px;
  flex: 1 1 0;
  min-height: 0;
  overflow-y: auto;
  padding: var(--space-2);
  padding-bottom: calc(180px + var(--safe-area-bottom));
  scrollbar-width: thin; 
  scrollbar-color: var(--border-strong) transparent;
}
.bubble {
  max-width: 90%;
  padding: 14px;
  border-radius: 12px;
  background: transparent;
  border: 1px solid var(--border-strong);
  align-self: flex-start;
  display: flex;
  flex-direction: column;
  gap: 6px;
}
.bubble.me { align-self: flex-end; }
.bubble.vip { border-color: var(--cyan); box-shadow: 0 0 10px rgba(0,245,255,0.1); }
.bubble.bot { border-color: #ec4899; box-shadow: 0 0 10px rgba(236,72,153,0.1); }

.bubble.frame-gold-trim { border-color: #f59e0b; }
.bubble.frame-neon-purple { border-color: #a855f7; box-shadow: 0 0 10px rgba(168,85,247,0.2); }
.bubble.frame-carbon { border: 1px dashed #555; background: #111; }

.author-line {
  display: flex;
  align-items: center;
  justify-content: space-between;
}
.author {
  font-weight: 700;
  font-size: 14px;
  color: var(--cyan);
  display: flex;
  gap: 6px;
  align-items: center;
}
.author.bot-name { color: #ec4899; }
.meta { font-size: 11px; color: var(--text-muted); }
.bot-badge { background: #ec4899; color: #fff; font-size: 10px; padding: 2px 6px; border-radius: 4px; font-weight: 700; }
.vip-badge { background: #f59e0b; color: #000; font-size: 10px; padding: 2px 6px; border-radius: 4px; font-weight: 700; }

.body {
  font-size: 15px;
  line-height: 1.4;
  word-break: break-word;
  color: var(--text-primary);
}
.text-color-gold { color: #f59e0b; }
.text-color-red { color: #ef4444; }
.text-color-purple { color: #a855f7; }
.text-color-green { color: #10b981; }
.text-color-cyan { color: #06b6d4; }
.text-color-default { color: #ffffff; }

.bubble-actions {
  display: flex;
  align-items: center;
  gap: 8px;
  margin-top: 6px;
}
.reaction-btn {
  background: rgba(255,255,255,0.05);
  border: 1px solid var(--border-subtle);
  color: var(--text-secondary);
  font-size: 12px;
  cursor: pointer;
  padding: 4px 10px;
  border-radius: 12px;
  display: flex;
  align-items: center;
  gap: 4px;
}

/* Composer / Input Panel */
.input-panel {
  position: absolute;
  bottom: var(--safe-area-bottom);
  left: 0;
  right: 0;
  background: var(--bg-obsidian);
  border-top: 1px solid var(--border-strong);
  padding: 12px;
  display: flex;
  flex-direction: column;
  gap: 10px;
  z-index: 100;
}
.composer-row {
  display: flex;
  align-items: center;
  gap: 8px;
  overflow-x: auto;
  scrollbar-width: none;
  font-size: 12px;
  color: var(--text-secondary);
}
.comp-chip {
  background: transparent;
  border: 1px solid var(--border-strong);
  color: var(--text-secondary);
  padding: 4px 10px;
  border-radius: var(--radius-pill);
  cursor: pointer;
  white-space: nowrap;
}
.color-dot {
  width: 16px;
  height: 16px;
  border-radius: 50%;
  cursor: pointer;
  border: 2px solid transparent;
}
.color-dot.active { border-color: #fff; }
.bg-gold { background: #f59e0b; }
.bg-red { background: #ef4444; }
.bg-purple { background: #a855f7; }
.bg-green { background: #10b981; }
.bg-cyan { background: #06b6d4; }

.frame-btn {
  background: transparent;
  border: 1px solid var(--border-strong);
  color: var(--text-secondary);
  padding: 4px 10px;
  border-radius: var(--radius-pill);
  cursor: pointer;
  white-space: nowrap;
}
.frame-btn.active { border-color: var(--cyan); color: var(--cyan); }

.input-row { display: flex; flex-direction: column; gap: 8px; }
.input-field-wrap {
  display: flex;
  background: var(--surface-raised);
  border: 1px solid var(--border-strong);
  border-radius: var(--radius-sm);
  padding: 8px 12px;
  align-items: center;
}
.input-field-wrap input {
  background: transparent;
  border: none;
  color: var(--text-primary);
  font-size: 14px;
  flex: 1;
  outline: none;
}
.input-bottom { display: flex; justify-content: space-between; align-items: center; }
.char-num { font-size: 12px; color: var(--text-muted); }
.send-btn {
  background: linear-gradient(90deg, #06b6d4, #a855f7);
  border: none;
  color: #fff;
  font-weight: 700;
  padding: 8px 24px;
  border-radius: var(--radius-sm);
  cursor: pointer;
  display: flex;
  align-items: center;
  gap: 6px;
}
.send-btn:disabled { opacity: 0.5; cursor: not-allowed; }

/* Toast System */
.toast-container {
  position: fixed;
  bottom: calc(200px + var(--safe-area-bottom));
  right: 16px;
  z-index: 9999;
  display: flex;
  flex-direction: column;
  gap: 8px;
  pointer-events: none;
}
.toast {
  background: var(--surface-raised);
  border-left: 4px solid var(--cyan);
  color: var(--text-primary);
  padding: 12px;
  border-radius: var(--radius-sm);
  font-size: 13px;
  border: 1px solid var(--border-subtle);
  border-left-width: 4px;
  pointer-events: auto;
}
</style>
</head>
<body>
<div id="toastContainer" class="toast-container" role="status" aria-live="polite"></div>

<div class="container">
  <div class="header">
    <div class="header-brand">
      <div class="header-logo">CPM</div>
      <div class="header-title">
        <h1>Car Parking Multiplayer</h1>
        <div class="header-presence">
          <span class="dot">●</span> Lobby Chat | <span id="onlineCount">12 Online</span>
        </div>

    </div>
    <div id="userPill" class="user-pill" onclick="window.location.href='/settings'">
      <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
      <span id="topUsername">@user</span> 👑
    </div>
    <div class="header-right-actions">
      <button type="button" class="ctrl-btn">Alerts<br>On</button>

  </div>

  <div class="room-bar">
    <button type="button" class="room-tab active">🌐 Public Wall</button>
    <button type="button" class="room-tab">🛒 Marketplace</button>
    <button type="button" class="room-tab">🔒 VIP Lounge</button>
  </div>

  <div id="pinnedBanner" class="pinned-banner">
    📌 <b>Administration Team</b> · 👑 <span class="pink-text">VIP Lounge & pinned slots available</span> >
  </div>

  <div class="action-chips">
    <button class="action-chip chip-green">🥞 Tip Jar</button>
    <button class="action-chip chip-blue">🔗 Share</button>
    <button class="action-chip chip-orange">📷 IG Profile</button>
    <button class="action-chip chip-pink">▶ IG Channel</button>
    <button class="action-chip chip-green">💬 WhatsApp</button>
  </div>

  <div class="filter-row">
    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="var(--text-secondary)" stroke-width="2" style="margin-right:8px;"><circle cx="11" cy="11" r="8"/><path d="M21 21l-4.3-4.3"/></svg>
    <input id="searchInput" placeholder="Search wall messages, drivers, or #tags..." maxlength="100">
  </div>

  <div id="feedSkeletons" class="skeletons-wrapper">
    <div class="skeleton-card skeleton-shimmer"></div>
    <div class="skeleton-card skeleton-shimmer me"></div>
  </div>

  <div id="feed" class="feed"></div>

  <form id="admin-login-box" style="display:none;" onsubmit="event.preventDefault(); handleAdminLogin();"></form>

  <div class="input-panel">
    <div class="composer-row">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20.59 13.41l-7.17 7.17a2 2 0 0 1-2.83 0L2 12V2h10l8.59 8.59a2 2 0 0 1 0 2.82z"></path><line x1="7" y1="7" x2="7.01" y2="7"></line></svg> Tag
      <button type="button" class="comp-chip" onclick="addTag('@Apex_Racer')">@Apex_Racer</button>
      <button type="button" class="comp-chip" onclick="addTag('#Gearbox')">#Gearbox</button>
      <button type="button" class="comp-chip" onclick="addTag('#Drag')">#Drag</button>
      <button type="button" class="comp-chip" onclick="addTag('#RoomCode')">#RoomCode</button>
    </div>
    
    <div class="composer-row">
      Text Color:
      <div class="color-dot bg-gold active" onclick="selectColor('gold')"></div>
      <div class="color-dot bg-red" onclick="selectColor('red')"></div>
      <div class="color-dot bg-purple" onclick="selectColor('purple')"></div>
      <div class="color-dot bg-green" onclick="selectColor('green')"></div>
      <div class="color-dot bg-cyan" onclick="selectColor('cyan')"></div>
    </div>
    
    <div class="composer-row">
      Bubble Frame:
      <button type="button" class="frame-btn active" onclick="selectFrame('gold-trim')">Gold Trim</button>
      <button type="button" class="frame-btn" onclick="selectFrame('neon-purple')">Neon Purple</button>
      <button type="button" class="frame-btn" onclick="selectFrame('carbon')">Carbon Fiber</button>
    </div>

    <div class="composer-row">
      <button type="button" class="comp-chip" onclick="addTag('🚗')">🚗</button>
      <button type="button" class="comp-chip" onclick="addTag('🔥')">🔥</button>
      <button type="button" class="comp-chip" onclick="addTag('👍')">👍</button>
      <button type="button" class="comp-chip" onclick="addTag('🤝')">🤝</button>
      <button type="button" class="comp-chip" onclick="addTag('💀')">💀</button>
    </div>

    <div class="input-row">
      <div class="input-field-wrap">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="var(--text-secondary)" stroke-width="2" style="margin-right:8px;"><circle cx="12" cy="12" r="10"/><path d="M8 14s1.5 2 4 2 4-2 4-2"/><line x1="9" y1="9" x2="9.01" y2="9"/><line x1="15" y1="9" x2="15.01" y2="9"/></svg>
        <input id="msgInput" placeholder="Type message, room code, or ID..." maxlength="250" autocomplete="off">
      </div>

        <button id="sendBtn" class="send-btn" onclick="sendPost()">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="22" y1="2" x2="11" y2="13"></line><polygon points="22 2 15 22 11 13 2 9 22 2"></polygon></svg>
          Post to Wall

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
import { getFirestore, collection, onSnapshot, query, orderBy, limit, doc } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

const EXPECTED_PROJECT = "cpmwall3";
const firebaseConfig = {
  apiKey: "AIzaSyAOE8v7ANE6vvlHh2ZbiaJ6iHBN4voFcYM",
  authDomain: `${EXPECTED_PROJECT}.firebaseapp.com`,
  projectId: EXPECTED_PROJECT
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);
const token = localStorage.getItem('wall_token');
let currentUser = localStorage.getItem('wall_user') || 'user';
let isUserVip = false;
let isUserAdmin = false;

window.fetchProfile = async () => {};
window.updateUsername = async () => {};
window.updatePassword = async () => {};
window.handleAdminLogin = async () => {};

window.showToast = (msg, isError = false) => {
  const container = document.getElementById('toastContainer');
  const toast = document.createElement('div');
  toast.className = `toast ${isError ? 'error' : ''}`;
  toast.textContent = msg;
  container.appendChild(toast);
  setTimeout(() => {
    toast.style.opacity = '0';
    setTimeout(() => toast.remove(), 250);
  }, 3000);
};

function escapeHtml(unsafe) {
  if (!unsafe) return '';
  return String(unsafe)
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;")
    .replace(/'/g, "&#039;");
}

async function verifyAuthAndProfile() {
  if (!token) {
    window.location.href = '/login';
    return;
  }
  try {
    const res = await fetch('/api/user/me', {
      headers: { 'Authorization': `Bearer ${token}` }
    });
    if (res.ok) {
      const data = await res.json();
      currentUser = String(data.username).toUpperCase();
      localStorage.setItem('wall_user', currentUser);
      isUserVip = Boolean(data.isVip);
      isUserAdmin = data.isAdmin === true;
      document.getElementById('topUsername').textContent = '@' + escapeHtml(currentUser);
    } else {
      localStorage.removeItem('wall_token');
      localStorage.removeItem('wall_user');
      window.location.href = '/login';
    }
  } catch {}
}
verifyAuthAndProfile();

const feedEl = document.getElementById('feed');
const msgInput = document.getElementById('msgInput');
const sendBtn = document.getElementById('sendBtn');
const charCount = document.getElementById('charCount');
const onlineCountEl = document.getElementById('onlineCount');
const searchInput = document.getElementById('searchInput');

let currentRoom = 'public';
let isInitialLoad = true;
let activeSearchQuery = '';
let selectedColor = 'gold';
let selectedFrame = 'gold-trim';
let lastBotPing = 0;

window.selectColor = (c) => {
  selectedColor = c;
  document.querySelectorAll('.color-dot').forEach(el => el.classList.remove('active'));
  event.target.classList.add('active');
};
window.selectFrame = (f) => {
  selectedFrame = f;
  document.querySelectorAll('.frame-btn').forEach(el => el.classList.remove('active'));
  event.target.classList.add('active');
};

function updateCharCounterDisplay() {
  const len = msgInput.value.length;
  charCount.textContent = `${len}/250`;
}

window.addTag = (tag) => {
  if (!msgInput.value.includes(tag)) {
    msgInput.value += (msgInput.value ? ' ' : '') + tag;
  }
  updateCharCounterDisplay();
  saveDraft();
  msgInput.focus();
};

window.saveDraft = () => {
  localStorage.setItem('cpm_draft', msgInput.value);
};

msgInput.addEventListener('input', () => {
  updateCharCounterDisplay();
  saveDraft();
});

const draft = localStorage.getItem('cpm_draft');
if (draft) {
  msgInput.value = draft;
  updateCharCounterDisplay();
}

async function pingHeartbeat() {
  if (!token) return;
  try {
    const r = await fetch('/api/heartbeat', { 
      method: 'POST', 
      headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${token}` } 
    });
    const d = await r.json();
    if (d && d.online && onlineCountEl) onlineCountEl.textContent = `${d.online} Online`;
  } catch {}
}
pingHeartbeat();
setInterval(pingHeartbeat, 30000);

function timeAgo(date) {
  const seconds = Math.floor((new Date() - date) / 1000);
  if (seconds < 45) return 'Just now';
  if (seconds < 3600) return `${Math.floor(seconds / 60)}m ago`;
  return `${Math.floor(seconds / 3600)}h ago`;
}

function buildBubble(id, data) {
  if (data.isShadowbanned || data.shadowbanned) return null;

  const isMe = Boolean(currentUser && data.name && data.name.toUpperCase() === currentUser);
  const isBot = Boolean(data.isBot);
  const isAdminPost = (data.name && data.name.toUpperCase() === 'ADMIN' || data.isAdmin);
  const isVipPost = isAdminPost || Boolean(data.isVip);

  const bubble = document.createElement('div');
  let bubbleClasses = `bubble ${isMe ? 'me' : ''} ${isVipPost ? 'vip' : ''} ${isBot ? 'bot' : ''}`;
  
  if (data.frame && ['gold-trim', 'neon-purple', 'carbon'].includes(data.frame)) {
    bubbleClasses += ` frame-${data.frame}`;
  }
  bubble.className = bubbleClasses;
  if (id) bubble.id = `post-${id}`;
  bubble.setAttribute('data-text', (data.message || '').toLowerCase());
  bubble.setAttribute('data-name', (data.name || '').toLowerCase());

  const authorLine = document.createElement('div');
  authorLine.className = 'author-line';
  const author = document.createElement('div');
  author.className = `author ${isBot ? 'bot-name' : ''}`;
  author.textContent = escapeHtml(data.name);

  if (isAdminPost) {
    const adminTag = document.createElement('span');
    adminTag.className = 'vip-badge';
    adminTag.textContent = 'VIP';
    author.appendChild(adminTag);
  } else if (isBot) {
    const botTag = document.createElement('span');
    botTag.className = 'bot-badge';
    botTag.textContent = 'BOT';
    author.appendChild(botTag);
  } else if (isVipPost) {
    const vipTag = document.createElement('span');
    vipTag.className = 'vip-badge';
    vipTag.textContent = 'VIP';
    author.appendChild(vipTag);
  }

  authorLine.appendChild(author);
  const meta = document.createElement('div');
  meta.className = 'meta';
  meta.textContent = timeAgo(data.createdAt?.toDate ? data.createdAt.toDate() : new Date());
  authorLine.appendChild(meta);

  const bodyEl = document.createElement('div');
  bodyEl.className = 'body';
  if (data.color && ['gold', 'red', 'purple', 'green', 'cyan', 'default'].includes(data.color)) {
    bodyEl.classList.add(`text-color-${data.color}`);
  }
  bodyEl.textContent = data.message || '';

  bubble.appendChild(authorLine);
  bubble.appendChild(bodyEl);

  const actionsEl = document.createElement('div');
  actionsEl.className = 'bubble-actions';
  const likeBtn = document.createElement('button');
  likeBtn.type = 'button';
  likeBtn.className = 'reaction-btn';
  likeBtn.innerHTML = DOMPurify.sanitize(`🔥 <span id="like-${id}">${data.likes || 0}</span>`);
  actionsEl.appendChild(likeBtn);

  bubble.appendChild(actionsEl);
  return bubble;
}

searchInput.addEventListener('input', (e) => {
  activeSearchQuery = e.target.value.trim().toLowerCase();
  const bubbles = feedEl.querySelectorAll('.bubble');
  bubbles.forEach((b) => {
    const text = b.getAttribute('data-text') || '';
    const name = b.getAttribute('data-name') || '';
    if (!activeSearchQuery || text.includes(activeSearchQuery) || name.includes(activeSearchQuery)) {
      b.style.display = 'flex';
    } else {
      b.style.display = 'none';
    }
  });
});

const q = query(collection(db, "posts"), orderBy("createdAt", "desc"), limit(100));
onSnapshot(q, (snap) => {
  const skel = document.getElementById('feedSkeletons');
  if (skel) skel.style.display = 'none';

  if (isInitialLoad) {
    feedEl.innerHTML = '';
    snap.docs.forEach(docSnap => {
      const b = buildBubble(docSnap.id, docSnap.data());
      if (b) feedEl.appendChild(b);
    });
    isInitialLoad = false;
    return;
  }

  snap.docChanges().forEach((change) => {
    if (change.type === 'added') {
      const id = change.doc.id;
      if (document.getElementById(`post-${id}`)) return;
      const b = buildBubble(id, change.doc.data());
      if (b) feedEl.prepend(b);
    }
    if (change.type === 'modified') {
      const countEl = document.getElementById(`like-${change.doc.id}`);
      if (countEl) countEl.textContent = change.doc.data().likes || 0;
    }
    if (change.type === 'removed') {
      const el = document.getElementById(`post-${change.doc.id}`);
      if (el) el.remove();
    }
  });
});

let isPosting = false;

window.sendPost = async () => {
  if (!token) {
    window.location.href = '/login';
    return;
  }
  const sentText = msgInput.value;
  const message = sentText.trim();
  
  if (!message || isPosting) return;
  if (message.length > 250) {
    window.showToast("Message exceeds 250 characters.", true);
    return;
  }
  
  if (!['default', 'gold', 'red', 'purple', 'green', 'cyan'].includes(selectedColor)) {
    window.showToast("Unsupported color.", true);
    return;
  }
  
  if (!['gold-trim', 'neon-purple', 'carbon'].includes(selectedFrame)) {
    window.showToast("Unsupported frame.", true);
    return;
  }

  if (message.includes('@Apex_Racer')) {
    if (Date.now() - lastBotPing < 60000) {
      window.showToast("Please wait 60s before pinging the bot again.", true);
      return;
    }
    lastBotPing = Date.now();
  }

  isPosting = true;
  sendBtn.disabled = true;
  
  try {
    const res = await fetch('/api/post', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${token}` },
      body: JSON.stringify({ 
        message, 
        room: currentRoom, 
        color: selectedColor,
        frame: selectedFrame
      })
    });
    
    if (res.ok) {
      if (msgInput.value === sentText) {
        msgInput.value = '';
        localStorage.removeItem('cpm_draft');
      }
      updateCharCounterDisplay();
    } else if (res.status === 429) {
      const d = await res.json().catch(() => ({}));
      window.showToast(d.error || 'Rate limit exceeded. Please wait.', true);
    } else {
      const d = await res.json().catch(() => ({}));
      window.showToast(d.error || 'Failed to post', true);
    }
  } catch {
    window.showToast('Network failed - post may not have sent. Check wall.', true);
  } finally {
    isPosting = false;
    sendBtn.disabled = false;
  }
};

msgInput.addEventListener('keydown', (e) => { 
  if (e.key === 'Enter' && !e.isComposing) {
    e.preventDefault();
    sendPost(); 
  }
});
</script>
